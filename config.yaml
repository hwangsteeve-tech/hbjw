# 크제비 추천 기준 설정
# 점수 = 키워드 가중치 합 + 예산/마감/지역 보정. 제목 기준으로 매칭합니다(대소문자 무시).

# 우리 회사가 잘하는 분야 → 가점
positive:
  UX: 5
  UI: 4
  사용자경험: 5
  디자인: 3
  플랫폼: 3
  서비스: 2
  챗봇: 4
  생성형: 3
  LLM: 3
  에이전트: 3
  RAG: 3
  앱: 3
  모바일: 3
  웹: 2
  홈페이지: 3
  포털: 3
  구축: 2
  고도화: 2
  개편: 2
  차세대: 2
  AX: 2
  디지털: 1
  지능형: 1

# 핵심 역량과 거리가 먼 분야 → 감점
negative:
  유지관리: -3
  운영: -2
  연구용역: -3
  기획연구: -3
  정책연구: -3
  정보조사: -3
  실증: -2
  데이터 수집: -2
  데이터 가공: -2
  교육: -2
  콘텐츠 제작: -1
  전자저작물: -2
  인프라: -2
  클라우드: -1

# 제목에 포함되면 추천 대상에서 아예 제외
exclude:
  - 장비
  - 설치
  - 공사
  - 폐기물
  - 감리
  - 행사
  - 경진대회
  - 해커톤
  - 아이디어톤
  - 챌린지
  - 자격증
  - 위탁
  - 인력 양성
  - 인력양성
  - 도서
  - 국방
  - 반도체
  - 냉동

budget:
  min: 50000000             # 이보다 작으면 감점
  preferred_min: 100000000  # 선호 구간 하한 (가점)
  preferred_max: 10000000000 # 선호 구간 상한 (100억)

deadline:
  min_days_left: 7          # 입찰공고 마감까지 남은 일수가 이보다 적으면 감점

# 참여 가능한 지역 (참여지역에 하나라도 포함되면 OK)
regions_ok:
  - 전국
  - 서울

thresholds:
  strong: 8   # 이 점수 이상: 강력 추천
  review: 4   # 이 점수 이상: 검토 추천
