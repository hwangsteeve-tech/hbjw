chapters:
# =====================================================================
- num: Ⅰ
  title: 사업 이해 및 전략
  toc: [사업 이해, 1차 자산 승계, 목표 시스템, 추진 전략, 관련 실적]
  slides:
  - kind: visual
    title: 한 번의 질문으로 **근거까지** — 인하대 학생 통합 AI 창구
    subtitle: "1차년도 취업포털 RAG 챗봇 승계 → 진로·취업 + 규정집 + 대학생활·시설 통합, 개인화 · 품질 관리 자동화 (앵커사업)"
    eval: ["방향 · 전략"]
    facts:
      - {label: 발주기관, value: "인하대학교\n앵커사업본부"}
      - {label: 사업기간, value: "계약일부터 약 3개월\n(’27년 2월 종료 전)"}
      - {label: 사업금액, value: "1억 원\n(VAT 포함)"}
      - {label: 범위, value: "3개 안내 영역\n요구사항 52개"}

  - title: 1. 사업 이해 — 취업포털 챗봇에서 학생 통합 AI 창구로
    headline: "1차년도 챗봇을 **버리지 않고 승계**하여 3개 영역으로 넓히고, !!근거 · 개인화 · 품질 유지!!를 더해 지속 운영 기반을 만듦"
    eval: ["방향 · 전략"]
    conclusion: "핵심은 기능 수가 아니라 **오픈 후에도 정확도가 유지되는 운영 체계**"
    columns:
      - w: 1.4
        blocks:
          - type: table
            size: 10.5
            header: [구분, 1차년도, 2차년도 (본 사업)]
            widths: [2.4, 4, 6.4]
            rows:
              - [안내 영역, 진로·취업, "진로·취업 + 규정집 + 대학생활·시설"]
              - [진입점, 취업포털 챗봇, "단일 진입점 · 자동 라우팅 · 홈페이지 위젯"]
              - [검색 품질, 기본 RAG, "하이브리드 · 재순위화 · 표 구조 · 유효기간"]
              - [개인화, "-", "SSO · 프로필 · 개인 지식공간 · 맞춤 추천"]
              - [운영 관리, 기본 관리, "부서 권한 · 피드백 · 동의어 · 자동 회귀평가"]
              - [LLM, 외부 API, "Multi-LLM · 온프레미스 전환 구조"]
      - w: 1
        blocks:
          - type: cards
            cols: 1
            size: 10.5
            items:
              - {title: 학생, desc: ["한 번의 질문으로 근거 · 바로가기", "마감 · 만료 정보 명시", "개인 프로필 맞춤 추천"]}
              - {title: 상담 인력, desc: ["반복 문의 감소", "상담 필요 질의는 신청 연결", "부서 화면에서 직접 답변 수정"]}
              - {title: 앵커사업, desc: ["이용 실적 · 품질 지표", "성과 보고 양식 내려받기", "LLM 토큰 비용 관리"]}

  - title: 2. 1차 자산 승계 — 2주 안에 진단하고 이어 씀
    headline: "착수 2주 안에 1차 챗봇의 **소스 · 지식베이스 · 관리자 · 운영환경**을 진단해 재사용 · 개선 · 교체를 판정하고, !!무중단 병행 운영!!으로 이관"
    eval: ["방향 · 전략", 구현방안]
    columns:
      - w: 1
        blocks:
          - type: flow
            size: 10.5
            steps:
              - {title: 자산 인수, desc: "소스 · 산출물"}
              - {title: 진단, desc: "현 품질 기준선"}
              - {title: 판정, desc: "재사용 · 개선 · 교체"}
              - {title: 이관, desc: "병행 운영"}
          - type: table
            size: 10.5
            header: [승계 대상, 처리]
            widths: [3.6, 7]
            rows:
              - [취업포털 지식베이스, "재사용 + 게시일 · 유효기간 보강"]
              - [RAG 파이프라인, "하이브리드 검색 · 재순위화 추가"]
              - [관리자 기능, "에이전트 · 부서 권한 구조로 확장"]
              - [대화 · 피드백 이력, "암호화 이관 → 평가셋 후보"]
      - w: 1
        blocks:
          - type: panel
            title: 소스 미제공 시 대안
            blocks:
              - type: bullets
                size: 10.5
                items:
                  - {text: "동일 기능을 공통 모듈로 재구현 (신규 3개 영역과 같은 틀)"}
                  - {text: "지식베이스는 원천 재수집으로 승계 — 메타데이터까지 새로 확보"}
                  - {text: "현 서비스는 신규 오픈 시점까지 병행 운영"}
                  - {text: "1차 구축사 · 스택 · 소스 범위는 【질의 후 확인】"}

  - title: 3. 목표 시스템 — 모듈 단위 · 공급자 무종속
    headline: "수집 · 지식 · 에이전트 · 서비스를 **컨테이너 단위로 분리**하고, LLM은 추상화 계층 뒤에 두어 **외부 API ↔ 온프레미스를 설정으로 전환**"
    req: SFR-01
    eval: ["창의성 · 우수성", "기술 · 보안"]
    conclusion: "운영 SW는 모두 공개 SW — **사업 종료 후 라이선스 추가 비용 0원**"
    blocks:
      - type: layers
        side_w: 5.6
        layers:
          - {name: 접점, items: ["대표 홈페이지 위젯", "취업포털 위젯", 전체화면, "관리자 · 부서 콘솔"], side: "SSO · 비로그인"}
          - {name: 서비스, items: ["스트리밍 · 멀티턴", "프로필 · 개인 지식공간", "피드백 · 통계"], side: "REST API"}
          - {name: 에이전트, items: [라우터, 취업 · 진로, 규정집, 대학생활 · 시설], side: "콘솔에서 추가"}
          - {name: 지식 · 검색, items: ["하이브리드 · 재순위화", 벡터 DB, 동의어 사전, 권한 필터], side: "영역별 지식베이스"}
          - {name: 수집, items: [포털 수집기, 규정 파서, 홈페이지 크롤러, 증분 인덱싱], side: "1일 1회 이상"}
          - {name: LLM, items: ["추상화 계층", "외부 API ① · ②", "온프레미스 (조건부)"], side: "보안 게이트웨이"}

  - title: 4. 추진 전략과 성과 목표
    headline: "**근거가 보이는 답변 · 한 창구 세 에이전트 · 떨어지지 않는 품질 · 부서가 직접 운영** — 정식 오픈 전 정확도 · 정합성 90%, 할루시네이션 3% 이하"
    eval: ["방향 · 전략", "창의성 · 우수성"]
    columns:
      - w: 1.4
        blocks:
          - type: cards
            cols: 2
            size: 10.5
            items:
              - {title: "① 근거가 보이는 답변", desc: ["출처 카드 · 규정 조문 카드", "마감 · 만료 명시", "근거 없으면 소관부서 안내"]}
              - {title: "② 한 창구, 세 에이전트", desc: ["의도 자동 라우팅 90%↑", "복수 영역 결과 종합", "낮은 신뢰도는 선택지 제시"]}
              - {title: "③ 떨어지지 않는 품질", desc: ["변경 시 자동 회귀평가", "기준 미달 반영 보류", "의심 답변 자동 선별"]}
              - {title: "④ 부서가 직접 운영", desc: ["소유 · 공유 · 관리 권한", "피드백 자동 배정", "동의어 즉시 반영"]}
      - w: 1
        blocks:
          - type: kpi
            h: 2.4
            items:
              - {value: "90%↑", label: "정확도 · 정합성"}
              - {value: "3%↓", label: "할루시네이션"}
          - type: table
            size: 10
            header: [지표, 목표]
            widths: [4, 3]
            rows:
              - [라우팅 정확도, "90% 이상"]
              - [평가셋, "300문항 이상"]
              - [동시 사용자, "300명 (피크 500)"]
              - [첫 응답, "평균 3초 이내"]

  - title: 5. 관련분야 실적 — 생성형 AI Agent · 교육 서비스
    headline: "근거를 함께 보여 주는 **Trading AI Agent**, 답변을 자동 채점하는 **MOSAIC**, 학생이 쓰기 쉬운 **교육 플랫폼 ‘모두’** 경험을 그대로 적용"
    eval: [관련분야 실적]
    columns:
      - w: 1.3
        blocks:
          - type: table
            size: 10
            header: [사업, 기간, 발주처]
            widths: [7.4, 2.8, 2.6]
            rows:
              - ["Trading AI Agent 개발 (근거 위치 제시형)", "2026", "에스케이㈜"]
              - ["MES AI Agent 'MOSAIC' (자동 평가 · 관제)", "2026", "에스케이㈜"]
              - ["국립중앙박물관 교육 플랫폼 ‘모두’ 유지보수 · 개선", "2024~25", 국립중앙박물관]
              - ["LG LIFE 및 그룹 홈페이지 운영", "2026", ㈜엘지씨엔에스]
              - ["【대학 · 공공 RAG 챗봇 / 대학 정보서비스 실적】", "【기간】", "【발주처】"]
      - w: 1
        blocks:
          - type: cards
            cols: 1
            size: 10.5
            items:
              - {title: 근거 제시 → 출처 · 조문 카드, desc: ["Trading AI Agent 응답 구조", "근거 데이터 위치를 함께 제시", "→ SFR-01 · 05 근거 표시"]}
              - {title: 자동 평가 → 회귀평가 · 의심 답변 선별, desc: ["MOSAIC Judge Agent", "정확성 · 근거 충실도 자동 채점", "→ SFR-13 · QUR-03"]}
              - {title: 교육 UX → 위젯 · 단일 진입점, desc: ["iF Design Award 2023 (모두)", "프로그램 탐색 · 신청 UX", "→ SFR-09 위젯 · 접근성"]}

# =====================================================================
- num: Ⅱ
  title: 제안 내용
  toc: [검색 품질 · 기능 확장, 규정집, 대학생활 · 시설, 라우팅 · UI, 운영 · 품질, 개인화 · LLM]
  slides:
  - title: 1. 진로·취업 답변 품질 고도화 · 기능 확장
    headline: "**하이브리드 검색 + 재순위화 + 표 구조 보존**으로 근거를 정확히 찾고, 마감된 공고는 마감을 명시하며, 답변에 **신청 · 공지 바로가기와 상담 연계**를 붙임"
    req: SFR-02, SFR-03
    eval: ["창의성 · 우수성"]
    columns:
      - w: 1.2
        blocks:
          - type: flow
            size: 10
            steps:
              - {title: 질의 확장, desc: "동의어 · 맥락"}
              - {title: 하이브리드, desc: "키워드 + 의미"}
              - {title: 필터, desc: "유효기간 · 권한"}
              - {title: 재순위화, desc: "근거 5~8건"}
              - {title: 답변, desc: "출처 카드"}
          - type: table
            size: 10
            header: [요구, 구현]
            widths: [3.4, 8]
            rows:
              - [표 · 첨부, "HWP · PDF 표를 행 · 열 구조로 보존해 표 안의 값까지 답변"]
              - [시점 정보, "현재 유효 정보 우선, 마감 건은 ‘마감됨(날짜)’"]
              - [설정 변경, "회귀평가 통과 시에만 운영 반영"]
      - w: 1
        blocks:
          - type: table
            size: 10
            header: [질의, 답변 + 연결]
            widths: [4.6, 5.6]
            rows:
              - ["“이번 주 마감 IT 공고?”", "유효 공고 + 상세 링크"]
              - ["“자소서 첨삭 신청”", "요약 + 신청 바로가기"]
              - ["“상담 받고 싶어”", "상담 신청 · 담당자"]
          - type: cards
            cols: 2
            size: 10
            items:
              - {title: 추천 질문, desc: ["관리자 설정 + 통계 자동", "도메인별 노출", "최근 2주 인기 질의 보충"]}
              - {title: 대화 이력, desc: ["로그인 사용자 조회", "대화 내용 복사", "SSO 개인화 연동"]}

  - title: 2. 규정집 — 조문 단위 구조화와 근거 안내
    headline: "현행 규정 전체를 **편 · 장 · 절 · 조 · 항 · 호 트리**로 파싱해 조문으로 답하고, 준용 · 위임과 상위 · 하위 규정을 함께 보여 주며 **해석은 소관부서로**"
    req: SFR-04, SFR-05
    eval: ["창의성 · 우수성"]
    columns:
      - w: 1
        blocks:
          - type: flow
            size: 10
            steps:
              - {title: 목록화, desc: "규정명 · 시행일"}
              - {title: 파싱, desc: "조문 트리"}
              - {title: 연결, desc: "부칙 · 별표"}
              - {title: 이력, desc: "현행 우선"}
          - type: table
            size: 10
            header: [구조화 요구, 구현]
            widths: [3.4, 7.2]
            rows:
              - [별표 · 서식, "본문 연결, 표 구조 보존"]
              - [개정 이력, "현행 우선 검색, 폐지 규정 제외"]
              - [갱신, "자동 수집 / 불가 시 콘솔 등록"]
      - w: 1
        blocks:
          - type: table
            size: 10
            header: [안내 요구, 구현]
            widths: [3.4, 7.2]
            rows:
              - [근거 조문, "규정명 · 조 · 항 · 호 + 원문 링크 카드"]
