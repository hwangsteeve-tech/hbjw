      - {title: 조문 검색, desc: "학칙 · 학사규정"}
      - {title: 참조 추적, desc: "준용 · 위임"}
      - {title: 위계 구분, desc: "상위 · 하위"}
      - {title: 답변, desc: "조문 카드 + 소관부서"}
    - type: kpi
      items:
      - {value: "100", unit: "%", label: "규정 답변 안내 문구 ·\n소관부서 연락처 부착"}
      - {value: "0", unit: 건, label: "폐지 규정 근거\n사용"}
      - {value: "90", unit: "%↑", label: "근거 정합성\n(조문 일치)"}

  - header: 3. 대학생활·시설 안내
    h2: 3.1 홈페이지 콘텐츠 수집 · 인덱싱
    h3: 3.1.1 수집 인벤토리 · 증분 인덱싱
    req: SFR-06
    summary: "(전수 식별 후 증분 갱신) 대표 홈페이지와 지정 시설 홈페이지의 공개 콘텐츠를 **인벤토리(URL · 유형 · 갱신 주기 · 소관부서)** 로 확정하고, 신규 · 변경 · 삭제만 감지해 1일 1회 이상 재인덱싱함"
    blocks:
    - type: table
      size: 9.5
      header: [수집 대상, 콘텐츠, 수집 주기 (설정 가능)]
      widths: [4, 8, 4]
      rows:
      - ["대표 홈페이지 (www.inha.ac.kr)", "공지사항 · 학사일정 · 조직 · 부서 안내 · FAQ", "1일 1회 (공지 6시간)"]
      - [정석학술정보관, "운영시간 · 위치 · 이용방법 · 연락처 · 공지", 1일 1회]
      - [생활관, "입사 안내 · 시설 이용 · 공지 · FAQ", 1일 1회]
      - ["학생진로설계포털 (job.inha.ac.kr)", "채용 · 프로그램 · 비교과 · 상담 안내", "1일 2회"]
      - ["【추가 지정 사이트】", "요구분석 단계 확정 (요구사항정의서 붙임)", "【주기】"]
    - type: process
      rows:
      - {label: 변경 감지, items: ["사이트맵 · 목록 페이지 비교", "본문 해시 비교"], result: "신규·변경·삭제"}
      - {label: 수집, items: ["본문 + 첨부(HWP · PDF)", "게시일 · 게시기간 메타데이터"], result: "원문 저장"}
      - {label: 증분 인덱싱, items: ["변경 건만 재청킹 · 재임베딩", "삭제 건 인덱스 제거"], result: "최신 인덱스"}
    - type: table
      size: 9.5
      header: [수집 정책, 내용]
      widths: [4, 12]
      rows:
      - [robots · 부하, "robots.txt 준수, 요청 간격 【2초】 이상, 수집 시간대 02:00~06:00, 동시 연결 【2개】 이하"]
      - [교내망 경로, "교내망 내부 수집 서버에서 직접 접근 (외부 경유 없음)"]
      - [범위 구분, "실시간 개인화 데이터(좌석 · 예약 · 대출 · 선발 결과)는 바로가기만 제공, 조회 연계는 별도 범위"]

  - header: 3. 대학생활·시설 안내
    h2: 3.2 대학생활·시설 콘텐츠 안내
    h3: 3.2.1 공식 출처 우선 · 만료 처리
    req: SFR-07
    summary: "(공식 출처가 이김) 같은 정보가 여러 사이트에 있으면 **소관부서가 게시한 공식 출처를 우선**하고, 게시기간이 끝난 공지 · 행사는 만료를 명시하거나 안내에서 제외함"
    blocks:
    - type: table
      size: 9.5
      header: [질의 예, 근거 · 답변 방식]
      widths: [5.6, 10.4]
      rows:
      - ["“도서관 시험기간 운영시간 알려줘”", "정석학술정보관 공지(공식 출처) + 운영시간 표, 게시일 · 링크 표시"]
      - ["“2학기 수강신청 언제야?”", "학사일정(대표 홈페이지) 기준, 지난 일정은 ‘종료됨’ 표시"]
      - ["“생활관 행정실 전화번호?”", "최신 조직 · 부서 안내 기준 연락처, 개편 시 갱신"]
      - ["“열람실 지금 자리 있어?”", "실시간 조회 범위 외 → 좌석현황 시스템 바로가기 안내"]
    - type: boxes
      cols: 3
      size: 9.5
      items:
      - {title: 공식 출처 우선, desc: "콘텐츠별 소관부서 메타데이터 → 소관부서 게시물 가중치 상향, 출처 사이트 · 링크 표시"}
      - {title: 만료 정보 처리, desc: "게시기간 만료 시 ‘만료’ 표기 또는 안내 제외 (관리자 설정)"}
      - {title: 조직 정보 갱신, desc: "조직 · 부서 안내 페이지 우선 수집, 개편 시 담당자 일괄 갱신 화면"}
    - type: point
      color: green
      title: 실시간 데이터는 다음 단계로 열어 둠
      text: "좌석 · 예약 · 대출 · 생활관 선발 결과는 이번 범위에서 바로가기로 안내하되, 같은 에이전트에 연계 도구만 추가하면 조회할 수 있도록 REST 연계 지점을 설계에 포함합니다 (INR-01)."

  - header: 4. 에이전트 · UI/UX
    h2: 4.1 에이전트 생성 및 자동 라우팅
    h3: 4.1.1 3개 에이전트 · 자동 라우팅
    req: SFR-08
    summary: "(한 창구에서 알아서 나눔) 질문 의도를 분석해 **취업 · 규정 · 대학생활 에이전트로 자동 라우팅**하고, 여러 영역에 걸친 질문은 결과를 합쳐 하나의 답으로 주며, 신뢰도가 낮으면 영역을 고르게 함"
    blocks:
    - type: process
      rows:
      - {label: 의도 분석, items: ["경량 분류 모델 + 키워드 규칙", "영역별 신뢰도 점수"], result: "신뢰도"}
      - {label: 라우팅, items: ["단일 영역 → 해당 에이전트", "복수 영역 → 병렬 실행 후 종합"], result: "에이전트"}
      - {label: 보완 흐름, items: ["신뢰도 < 기준값(관리자 설정)", "영역 선택지 제시"], result: "사용자 선택"}
      - {label: 학습 · 보정, items: ["라우팅 결과 · 신뢰도 로깅", "오분류 사례 → 규칙 추가 · 재학습"], result: "정확도 90%↑"}
    - type: table
      size: 9.5
      header: [에이전트 설정 항목, 내용]
      widths: [4, 12]
      rows:
      - [지식베이스 범위, "영역 · 부서 · 공유받은 데이터 단위 지정 (SFR-10 권한 연동)"]
      - [프롬프트 · 답변 정책, "시스템 프롬프트 버전, 고정 안내 문구, 금칙 · 민감 질의 정책"]
      - [담당 부서 · 사용 LLM, "피드백 배정 부서, 에이전트별 모델 선택 (외부 API / 온프레미스)"]
      - [추가 · 비활성화, "소스 수정 없이 콘솔에서 생성 · 수정 · 비활성화 (예: 산학협력 · 평생교육)"]
    - type: kpi
      items:
      - {value: "3", unit: 개, label: "기본 에이전트\n(취업 · 규정 · 생활)"}
      - {value: "90", unit: "%↑", label: "라우팅 정확도\n(평가셋 기준)"}
      - {value: "0", unit: 줄, label: "에이전트 추가 시\n소스 수정"}

  - header: 4. 에이전트 · UI/UX
    h2: 4.2 사용자 UI/UX 개편 및 홈페이지 탑재
    h3: 4.2.1 단일 진입점 · 위젯 · 답변 카드
    req: SFR-09, INR-03
    summary: "(어디서나 같은 챗봇) 발주기관 디자인 가이드로 UI를 개편하고, **스크립트 삽입형 위젯(플로팅 · 팝업)과 전체화면 모드**로 대표 홈페이지 · 취업포털에 탑재하며, KWCAG 2.2를 준수함"
    blocks:
    - type: table
      size: 9.5
      header: [화면 요소, 구성]
      widths: [3.6, 12.4]
      rows:
      - [단일 진입점, "통합 질의창 + 도메인 칩(취업 · 규정 · 대학생활/시설) 선택 시 해당 에이전트 고정"]
      - [위젯, "플로팅 버튼 → 팝업 대화창, 스크립트 1줄 삽입, 사이트별 첫 화면 · 추천 질문 설정"]
      - [전체화면, "대화 이력 · 개인 지식공간 · 프로필이 있는 확장 모드 (로그인 사용자)"]
      - [답변 카드, "출처 카드(사이트 · 게시일) · 규정 조문 카드 · 링크 바로가기 · 마감 표시 배지"]
      - [반응형 · 접근성, "PC · 태블릿 · 모바일, KWCAG 2.2 (키보드 · 스크린리더 · 명도 대비 4.5:1), 점검 결과 제출"]
    - type: flow
      steps:
      - {title: 디자인 가이드, desc: "착수 후 수령"}
      - {title: UI 개발표준, desc: "인하대 CI · GUI"}
      - {title: 시안 · 검토, desc: "W3~W4"}
      - {title: 위젯 탑재, desc: "운영부서 협의"}
      - {title: 접근성 점검, desc: "결과서 제출"}
    - type: point
      color: green
      title: 교육 서비스 UX 경험 적용
      text: "iF Design Award 수상 교육 플랫폼 ‘모두’를 설계한 UX 인력이 학생 이용 흐름(질문 → 근거 확인 → 신청 이동)을 3단계 안에 끝나도록 화면을 설계합니다."

  - header: 5. 운영 · 품질 관리
    h2: 5.1 데이터 관리 권한 체계
    h3: 5.1.1 소유 · 공유 · 관리 3종 권한 분리
    req: SFR-10, SFR-14
    summary: "(데이터는 부서의 것) 지식베이스 데이터마다 **소유 · 공유 · 관리 권한을 분리**해 부서 · 사용자 · 에이전트 단위로 부여하고, 공유되지 않은 데이터는 답변 근거로 쓰이지 않게 검색 단계에서 막음"
    blocks:
    - type: table
      size: 9.5
      header: [권한, 보유자, 할 수 있는 일, 할 수 없는 일]
      widths: [2.4, 3.8, 5.8, 4]
      rows:
      - [소유권한, "등록 부서 / 지정 소관부서", "수정 · 삭제 · 공개 범위 · 타 부서 공유 부여", "-"]
      - [공유권한, "소유 부서가 지정한 부서 · 에이전트", "조회 · 답변 근거 활용", "수정 · 삭제"]
      - [관리권한, "시스템 관리자 · 위임 담당자", "인덱싱 · 비활성화 · 품질 관리", "내용 수정 (소유 부서 승인 필요)"]
    - type: process
      rows:
      - {label: 권한 부여, items: ["조직 정보 기준 부서 매핑", "부서 · 사용자 · 에이전트 단위"], result: "권한 매트릭스"}
      - {label: 검색 필터, items: ["에이전트 공유 범위를 검색 조건에 강제 적용", "범위 밖 문서는 후보에서 제외"], result: "근거 차단"}
      - {label: 이력, items: ["부여 · 변경 · 회수 이력 기록", "부서 담당자 전용 화면 (SFR-14)"], result: "감사 추적"}
    - {type: note, text: "※ ‘공유되지 않은 데이터 미사용’은 시험평가에서 범위 밖 문서를 유도하는 질의 【30문항】으로 검증 (TER-01)"}
    - type: point
      color: navy
      title: 부서가 주인인 지식베이스
      text: "예컨대 생활관이 등록한 입사 안내는 생활관만 고칠 수 있고, 취업 에이전트에는 공유를 허락한 항목만 근거로 쓰입니다. 시스템 관리자도 내용 수정은 소유 부서 승인을 거치므로 책임 소재가 분명합니다."

  - header: 5. 운영 · 품질 관리
    h2: 5.2 피드백 처리 · 동의어 관리
    h3: 5.2.1 피드백 워크플로 · 동의어 사전
    req: SFR-11, SFR-12
    summary: "(학생의 ‘싫어요’가 답을 고침) 피드백을 오류 유형 · 영역별로 자동 분류해 **소관부서에 자동 배정**하고, 미검색 질의에서 동의어 후보를 추천받아 담당자 승인 즉시 검색에 반영함"
    blocks:
    - type: flow
      steps:
      - {title: 피드백 수집, desc: "좋아요/싫어요·유형"}
      - {title: 자동 분류, desc: "오답·출처·최신성"}
      - {title: 부서 배정, desc: "소관부서 담당자"}
      - {title: 조치, desc: "콘텐츠·FAQ·사전"}
      - {title: 완료·이력, desc: "기한 초과 알림"}
    - type: table
      size: 9.5
      header: [SFR-11 요구, 구현 방안]
      widths: [3.8, 12.2]
      rows:
      - [수집 · 분류, "답변별 피드백 + 오류 유형 5종(오답 · 출처 오류 · 정보 부족 · 최신성 · 기타) 자동 분류"]
      - [워크플로, "접수 → 검토 → 조치 → 완료, 처리 기한(관리자 설정) 초과 시 담당자 · 관리자 알림"]
      - [반영 · 통계, "조치(콘텐츠 수정 · 정답 FAQ · 동의어 · 프롬프트) 지식베이스 반영 이력, 영역별 처리 현황"]
    - type: table
      size: 9.5
      header: [SFR-12 요구, 구현 방안]
      widths: [3.8, 12.2]
      rows:
      - [사전 구분, "공통 사전 + 부서(도메인)별 사전, 사전별 적용 에이전트 지정"]
      - [즉시 반영, "질의 확장 단계에서 사전 적용 → 전체 재인덱싱 없이 즉시 반영"]
      - [후보 자동 추천, "미검색 · 저품질 질의 로그에서 후보 추출 (예: ‘도서관’ ↔ ‘정석’) → 담당자 승인"]
      - [변경 비교, "사전 변경 이력, 변경 전 · 후 검색 결과 비교 화면"]

  - header: 5. 운영 · 품질 관리
    h2: 5.3 답변 품질 유지 자동화
    h3: 5.3.1 자동 회귀평가 · 의심 답변 선별
    req: SFR-13, QUR-03
    summary: "(오픈 후에도 품질이 지켜지는 구조) 콘텐츠 · 프롬프트 · 모델 · 사전이 바뀔 때마다 **평가셋 회귀평가를 자동 실행**하고, 기준 미달이면 운영 반영을 보류하며, 운영 답변 중 의심 답변을 자동 선별함"
    blocks:
    - type: process
      rows:
      - {label: 평가셋, items: ["영역별 150문항↑ (소관부서 검토)", "콘텐츠 변경 → 문항 초안 자동 생성 → 승인"], result: "평가셋 확장"}
      - {label: 회귀평가, items: ["정기 (기본 주 1회)", "변경 시점 (콘텐츠 · 프롬프트 · 모델 · 사전)"], result: "지표 산출"}
