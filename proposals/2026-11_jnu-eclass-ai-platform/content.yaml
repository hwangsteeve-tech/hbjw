      - {label: 모의 이관, items: ["1차 (구조) · 2차 (전체)", "3차 (시간 측정)"], result: "이관 시나리오 확정"}
      - {label: 본 이관, items: ["선 이관 · 최종 이관", "검증 · 대사"], result: "이관 결과서"}
    - type: point
