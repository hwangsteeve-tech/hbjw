    h3: 4.2.2 이관 검증 · 에러 데이터 처리 · 아카이브
    req: SFR-008, DAR-003, DAR-004
    summary: "(이관 오류 0건) 단계별 **건수 · 합계 · 표본 대사**로 무결성을 확인하고, 오류 데이터는 원인별로 자동 재처리하며, 구 e클래스는 아카이브로 조회함"
    blocks:
    - type: table
      size: 9.5
      header: [검증 단계, 방법, 기준]
      widths: [3, 8.4, 4.6]
      rows:
      - [추출, "원본 건수 · 파일 수 · 용량 기록", "추출 누락 0건"]
      - [변환, "코드 매핑 · 형식 검증, 메타데이터 코드 변환", "변환 오류 목록화"]
      - [적재, "건수 · 합계(성적 · 출석) 대사, 표본 화면 비교", "건수 · 합계 일치"]
      - [업무 검증, "교수자 · 운영자 표본 강좌 확인", "검증 서명"]
    - type: table
      size: 9.5
      header: [에러 유형, 처리 방법]
      widths: [4, 12]
      rows:
      - [코드 불일치, "매핑 테이블 보완 후 자동 재이관"]
      - [필수값 누락, "원본 확인 → 기본값 · 담당자 확인 후 보정"]
      - [파일 손상 · 누락, "원본 재추출, 불가 시 목록 보고 · 교수자 재등록 안내"]
      - [중복, "업무 키 기준 병합 · 이력 보존"]
    - type: point
      color: green
      title: 아카이브 체계
      text: "구 e클래스 데이터는 읽기 전용 아카이브로 남겨 지난 강좌 · 성적 · 게시물을 계속 조회하게 하고, 복구가 필요하면 원본으로 되돌릴 수 있게 보존합니다."

  - header: 4. 데이터 요구사항
    h2: 4.3 백업
    h3: 4.3.1 백업 요구사항
    req: DAR-005
    summary: "(일 1회 전체 백업) **소스와 DB 전체를 1일 단위로 백업**하고, 학교 백업시스템과 연동 · 설정을 지원함"
