    req: DAR-001, DAR-002, DAR-006
    summary: "(표준 용어 · 코드부터) 현행 데이터 표준과 요구를 바탕으로 **표준 용어 · 도메인 · 코드**를 정하고, 변경 DB의 품질과 성능을 SQL 점검으로 유지함"
    blocks:
