      text: "학내 백업시스템의 대상 · 주기 설정을 지원하고, 복구 절차서를 운영자에게 넘깁니다."

  - header: 5. 제약사항
    h2: 5.1 제약사항 대응
    h3: 5.1.1 법 · 지침 준수 및 대응 방안
    req: COR-001, COR-002, COR-003
    summary: "(제약사항 → 구현 → 테스트) 개인정보보호법 · 웹 표준 · 개발 지침을 **설계 기준으로 반영하고, 테스트 항목으로 확인**함"
    blocks:
    - type: table
      size: 9
      header: [제약사항, 구현 방안, 테스트 방안]
      widths: [4, 7, 5]
