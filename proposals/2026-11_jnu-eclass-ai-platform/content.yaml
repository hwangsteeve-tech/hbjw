      - {label: 구현, items: ["정적 분석 도구 진단", "보안약점 조치"], result: "진단 결과서"}
      - {label: 시험, items: ["취약점 점검", "모의해킹"], result: "점검 보고서"}
      - {label: 종료, items: ["조치 · 재점검", "정보보안 담당관 검토"], result: "사업 종료"}

  - header: 4. 데이터 요구사항
    h2: 4.1 데이터 표준 · 관리
