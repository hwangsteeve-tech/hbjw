      - {name: 애플리케이션, items: ["권한(RBAC · CRUD)", "입력값 검증", "로그인 제한"], side: "SER-001 · 004", color: "2E6FC4"}
      - {name: 데이터, items: ["개인정보 암호화", "마스킹", "접근 이력"], side: "SER-003 · 009", color: "0E8FD6"}
    - type: kpi
