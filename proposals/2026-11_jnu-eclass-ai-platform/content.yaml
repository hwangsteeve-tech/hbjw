      - ["데이터 관리 (DAR-002)", "암호화 대상 식별, 양방향 · 단방향 암호화 구분 적용"]
      - ["SQL 튜닝 (DAR-006)", "품질 관리(표준 용어 · 정규화), 인덱스 조정, 문제 쿼리 사전 발견(실행계획 · 느린 쿼리 로그) · 튜닝"]
