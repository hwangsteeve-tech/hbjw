      - {title: 접근 이력, desc: "열람 사유 · 통계 (COR-001)"}

  - header: 3. 보안 요구사항
    h2: 3.1 보안 구현 방안
    h3: 3.1.3 웹 취약점 · SW 개발보안 · 모의해킹
    req: SER-004, SER-006, SER-007, SER-008
    summary: "(사업 종료 전 취약점 0건) 행정안전부 「SW 개발보안 가이드」를 설계부터 적용하고, **정보보호 전문가가 참여한 취약점 점검 · 모의해킹** 후 조치 결과를 정보보안 담당관 검토로 마무리함"
    blocks:
    - type: table
      size: 9
      header: [요구사항, 구현 방안]
      widths: [4, 12]
      rows:
      - ["페이지 보안 (SER-004)", "SQL 삽입 · XSS · 웹쉘 업로드 · 임의 파일 다운로드 차단, 입력값 검증 · 오류 정보 노출 방지 · 디버그 코드 제거"]
      - ["보안 규정 (SER-006)", "발주기관 보안 지침, OS · 웹서버 보안 패치 · 설정, 소스코드 보안약점 진단, 착수 전 보안교육"]
      - ["취약점 · 모의해킹 (SER-007)", "NIA 「정보시스템 구축 단계별 정보보호 가이드라인」 준수, 정보보호 전문가(석사 · 경력 3년 · CISSP · CISA · SIS) 참여, 점검 보고서 제출"]
      - ["응용 보안 (SER-008)", "XML 서명 · 암호화 · WS-Security · SAML, ARIA · RSA 2048비트 이상, 검증필 암호모듈"]
    - type: process
