      - ["개인정보보호법 (COR-001)", "열람 이력 · 사유 입력, 이력 통계 화면, 고유식별정보 암호화, 접근 · 열람 · 저장 로그", "개인정보 처리 점검표"]
      - ["웹 표준 · 호환성 (COR-002)", "W3C Markup · CSS 검사 통과, 3종 이상 브라우저, Windows 8 이상, ActiveX 금지, KWCAG 2.1 이상", "W3C 검사 · 브라우저 교차 시험"]
      - ["개발 지침 (COR-003)", "정보시스템 구축 · 운영지침, 웹사이트 구축운영 가이드, 호환성 지침, 접근성 제작기법 2.2, 모바일 전자정부 지침, SW 개발보안 · 보안약점 진단 가이드, 전남대 정보보안 지침", "지침 준수 점검표"]
    - type: point
      color: navy
      title: 웹 접근성 기준
      text: "RFP는 KWCAG 2.1과 접근성 제작기법 2.2를 함께 제시하므로, 상위 기준인 2.2를 적용해 두 기준을 모두 충족합니다."
    - type: flow
      steps:
