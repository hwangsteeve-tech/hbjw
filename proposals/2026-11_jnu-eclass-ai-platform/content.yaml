      - {title: 현행 분석, desc: "용어 · 코드 · 구조"}
      - {title: 표준 정의, desc: "용어 · 도메인 · 코드"}
      - {title: 모델링, desc: "논리 · 물리 ERD"}
      - {title: 점검, desc: "표준 준수율"}
      - {title: 튜닝, desc: "실행계획 · 인덱스"}
