    req: SER-001, SER-002, SER-005
    summary: "(로그인부터 전송까지) 관리자 로그인 **5회 실패 시 10분 차단 · 동시 로그인 차단**, 인증정보 하드코딩 금지, 전 구간 TLS 암호화를 적용함"
    blocks:
    - type: table
      size: 9.5
      header: [요구사항, 구현 방안]
      widths: [4, 12]
      rows:
      - ["관리자 로그인 (SER-001)", "5회 이상 실패 시 10분 접속 제한, 동일 계정 동시 로그인 차단, 관리자 접속 IP 제한"]
      - ["인증정보 보호 (SER-002)", "인증정보 · 비밀번호 하드코딩 금지(환경 변수 · 비밀 저장소), 주민번호 대체 수단(I-PIN · 휴대폰), 개인정보 암호화, SSL"]
      - ["구간 암호화 (SER-005)", "사용자 PC ~ 웹서버 TLS 1.2 이상, 로그인 정보 스니핑 방지"]
      - [세션 관리, "자동 로그아웃, 최종 접속 IP · 시간 표시, 세션 고정 방지"]
    - type: layers
