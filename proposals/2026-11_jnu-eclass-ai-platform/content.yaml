      - {title: 설계 반영, desc: "설계서 점검"}
      - {title: 구현, desc: "시큐어코딩"}
      - {title: 테스트, desc: "점검표 · 도구"}
      - {title: 확인, desc: "결과서 제출"}
    - type: kpi
      items:
      - {value: "3", unit: 종+, label: "브라우저 호환"}
      - {value: "0", unit: 개, label: "ActiveX"}

  - header: 5. 제약사항
    h2: 5.1 제약사항 대응
    h3: 5.1.2 저작권 · 지식재산권 · 모듈화 설계
    req: COR-004, COR-005
    summary: "(저작권 분쟁 0건 · 컴포넌트 구조) 디자인 · 이미지 · 폰트 · S/W는 **구매 또는 공개 라이선스만 사용**하고, 기능별 컴포넌트로 개발해 확장 · 재사용을 보장함"
    blocks:
    - type: table
      size: 9.5
      header: [구분, 대응 방안]
      widths: [4, 12]
      rows:
      - [디자인 · 콘텐츠, "이미지 · 영상 · 폰트는 구매 또는 상업 이용 가능 라이선스, 사용 목록 · 증빙 제출"]
      - [오픈소스, "라이선스(GPL · Apache · MIT 등) 목록 · 의무 사항 정리, 고지문 제공"]
      - [산출물 권리, "발주자 · 사업자 공동 소유 원칙, 세부 협의, 관할 법원은 발주자 소재지"]
      - ["모듈화 (COR-005)", "기능별 컴포넌트 · 공통 서비스 분리, 내 · 외부 연계 공통 기능 포함, 표준화된 절차 · 방법론"]
    - type: layers
      height: 1.1
      layers:
      - {name: 화면, items: ["공통 UI 컴포넌트", "역할별 화면"], side: "디자인 시스템", color: "1F4E9A"}
      - {name: 업무 모듈, items: ["강좌 · 출결 · 시험", "AI · 미디어 · 포털"], side: "플러그인", color: "2E6FC4"}
      - {name: 공통 서비스, items: ["인증 · 권한 · 알림", "연계 · 로그"], side: "재사용", color: "0E8FD6"}
    - type: point
