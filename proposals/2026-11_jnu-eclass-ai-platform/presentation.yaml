    facts:
      - {label: 발주기관, value: "전남대학교\n교육혁신본부"}
      - {label: 사업기간, value: "계약일로부터\n120일"}
      - {label: 사업금액, value: "4억 9,500만 원\n(VAT 포함)"}
      - {label: 구성, value: "요구사항 131개\nAI 기능 15개"}

  - title: 1. 현황 문제와 e클래스2.0 개선 방향
    headline: "추진 배경을 **교수자 부담 · 학습자 경험 · 학습위기 · 다국어 · 통합 운영** 다섯 축으로 묶고, !!요구사항과 1:1로 연결!!"
    eval: [사업이해도 및 추진전략]
    conclusion: "교수자의 반복 업무는 AI가 덜고, 학습자는 수업 자료 기반 답을 받고, 학교는 **위기 학생을 먼저 찾는** 플랫폼"
    columns:
      - w: 1.5
        blocks:
          - type: table
            size: 10
            header: [구분, 현황 문제, e클래스2.0 개선]
            widths: [2.2, 5, 5.6]
            rows:
              - [교수자 부담, "퀴즈 · 루브릭 수작업", "AI 퀴즈 · 루브릭 · 문제출제"]
              - [교수자 부담, "학기마다 강의실 재구성", "AI 코스워크 · 차시 · 복사"]
              - [학습자 경험, "질문해도 답이 늦음", "AI 튜터 · Q&A · 요약"]
              - [학습위기, "부진 · 이탈 늦게 파악", "위기 예측 · 조기경고"]
              - [다국어, "유학생 강의 이해 어려움", "자막 · 실시간 번역 12개 언어+"]
              - [통합 운영, "교과 · 비교과 분리", "포털 · 성장마루 통합"]
      - w: 1
        blocks:
          - type: kpi
            h: 2.2
            items:
              - {value: "131개", label: "요구사항 전부 수용"}
              - {value: "15개", label: "AI 기능 (SFR-073~087)"}
          - type: cards
            cols: 1
            size: 10.5
            items:
              - {title: 사업범위 10개 항목, desc: ["LMS 재구축 · AI 교수학습 · 자막 · 번역", "모바일 앱 · LCMS · 이관 · 아카이브", "비교과 통합 · 학습위기 · 포털"]}

  - title: 2. 목표시스템 — 표준 LMS 엔진 + AI 서비스 계층
    headline: "**사용자 채널 · LMS · AI · 미디어 · 연계** 5계층으로 나누고, 학내 클라우드의 !!WEB/WAS 2식 · DB · Cache · 개발서버!! 위에 구성"
    eval: [사업이해도 및 추진전략, 시스템 장비구성]
    conclusion: "LLM은 **플러그인으로 교체** — 오픈소스 온프레미스와 OpenAI · Anthropic · Google API를 같은 화면에서 관리"
    blocks:
      - type: layers
        side_w: 5
        layers:
          - {name: 사용자 채널, items: ["학생 · 교수자 포털", "e클래스2.0 반응형 웹", "모바일 앱 (iOS · Android)", "MOOC · 비학위"], side: "SSO · 한 · 영 · 일 · 중"}
          - {name: LMS 서비스, items: ["강좌 · 차시 · 학습활동", "출결 · 시험 · 과제 · 성적", "토론 · 팀 · 설문", "관리 · 통계 · 모니터링"], side: "SFR-004~072"}
          - {name: AI 서비스, items: ["튜터 · Q&A · 요약 · 번역", "퀴즈 · 문제 · 루브릭", "자막 · 실시간 자막", "학습위기 예측 · LLM 관리"], side: "SFR-073~087"}
          - {name: 미디어 · 데이터, items: ["CMS · 트랜스코더", "스트리밍 · VOD CDN", "벡터 DB", "아카이브"], side: "ECR-002 · 003"}
          - {name: 연계, items: ["학사행정 · 성적 · 출석", "SSO · 전자출결", "성장마루 · KOCW", "Mail · SMS · 강의녹화"], side: "SFR-003 · 005 · 006"}

  - title: 3. 4대 추진 전략
    headline: "**표준 기반 신속 구축 · AI 교수학습 · 데이터 기반 학습지원 · 무중단 전환**으로 !!120일 안에 개강 전 오픈!!"
    eval: [사업이해도 및 추진전략]
