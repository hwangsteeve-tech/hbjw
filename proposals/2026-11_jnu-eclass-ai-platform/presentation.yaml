              - {title: "③ 데이터 기반 학습지원", desc: ["학습 로그 표준화", "부진 · 중단 · 이탈 예측", "주 1회 조기경고"]}
              - {title: "④ 무중단 전환", desc: ["방학 중 선 이관 · 병행 검증", "개강 전 전환 · 4주 전 동결", "구 e클래스 아카이브 조회"]}
      - w: 1
        blocks:
          - type: kpi
            h: 2.2
            items:
              - {value: "3초", label: "페이지 응답"}
              - {value: "3,000명", label: "출석 동시접속"}
          - type: kpi
            h: 2.2
            items:
              - {value: "12개+", label: "자막 · 번역 언어"}
              - {value: "100%", label: "결함 조치율"}

  - title: 4. 위험 요소와 조건별 대응
    headline: "**6대 위험**을 착수 시 등록하고, RFP에 정해지지 않은 !!AI 추론 자원 · 현행 LMS · 화상강의 라이선스 · AI 기본법!!은 경우별로 설계"
    eval: [사업이해도 및 추진전략]
    conclusion: "어떤 조건이 확정되어도 **착수 2주 안에 방식을 정하고** 일정 · 범위 변경 없이 진행"
    columns:
