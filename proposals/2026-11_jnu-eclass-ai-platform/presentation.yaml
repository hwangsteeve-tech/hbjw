        blocks:
          - type: table
            size: 10
            header: [위험, 대안]
            widths: [3, 6.6]
            rows:
              - [120일 단기 일정, "표준 엔진 · 병렬 개발, 개강 필수 기능 우선"]
              - [학기 중 전환, "방학 중 전환, 구 e클래스 병행"]
              - [데이터 이관 오류, "모의 이관 3회 · 건수 대사 · 롤백"]
              - [AI 답변 오류, "자료 범위 제한 · 출처 · 비공개 전환"]
              - [연계 지연, "2주 내 API 명세 · 임시 파일 연계"]
              - [GPU · API 비용, "경량 모델 · 캐시 · 사용량 한도"]
      - w: 1
        blocks:
          - type: table
            size: 10
            header: [미확정 조건, 경우 A / 경우 B]
            widths: [3, 6.6]
            rows:
              - [AI 추론 자원, "학내 GPU → 온프레미스 / 미제공 → 클라우드 API"]
              - [현행 LMS, "표준 구조 → 직접 변환 / 비표준 → 협조 추출"]
