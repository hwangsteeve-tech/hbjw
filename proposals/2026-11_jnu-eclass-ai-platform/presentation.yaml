          - [RAG 엔진, "txt · docx · md · csv · html · xlsx 학습, 데이터 소스 동적 추가", "SFR-082 · 087"]
          - [대화 · 언어, "세션 스레드 · 공유, 입력 언어 자동 감지 · 같은 언어 응답", SFR-083]

  - title: 3. 프로토타입 · 개발방법론
