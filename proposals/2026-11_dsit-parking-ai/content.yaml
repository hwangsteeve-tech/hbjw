  title: 사업 추진전략 및 수행방법
  toc: [추진전략, 개발방법론, 요구사항 분석]
  slides:
  - header: 1. 추진전략
    h2: 1.1 사업 수행전략
    h3: 1.1.1 데이터 · 기준선 · 내재화 먼저
    req: 일반사항
    summary: "(6개월 안에 운영 가능한 AI) 착수 1개월에 **데이터 · 운영환경 진단과 성능 기준선**을 확정하고, 수요예측과 자동감면을 **2개 트랙으로 병행** 개발해 5개월 차부터 실데이터로 검증함"
    blocks:
    - type: themes
      size: 9.5
      items:
      - title: 데이터 먼저 (M1)
        text: "탄력주차 입 · 출차 · 점유 이력의 기간 · 결측 · 주기를 진단하고 학습 가능 범위를 확정합니다. 이력이 짧은 주차장은 유사 주차장 군집 모델로 보완합니다."
      - title: 기준선 먼저 (M1)
        text: "‘전주 같은 요일 · 시간’ 같은 단순 예측과 현행 수작업 감면 결과를 기준선으로 두고, AI가 이를 얼마나 개선하는지로 성과를 판정합니다."
      - title: 2트랙 병행 (M2~M5)
        text: "수요예측 · 최적화 트랙과 자동감면 트랙을 별도 팀으로 동시에 진행하고, 공통 데이터 · API 계층만 함께 씁니다."
      - title: 내재화 먼저 (전 기간)
        text: "모델 학습 · 배포 · Rule 반영을 발주기관 인력이 직접 실행하는 절차로 만들고, 매월 기술 공유 세션으로 넘깁니다."
    - type: table
      size: 9.5
      caption: 주요 위험과 대응 (RFP 일반사항)
      header: [위험, 대응]
      widths: [4.2, 11.8]
      rows:
      - [데이터 품질 · 기간 부족, "결측 보간 · 이상치 제거, 유사 주차장 군집 학습, 외부 변수(요일 · 공휴일 · 기상 · 행사)"]
      - [AI 성능 미달, "기준선 대비 개선율로 관리, 불확실 구간은 공급 보류(안전 측) 정책"]
      - [개인정보, "가명 차량 ID · 최소 수집 · 마이데이터는 본인 동의 · 결과값만 보관"]
      - [시스템 연계 · 일정, "M1에 연계 규격 확정, Mock API로 선개발, 월 단위 마일스톤"]

  - header: 2. 개발방법론
    h2: 2.1 AI 개발방법론
    h3: 2.1.1 CRISP-DM + MLOps 반복형 개발
    req: 일반사항
    summary: "(실험이 아닌 운영 기준) 데이터 이해 → 준비 → 모델링 → 평가 → 배포의 **CRISP-DM 단계**를 4주 반복으로 돌리고, 모델 · 데이터 · Rule 버전을 MLOps로 관리해 재학습 · 롤백이 가능하게 함"
    blocks:
    - type: process
      rows:
      - {label: 업무 이해, items: ["탄력주차 운영 · 감면 업무 인터뷰", "성과 지표 · 기준선 합의"], result: "M1"}
      - {label: 데이터, items: ["입 · 출차 · 점유 · 요금 · 감면 이력 진단", "피처 저장소 구성"], result: "M1~M2"}
      - {label: 모델링 (반복), items: ["4주 단위 실험 · 평가", "기준선 대비 개선 확인"], result: "M2~M5"}
      - {label: 배포 · 검증, items: ["API 배포 · Shadow 모드 운영", "실데이터 성능 검증"], result: "M5~M6"}
      - {label: 내재화, items: ["재학습 파이프라인 · 매뉴얼", "기술이전 교육"], result: "M6"}
    - type: table
      size: 9.5
      header: [MLOps 구성, 적용 기술, 효과]
      widths: [3.4, 6.4, 6.2]
      rows:
      - [실험 관리, "MLflow (파라미터 · 지표 · 모델 버전)", "모델 선택 근거 추적"]
      - [데이터 · 피처, "피처 정의 코드화 · 데이터 버전 (DVC)", "학습 재현성"]
      - [배포, "컨테이너 · REST API · Shadow → Canary 전환", "운영 무중단 반영"]
      - [모니터링, "예측 오차 · 데이터 드리프트 감시 → 재학습 알림", "성능 저하 조기 탐지"]
    - {type: note, text: "※ Shadow 모드: AI 결과를 운영에 반영하지 않고 실제 결과와 나란히 기록 · 비교하는 단계 — 검증 후 발주기관 승인 시 운영 반영"}

  - header: 3. 요구사항 분석
    h2: 3.1 과업 요구사항 분석
    h3: 3.1.1 과업 · 기능 · 산출물 추적표
    req: 수행내용 가 · 나 · 다
    summary: "(과업 누락 0건) RFP 수행내용 2개 영역 · 12개 세부 과업을 **기능 ID로 분해**하고 개발 · 검증 · 산출물까지 하나의 추적표로 관리함"
    blocks:
    - type: table
      size: 8.5
      header: [과업, 세부 내용, 기능 ID, 제안서]
      widths: [3, 7.6, 3, 2.4]
      rows:
      - ["가. 자동 공급", "운영상태 분석 · 공급 가능시간 · 공급여부 판단", "DF-01", "Ⅳ-5"]
      - ["가. 자동 공급", "공급량 조정 · 운영 최적화", "DF-02", "Ⅳ-5"]
      - ["가. 거주자공유", "주차장별 · 시간대별 수요 · 점유 예측", "DF-03", "Ⅳ-3"]
      - ["가. 거주자공유", "거주자 이용 · 복귀패턴 예측 · 공유 가능 시간대", "DF-04", "Ⅳ-4"]
      - ["가. 동적 요금제", "실시간 수요 · 점유 기반 요금 산정 · 탄력요금 적용", "DF-05", "Ⅳ-6"]
      - ["나. 조례 파싱", "지자체 조례 · 규정 분석, 감면 대상 · 율 · 조건 · 예외 추출", "AR-01", "Ⅴ-2"]
      - ["나. 조례 파싱", "감면조건 구조화 · Rule DB 생성 · 관리", "AR-02", "Ⅴ-3"]
      - ["나. 조례 파싱", "조례 · 감면기준 변경 Rule 관리", "AR-03", "Ⅴ-4"]
      - ["나. 감면 판단", "이용자 · 차량 자격정보와 Rule 연계 (마이데이터)", "AR-04", "Ⅴ-5"]
      - ["나. 감면 판단", "적용 감면항목 자동판단 · 복수 감면 우선순위 · 조합", "AR-05", "Ⅴ-6"]
      - ["나. 감면 판단", "감면결과 · 최종 정산금액 산출, 오류 · 예외 대응", "AR-06", "Ⅴ-7"]
      - ["다. 산출물", "설계서 · AI 모델 구조 · 소스 · DB · API 규격 · 시험 · 매뉴얼", "-", "Ⅶ-2"]
    - type: flow
      steps:
      - {title: 과업 분해, desc: "12개 세부 과업"}
      - {title: 기능 ID, desc: "DF · AR 체계"}
      - {title: 설계 · 개발, desc: "기능별 담당"}
      - {title: 검증, desc: "기능별 시험 항목"}
      - {title: 산출물, desc: "추적표 완료"}

  - header: 3. 요구사항 분석
    h2: 3.2 데이터 · 운영환경 분석
    h3: 3.2.1 데이터 요건 · 착수 시 확정
    req: 일반사항
    summary: "(불명확한 조건은 M1에 확정) 데이터 규모 · 제공 시점 · 연계 방식 · 성능 기준이 RFP에 정해져 있지 않으므로, **착수 2주 안에 확정 목록을 발주기관과 합의**하고 그 결과로 모델 범위를 정함"
    blocks:
    - type: table
      size: 9.5
      header: [데이터, 필요 항목, 용도, 최소 요건]
      widths: [3, 5.6, 3.8, 3.6]
      rows:
      - [입 · 출차 이력, "주차장 · 면 · 입차/출차 시각 · 가명 차량 ID · 이용 유형", "수요 · 복귀 예측", "【12개월↑ 권장】"]
      - [점유 현황, "면별 점유 상태 · 센서/정산 기록 시각", "점유율 예측 · 검증", "【5분 단위】"]
      - [거주자 배정, "배정 면 · 이용 시간대 (가명)", "공유 가능 시간대", "【배정 이력】"]
      - [요금 · 정산, "요금표 · 결제 · 감면 적용 이력", "동적 요금 · 감면 검증", "【6개월↑】"]
      - [외부 변수, "공휴일 · 기상 · 주변 행사 · 시설 이용", "예측 정확도 향상", "공공 API"]
    - type: table
      size: 9.5
      caption: 착수 2주 내 확정 사항 (발주기관 질의 · 협의)
      header: [항목, 확정 내용]
      widths: [3.6, 12.4]
      rows:
      - [적용 대상, "탄력주차 운영 지자체(강남구 · 성남시 · 의정부시 · 대구 시범사업 등) 중 대상 지자체 · 주차장 유형 · 수, 조례 파싱 초기 지자체 수 【회신 확인】"]
      - [구현 수준, "자동 공급 · 동적 요금 · 감면 결과를 ① 추천 · 산정까지 / ② 플랫폼 자동 반영까지 중 범위 확정 — 본 제안은 ①을 기본, ②는 API로 지원"]
      - [데이터 · 연계, "제공 데이터 종류 · 기간 · 형식 · 시점(파일 · DB · API), 탄력주차 앱 · 관리자 연계 방식, TS 대상 시스템 【회신 확인】"]
      - [마이데이터 · 인프라, "이용기관 승인 주체 · 비용 · 테스트 환경, 학습 · 운영 서버 제공 여부, 외부 LLM API 사용 · 이용료 부담 【회신 확인】"]
      - [성능 기준, "예측 · 감면 판단 정확도 검수 기준 (Ⅵ-3 제안 기준으로 협의)"]

# =====================================================================
- num: Ⅳ
  title: AI 기반 주차 수요예측 및 운영 최적화
  toc: [수요예측 엔진 구조, 데이터 · 피처, 수요 · 점유 예측, 거주자공유 예측, 주차장 자동 공급, 동적 요금제, 운영 화면 · 검증]
  slides:
  - header: 1. 수요예측 엔진 구조
    h2: 1.1 전체 구조
    h3: 1.1.1 예측 · 판단 · 실행 3단 구조
    req: 과업 가 전체
    summary: "(하나의 예측으로 세 가지 결정) 수요 · 점유 · 복귀시간 **예측 모델**의 결과를 **공급 판단 · 요금 산정 최적화기**가 받아 탄력주차 플랫폼에 공급 시간 · 공급량 · 요금을 내려보냄"
    blocks:
    - type: layers
      height: 1.15
      layers:
      - {name: 데이터, items: ["입 · 출차 · 점유 이력", "거주자 배정 · 이용", "요금 · 정산", "외부 변수 (공휴일 · 기상 · 행사)"], side: "가명 처리 · 피처 저장소", color: "1C3F7A"}
      - {name: 예측, items: ["주차장 · 시간대 수요 예측 (DF-03)", "면 단위 점유 예측", "거주자 복귀시간 예측 (DF-04)"], side: "분위수 (P10~P90)", color: "1F4E9A"}
      - {name: 판단 · 최적화, items: ["공급 가능시간 · 공급여부 (DF-01)", "공급량 조정 (DF-02)", "동적 요금 (DF-05)"], side: "위험 한도 · 조례 상하한", color: "2E6FC4"}
      - {name: 실행, items: ["탄력주차 플랫폼 API", "운영자 승인 / 자동 모드", "결과 · 근거 기록"], side: "Shadow → 운영", color: "0E8FD6"}
      - {name: 학습, items: ["실제 결과 피드백", "오차 · 드리프트 모니터링", "주기 재학습"], side: "MLOps", color: "2BA0C8"}
    - type: table
      size: 9.5
      header: [모듈, 입력, 출력, 갱신 주기]
      widths: [3.6, 5, 4.6, 2.8]
      rows:
      - [수요 · 점유 예측, "이력 · 달력 · 외부 변수", "시간대별 수요 · 점유율 분위수", "15분 / 일 재학습"]
      - [복귀시간 예측, "거주자 출차 시각 · 요일 패턴", "복귀 시각 확률분포", "출차 이벤트마다"]
      - [공급 · 요금 최적화, "예측 분포 · 정책 제약", "공급 시간 · 면 수 · 요금", "15분"]
    - type: point
      color: navy
      title: 예측과 결정을 분리한 이유
      text: "예측 모델은 ‘얼마나 찰지’만, 최적화기는 ‘그래서 몇 면을 언제 열지’만 책임지게 나눠, 정책(위험 한도 · 요금 상하한)이 바뀌어도 모델을 다시 학습하지 않고 설정만 바꿉니다."

  - header: 2. 데이터 · 피처
    h2: 2.1 데이터 처리 및 피처 엔지니어링
    h3: 2.1.1 수집 · 정제 · 피처 설계
    req: 과업 가 · 일반사항
    summary: "(예측 품질의 70%는 데이터) 입 · 출차 이벤트를 **15분 단위 점유 시계열**로 바꾸고, 달력 · 외부 변수 · 주차장 특성을 더한 피처를 **코드로 정의**해 학습과 운영이 같은 피처를 쓰게 함"
    blocks:
    - type: process
      rows:
      - {label: 수집, items: ["탄력주차 DB · 이벤트 로그", "외부 API (공휴일 · 기상)"], result: "원천 적재"}
      - {label: 정제, items: ["중복 · 누락 이벤트 보정 (입차만 / 출차만)", "센서 오류 · 이상치 제거"], result: "정제 이력"}
      - {label: 변환, items: ["이벤트 → 15분 점유 시계열", "체류시간 · 회전율 산출"], result: "시계열"}
      - {label: 피처, items: ["달력 · 지연값 · 이동평균", "주차장 특성 · 군집 ID"], result: "피처 저장소"}
    - type: table
      size: 9.5
      header: [피처 그룹, 예시, 근거]
      widths: [3.4, 7.6, 5]
      rows:
      - [시간 · 달력, "요일 · 시간대 · 공휴일 · 연휴 전후 · 학교 방학", "주기성 · 특수일 수요"]
      - [지연 · 추세, "1일 · 7일 전 같은 시간 점유, 4주 이동평균", "자기상관"]
      - [외부 요인, "강수 · 기온, 인근 행사 · 시설 운영시간", "수요 급변 요인"]
      - [주차장 특성, "면 수 · 유형(거주자 · 공영) · 요금 · 위치 군집", "이력 부족 주차장 보완"]
      - [거주자 행동, "출차 시각 · 평균 외출시간 · 요일별 복귀 분포 (가명)", "복귀 예측"]
    - type: point
      color: navy
      title: 이력이 짧은 주차장 대응
      text: "주차장을 면 수 · 유형 · 위치 · 이용 패턴으로 군집화해 군집 공동 모델을 학습하고, 이력이 쌓이면 주차장별 보정 계수를 추가합니다. 신규 주차장도 첫날부터 예측을 제공합니다."

  - header: 3. 수요 · 점유 예측
    h2: 3.1 주차 수요 · 점유 예측 모델
    h3: 3.1.1 수요 · 점유 예측 (DF-03)
    req: "과업 가 [거주자공유 예측]"
    summary: "(점이 아닌 구간으로) 주차장 · 시간대별 수요와 점유율을 **LightGBM 분위수 회귀 + 시계열 딥러닝 앙상블**로 예측해 P10 · P50 · P90을 함께 내고, 공급 판단은 보수적인 분위수를 씀"
    blocks:
    - type: table
      size: 9.5
      header: [모델, 역할, 선택 이유]
      widths: [3.8, 5.6, 6.6]
      rows:
      - [기준선 (Seasonal Naive), "전주 같은 요일 · 시간 값", "성능 개선 판정 기준"]
      - [LightGBM 분위수 회귀, "주력 — 1~24시간 앞 점유율 분위수", "적은 데이터 · 빠른 학습 · 피처 기여도 설명"]
      - [TFT / N-HiTS (시계열 DL), "다주차장 · 장기 패턴 보완", "다중 시계열 공동 학습"]
      - [앙상블, "검증 오차 기반 가중 결합", "단일 모델 대비 안정성"]
    - type: process
      rows:
      - {label: 학습, items: ["시간 순 분할 (Rolling Origin)", "주차장 군집별 · 전체 모델"], result: "후보 모델"}
      - {label: 평가, items: ["MAE · MAPE (점유율)", "분위수 손실 · 구간 적중률"], result: "기준선 대비"}
      - {label: 설명, items: ["SHAP 피처 기여도", "‘우천 · 공휴일 영향’ 운영자 표시"], result: "설명 가능"}
      - {label: 운영, items: ["15분마다 추론 · 일 1회 재학습", "오차 급증 시 알림"], result: "API 제공"}
    - type: kpi
      items:
      - {value: "【15】", unit: "%↓", label: "점유율 예측 오차\n(MAPE, 기준선 대비 개선)"}
      - {value: "80", unit: "%", label: "P10~P90 구간\n실제값 적중률 목표"}
      - {value: "24", unit: 시간, label: "예측 범위\n(15분 단위)"}

  - header: 4. 거주자공유 예측
    h2: 4.1 거주자 이용 · 복귀패턴 예측
    h3: 4.1.1 복귀시간 · 공유 시간대 (DF-04)
    req: "과업 가 [거주자공유 예측]"
    summary: "(거주자가 돌아오기 전까지만 공유) 거주자 출차 순간부터 **‘언제 돌아올지’를 생존분석으로 확률 예측**하고, 복귀 확률이 기준 이하인 시간까지만 공유 가능 시간대로 판단함"
    blocks:
    - type: process
      rows:
      - {label: 출차 감지, items: ["배정 면 출차 이벤트", "요일 · 시각 · 개인 패턴 조회 (가명)"], result: "공유 후보"}
      - {label: 복귀 예측, items: ["생존분석 (Cox · Gradient Boosted Survival)", "시점별 ‘아직 미복귀’ 확률 곡선"], result: "복귀 분포"}
      - {label: 시간대 판단, items: ["미복귀 확률 ≥ 기준(예 95%) 구간", "완충시간(예 30분) 차감"], result: "공유 가능 시간"}
      - {label: 공유 · 갱신, items: ["탄력주차 공유 등록", "실제 복귀 · 이용 결과로 재학습"], result: "피드백"}
    - type: table
      size: 9.5
      header: [패턴 유형 (군집 예), 특징, 공유 판단]
      widths: [3.6, 6.6, 5.8]
      rows:
      - [주간 출근형, "평일 08시 출차 · 18~19시 복귀 규칙적", "09~17시 공유 (신뢰 높음)"]
      - [불규칙형, "출차 · 복귀 시각 분산 큼", "짧은 단위로만 공유 또는 보류"]
      - [주말 외출형, "주말 장시간 외출 · 평일 상시 주차", "주말 낮 시간 공유"]
    - type: table
      size: 9.5
      header: [안전장치, 내용]
      widths: [4, 12]
      rows:
      - [보수적 기준, "미복귀 확률 기준 · 완충시간을 지자체 · 주차장별로 설정"]
      - [조기 복귀 대응, "공유 이용자 출차 예정 알림, 인근 대체면 안내 (플랫폼 기능 연계)"]
      - [개인정보, "거주자 패턴은 가명 ID로만 학습 · 집계, 개인 이동 경로 수집 없음"]

  - header: 5. 주차장 자동 공급
    h2: 5.1 공급 가능시간 · 공급량 최적화
    h3: 5.1.1 운영상태 · 자동 공급 (DF-01·02)
    req: "과업 가 [주차장 자동 공급]"
    summary: "(더 많이 공급하되 넘치지 않게) 예측 수요 · 점유 분포와 복귀 예측을 받아 **‘기대 공급 효과 – 초과 위험 비용’을 최대화**하는 공급량 · 공급 시간을 15분마다 산출하고, 운영자 승인 또는 자동으로 반영함"
    blocks:
    - type: table
      size: 9.5
      header: [운영상태 (DF-01), 판단 기준, 공급 조치]
      widths: [3.2, 7, 5.8]
      rows:
      - [여유, "예측 점유율 P90 < 【70%】", "탄력 공급 확대 (공유면 개방)"]
      - [보통, "P50 < 【85%】 ≤ P90", "현 공급 유지, 단시간 공유만"]
      - [혼잡 예상, "P50 ≥ 【85%】", "신규 공유 중단, 인근 주차장 안내"]
      - [불확실, "예측 구간 폭 과다 · 데이터 이상", "자동 공급 보류 → 운영자 확인"]
    - type: process
      rows:
      - {label: 입력, items: ["시간대별 수요 · 점유 분위수", "공유 가능 시간 (DF-04)"], result: "예측"}
      - {label: 최적화, items: ["목적: 공급 이용량 최대화", "제약: 초과 확률 ≤ 한도 · 거주자 우선"], result: "공급안"}
      - {label: 실행, items: ["승인 모드 / 자동 모드 선택", "플랫폼 API로 공급 반영"], result: "공급"}
      - {label: 평가, items: ["실제 이용률 · 초과 발생 기록", "한도 · 정책 조정"], result: "개선"}
    - type: point
      color: green
      title: 운영자가 믿을 수 있는 자동화
      text: "초기에는 AI 공급안을 운영자가 승인하는 모드로 시작해 승인율 · 초과 발생 건수를 확인하고, 기준을 충족한 주차장부터 자동 모드로 전환합니다. 모든 공급 결정에는 예측값 · 적용 기준이 기록됩니다."

  - header: 6. 동적 요금제
    h2: 6.1 시간대 · 구간별 탄력요금
    h3: 6.1.1 적정 요금 산정 (DF-05)
    req: "과업 가 [동적 요금제]"
    summary: "(조례가 허용하는 범위 안에서) 실시간 수요 · 점유와 가격 민감도를 반영해 **목표 점유율(예 85%)을 맞추는 요금**을 시간대 · 구간별로 산정하되, 조례 · 고시 요금의 **상 · 하한과 변경 빈도 제한**을 지킴"
    blocks:
    - type: process
      rows:
      - {label: 수요 예측, items: ["시간대 · 구간별 예측 점유율", "현재 요금 · 대체 주차장 상황"], result: "예측 점유"}
      - {label: 민감도 추정, items: ["요금 변화 ↔ 이용 변화 탄력성", "요금 이력 · A/B 구간 비교"], result: "탄력성"}
      - {label: 요금 산정, items: ["목표 점유율 달성 요금 탐색", "조례 상하한 · 단계(예 100원 단위)"], result: "요금안"}
      - {label: 적용 · 고지, items: ["시간대별 요금표 사전 고지", "변경 빈도 제한 (예 1일 【N회】)"], result: "탄력요금"}
    - type: table
      size: 9.5
      header: [설계 원칙, 내용]
      widths: [3.8, 12.2]
      rows:
      - [법 · 제도 준수, "지자체 주차장 조례 · 요금 고시 범위를 Rule로 관리 — 범위 밖 요금은 산출 불가"]
      - [예측 가능성, "이용자에게 시간대별 요금을 사전 고지, 입차 시점 요금 확정 방식 선택 가능"]
      - [형평성, "거주자 · 감면 대상자 요금은 별도 Rule로 보호 (감면 엔진과 연동)"]
      - [시뮬레이션 우선, "과거 데이터로 요금안 효과(점유율 · 수입) 시뮬레이션 → 발주기관 승인 후 적용"]
    - type: kpi
      items:
      - {value: "85", unit: "%", label: "목표 점유율\n(설정 가능)"}
      - {value: "0", unit: 건, label: "조례 상하한\n벗어난 요금"}
      - {value: "100", unit: "%", label: "요금 산정 근거\n(예측 · 규칙) 기록"}

  - header: 7. 운영 화면 · 검증
    h2: 7.1 운영자 화면 및 성능 검증
    h3: 7.1.1 운영 대시보드 · 검증 방법
    req: "과업 가 · 산출물"
    summary: "(결과와 이유를 한 화면에) 운영자는 주차장별 **예측 곡선 · 공급안 · 요금안과 그 근거**를 한 화면에서 보고 승인하며, 성능은 기준선 대비 개선율로 매주 리포트됨"
    blocks:
    - type: table
      size: 9.5
      header: [화면, 표시 내용]
      widths: [3.6, 12.4]
      rows:
      - [예측 현황, "주차장별 24시간 점유 예측 (P10 · P50 · P90 밴드) · 실제값 비교"]
      - [공급 관리, "AI 공급안 · 운영상태 · 승인/자동 모드 · 공급 이력"]
      - [거주자 공유, "공유 가능 시간대 · 복귀 확률 · 조기 복귀 건"]
      - [요금 관리, "시간대별 요금안 · 시뮬레이션 결과 · 조례 범위"]
      - [모델 상태, "예측 오차 추이 · 데이터 드리프트 · 재학습 이력"]
    - type: table
      size: 9.5
      caption: 수요예측 영역 검증 지표 (검수 기준은 착수 시 협의 · 확정)
      header: [기능, 지표, 제안 기준]
      widths: [3.6, 6.4, 6]
      rows:
      - [수요 · 점유 예측, "MAPE · 분위수 구간 적중률", "기준선 대비 【15%】 개선 · 적중 80%"]
      - [거주자 복귀, "조기 복귀로 인한 공유 충돌 비율", "【2%】 이하"]
      - [자동 공급, "공유 면 이용률 · 초과 발생 건", "이용률 개선 · 초과 【N건】 이하"]
      - [동적 요금, "목표 점유율 근접도 (시뮬레이션)", "목표 ±【10%p】"]
    - {type: note, text: "※ 검증은 학습에 쓰지 않은 최근 기간 데이터(Hold-out) + 운영 Shadow 기간(4주) 결과로 수행"}

