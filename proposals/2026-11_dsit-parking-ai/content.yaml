    req: "과업 나 [조례 파싱]"
    summary: "(조문 단위로 읽고 근거와 함께 추출) 지자체 주차장 조례를 **자치법규 Open API로 수집**해 조 · 항 · 호와 별표로 구조화하고, LLM이 **감면 대상 · 감면율 · 적용조건 · 예외**를 스키마에 맞춰 추출하며 근거 조문을 붙임"
    blocks:
    - type: process
      rows:
      - {label: 수집, items: ["국가법령정보 자치법규 API · 지자체 고시", "시행일 · 개정 이력"], result: "조례 원문"}
