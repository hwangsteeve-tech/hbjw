    h2: 3.3 확장 · 통제 · 모델 운용 방식
    h3: 3.3.1 확장 체계 · 권한 통제 · 다중 모델
    req: SFR-002, SFR-009, SER-001
    summary: "(발주기관이 직접 늘리고 바꾸는 구조) 도구는 **MCP 서버 등록**, 업무 절차는 **스킬 배포**, 모델은 **설정 변경**만으로 추가·교체하고, 모든 실행은 서버 측 정책 검사를 통과해야 함"
