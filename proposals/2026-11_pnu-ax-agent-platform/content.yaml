    - type: themes
      size: 9.5
      items:
      - title: 도구·업무절차(스킬) 확장 체계
        text: "신규 데이터원은 MCP 서버를 등록해 도구로 추가하고, 여러 도구를 순서대로 묶은 스킬을 개인 → 관리자 승인 → 조직·전사 단위로 배포합니다."
        points: ["스킬·지시문 변경 이력 관리, 담당자 이동과 무관하게 자산 보존", "발주기관 자체 제작·배포 방법을 운영자 매뉴얼에 수록"]
      - title: 실행 권한 통제 방식
        text: "요청 주체 식별자는 SSO 세션에서 서버가 강제 주입하고, 도구 실행 직전 정책 엔진이 사용자·그룹·대상 자원·작업 종류를 검사합니다."
        points: ["언어모델의 판단은 권한 근거가 되지 않음", "변경 작업은 확인 카드 승인 후에만 실행"]
      - title: 다중 모델 운용 방식
        text: "모델 게이트웨이에 교내 개방형 모델과 상용 모델을 2종 이상 등록하고, 관리자 화면에서 모델·버전·파라미터를 바꾸면 응용 코드 수정 없이 전환됩니다."
        points: ["과제별 기본 모델 지정, 동일 골든셋으로 모델 간 비교 실행"]
