  - header: 4. 유지관리
    h2: 4.1 기술지원 및 유지관리
    h3: 4.1.1 기술지원 체계 · 유지관리 범위와 요율
    req: PSR-002, PSR-003
    summary: "(창구 하나, 등급별 시간 약속) 단일 지원 창구에서 장애 등급별 **최초 응답 · 복구 목표 시간**을 지키고, 무상 하자보수와 유상 유지관리의 범위를 나누어 요율을 수치로 제시함"
    blocks:
    - type: table
      size: 9.5
      header: [항목, 내용]
      widths: [3.6, 12.4]
      rows:
      - [지원 창구, "전용 전화 【번호】 · 이메일 · 이슈 관리 포털 (24시간 접수)"]
      - [지원 시간, "평일 09:00~18:00 상시, 1등급 장애는 24시간 · 365일 대응"]
      - [방문 · 원격, "원격 지원 우선 (발주기관 승인 원격 접속), 1·2등급 미복구 시 온사이트 방문"]
    - type: table
      size: 9.5
      header: [장애 등급, 기준, 최초 응답, 복구 목표, 온사이트]
      widths: [2.4, 5.6, 2.4, 2.8, 2.8]
      rows:
      - [1등급 (긴급), "서비스 전체 중단, 개인정보 노출", 30분, 4시간, "【2시간】 이내 도착"]
      - [2등급 (중요), "과제 1개 이상 중단, 연계 장애", 1시간, 8시간, "【4시간】 이내 도착"]
      - [3등급 (일반), "일부 기능 오류, 화면 오류", 4시간, 2영업일, 필요 시]
      - [4등급 (문의), "사용 문의, 개선 요청", 1영업일, 협의 일정, "-"]
    - type: table
      size: 9.5
      header: [구분, 범위, 비용]
      widths: [3, 9.4, 3.6]
      rows:
      - [하자보수 (무상), "비정상 동작 · 요구사항 미충족 · 오류 수정, TER-003 정량 기준 미달", "1년 무상"]
      - [유지관리 (유상), "기능 추가·개선, 환경 변화(학내 시스템 변경·모델 교체)에 따른 조정", "연 【○%】 (개발비 기준)"]
    - {type: note, text: "※ 유지관리 비용은 RFP에 따라 추후 별도 협의하되, 제안 요율은 위 수치로 고정 제시 (작성지침: 유지관리 요율 수치 기재)"}

  - header: 5. 하자보수
    h2: 5.1 하자보수 계획
    h3: 5.1.1 하자보수 조직 · 절차 · 범위 및 기간
    req: PSR-003
    summary: "(종료 후 1년, 응답 정확성까지 하자) 최종산출물 인도일부터 **1년간 무상 하자보수**를 하며, TER-003 정량 기준 미달도 하자로 보고 원인·조치 내역을 문서로 제출함"
    blocks:
    - type: process
      rows:
      - {label: 접수, items: ["지원 창구 접수 · 등급 판정", "이슈 번호 발행"], result: "접수 통보"}
      - {label: 분석, items: ["재현 · 원인 분석", "골든셋 재실행으로 영향 확인"], result: "원인 확정"}
      - {label: 조치, items: ["수정 · 시험 · 형상 반영", "온사이트 필요 시 방문"], result: "조치 완료"}
      - {label: 보고, items: ["원인 · 조치 내역 문서 제출", "재발 방지 골든셋 추가"], result: "하자 처리 보고서"}
    - type: table
      size: 9.5
      header: [항목, 내용]
      widths: [3.6, 12.4]
      rows:
      - [기간, "최종산출물 인도일부터 1년 (홈페이지 공개·4주 안정화 포함)"]
      - [하자 범위, "프로그램 비정상 동작 · 요구사항 미충족 · 오류, TER-003 정량 판정 기준 응답 정확성 미달"]
      - [제외 범위, "언어모델 생성 문장의 표현·유창성, 언어모델 자체 생성 속도"]
      - [조직, "하자보수 책임자 【성명】 + 부문별 담당 3명, 온사이트 지원 조직 (Ⅵ-7)"]
      - [보증, "하자보증 이행 각서 제출, 하자보수 보증금은 국가계약법령에 따름, 모든 비용 당사 부담"]
      - [하드웨어, "웹 서버 제조사 보증 【3년】, 부품은 최초 납품 규격 이상으로 교체"]
    - type: kpi
      items:
      - {value: "1", unit: 년, label: "무상 하자보수\n(인도일부터)"}
      - {value: "4", unit: 주, label: "공개 후 안정화\n(무상)"}
      - {value: "【3】", unit: 년, label: "웹 서버 HW\n제조사 보증"}

  - header: 6. 기밀보안
    h2: 6.1 보안 관리
    h3: 6.1.1 사업 수행 중 보안 관리 체계 · 개인정보 보호 대책
    req: SER-002
    summary: "(사업자 보안 준수사항 그대로) [별첨 1호] 사업자 보안 준수사항에 따라 **인원 · 자료 · 장비 · 원격 수행** 보안을 관리하고, 개인정보는 가명·합성 데이터 원칙과 접근 기록으로 보호함"
    blocks:
    - type: table
      size: 9.5
      header: [구분, 보안 대책]
      widths: [3, 13]
      rows:
      - [인원 보안, "전 인력 보안서약서 제출 · 착수 보안 교육, 하도급 인력 동일 적용, 투입·철수 시 계정 발급·삭제"]
      - [자료 보안, "발주기관 자료 지정 저장소 보관 · 반출 승인, 누출금지 대상정보(연계 규격 등) 별도 관리, 종료 시 반납·파기"]
      - [장비 보안, "개발 PC 디스크 암호화 · 백신 · 매체 통제, 반입 서버 보안 점검 후 교내망 연결"]
      - [원격 수행, "원격 수행 장소 · 인원 사전 제출, 발주기관 승인 VPN · 2단계 인증 · 접속 기록, 화면 녹화 【적용】"]
      - [개인정보, "시험·검수는 가명·합성 데이터, 실데이터는 교내 완결 모델만 사용, 영향평가 전 실데이터 미개통"]
      - [위규 처리, "[별첨 2호] 위규 처리 기준 · [별첨 3호] 위약금 기준 준수"]
    - type: flow
      steps:
      - {title: 착수, desc: "서약 · 보안 교육"}
      - {title: 수행, desc: "월 1회 보안 점검"}
      - {title: 검수 전, desc: "시큐어코딩 · 취약점"}
      - {title: 종료, desc: "반납 · 파기 · 확약"}
    - type: point
      color: navy
      title: AI 사업에 특화된 보안 항목
      text: "개발 중 상용 모델 API에는 합성 데이터만 보내고, 모델 공급사의 학습 미사용·데이터 미보관 조건을 확인한 계정만 사용합니다. 프롬프트·실행 기록에 개인정보가 남지 않도록 마스킹 상태를 주 1회 점검합니다."

  - header: 7. 비상대책
    h2: 7.1 장애 대응 및 온사이트 체계
    h3: 7.1.1 장애 대응 · 온사이트 · 백업·복구
    req: PSR-002
    summary: "(부산 현장 도착 시간을 입증) 부산 소재 지원 조직이 **장애 접수 후 【2시간】 이내 현장 도착**하고, 서울 본사 원격 지원과 함께 복구하며, 현장 인력은 구축 과정에 참여해 시스템을 미리 익힘"
    blocks:
    - type: table
      size: 9.5
      header: [구분, 소재, 인원, 역할, 입증 자료]
      widths: [3, 3.4, 1.6, 4.6, 3.4]
      rows:
      - [본사 지원, "서울 성동구 (본사)", "【4명】", "원격 진단 · 수정 배포 · 2차 방문", 재직증명]
      - [부산 현장 지원, "【부산 소재 협력사 · 주소】", "【2명】", "1차 현장 대응 · 서버·네트워크 점검", "【사업자등록증 · 확약서】"]
      - [서버 제조사, "【부산 서비스센터】", "-", "하드웨어 부품 교체 (NBD)", "【보증서】"]
    - type: table
      size: 9.5
      header: [현장 인력 지식 공유 방법, 내용]
      widths: [4.4, 11.6]
      rows:
      - [구축 과정 참여, "웹 서버 설치(W7) · 플랫폼 설치 · 시험(W10)에 현장 인력 참여"]
      - [교육, "운영자 교육 2회차 참석, 인프라 운영 매뉴얼 실습"]
      - [문서 인계, "장애 대응 절차서 · 구성도 · 연락 체계 인계, 분기 1회 모의 훈련"]
    - type: process
      rows:
      - {label: 감지·접수, items: ["모니터링 알림 · 창구 접수", "등급 판정 (30분 이내 응답)"], result: "장애 등급"}
      - {label: 1차 대응, items: ["원격 진단 · 현장 출동 (1등급 【2시간】)", "서비스 우회 (위젯 비활성 등)"], result: "영향 차단"}
      - {label: 복구, items: ["백업본 복구 (플랫폼 RPO 1시간, 홈페이지 6시간)", "RTO 4시간"], result: "서비스 정상"}
      - {label: 사후, items: ["원인 · 조치 보고서", "재발 방지 · 모의 훈련 반영"], result: "보고 완료"}
    - {type: note, text: "※ 소재지 자체 가점은 없으며(RFP 주1), 온사이트 대응 역량은 제시 내용과 입증 자료로 평가됨 — 지원 조직 구성·소재·인원 입증 자료 별첨 【확보 필요】"}
