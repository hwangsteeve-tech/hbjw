# =====================================================================
- num: Ⅰ
  title: 사업 이해 및 추진 전략
  toc: [본 사업의 위치, 역할 분담, 목표와 전략, 목표 시스템, 12주 일정]
  slides:
  - kind: visual
    title: 질의응답을 넘어 **업무를 완결하는** 교육혁신본부 AI 에이전트
    subtitle: "실행기반(권한 · 실행 기록) 위에 과제 1~5 시범 구현 + 본부 홈페이지 신규 구축 · 사이드 패널 이식 (글로컬대학30 9-3-2)"
    eval: [사업이해도]
    facts:
      - {label: 발주기관, value: "부산대학교\n교육혁신본부"}
      - {label: 사업기간, value: "계약일 ~\n’27. 2. 19.(금)"}
      - {label: 사업금액, value: "5억 4,100만 원\n(VAT 포함)"}
      - {label: 구성, value: "3개 부문 · 5개 과제\n요구사항 58개"}

  - title: 1. 본 사업의 위치 — 범용 AI 위의 업무 완결형 에이전트
    headline: "학내 공통 AI는 **공개 문서 기반 범용 도구** — 본 사업은 !!원천 데이터 조회 · 시스템 처리 · 통제 · 기록!!을 더해 본부 업무를 끝까지 처리"
    eval: [사업이해도]
    conclusion: "핵심은 답변 품질보다 **누가 무엇에 접근해 무엇을 실행했는지를 서버가 통제 · 기록하는 기반**"
    columns:
      - w: 1.3
        blocks:
          - type: table
            size: 10.5
            header: [구분, 질의응답형 챗봇 (공통 AI), AI 에이전트 (본 사업)]
            widths: [2.4, 4.6, 5.6]
            rows:
              - [접근 데이터, "공개 문서 · 안내 자료", "규정 · 이수 이력 · 성과 정보"]
              - [처리 방식, "질문 → 검색 → 답변", "도구 실행 → 관찰 → 다음 단계 (반복)"]
              - [권한 통제, "불필요", "SSO + 서버 측 권한 검증"]
              - [실행 기록, "대화 로그", "일시 · 주체 · 수행 내용 · 결과"]
              - [업무 완결, "안내에서 종료", "성과 등록 · 프로그램 신청 (승인 후)"]
      - w: 1
        blocks:
          - type: layers
            side_w: 3.4
            layers:
              - {name: 대학 전략, items: ["PNU-AX", "A.U.R.A 2.0"], side: "글로컬30 9-3-2"}
              - {name: 공통 AI, items: ["다중 LLM 질의·요약", "생성형 AI 도구"], side: "범용"}
              - {name: 본 사업, items: ["과제 1~5", 실행기반, 홈페이지], side: "부서 특화"}
              - {name: 확산, items: ["타 부서 스킬", "위젯 이식"], side: "30,000명"}

  - title: 2. 학내 공통 AI와 역할 분담 · 이용자 혼선 방지
    headline: "범용 질의는 **공통 AI**, 원천 데이터 · 시스템 처리는 **본 사업** — 명칭 · 첫 화면 · 범위 밖 전환 · 운영 협의체로 !!혼선 없이!! 운영"
    eval: [사업이해도]
    columns:
      - w: 1
        blocks:
          - type: table
            size: 10.5
            header: [영역, 공통 AI, 본 사업]
            widths: [2.2, 4, 5]
            rows:
              - [업무, "질의 · 요약 · 번역 · 생성", "조회 · 대조 · 상태 변경 · 통제"]
              - [데이터, "공개 문서 · 업로드", "학사 · 성과 (서버 검증)"]
              - [이용자, "전 구성원 동일", "시범 100명 + 방문자 차등"]
              - [결과, "답변 · 생성물", "근거 조항 대조 · 승인 후 실행"]
          - type: flow
            size: 10
            steps:
              - {title: 질의, desc: "패널·채팅"}
              - {title: 범위 판별, desc: "본부 / 범용"}
              - {title: 본부 업무, desc: "도구 실행"}
              - {title: 범용, desc: "공통 AI 안내"}
      - w: 1
        blocks:
          - type: cards
            cols: 2
            size: 10.5
            items:
              - {title: 서비스 명칭 구분, desc: ["‘교육혁신본부 에이전트’", "담당 범위 상단 상시 표기", "아이콘 · 색상도 공통 AI와 구분"]}
              - {title: 첫 화면 안내, desc: ["추천 질문을 본부 업무로 한정", "이수 상담 · 성과 · 프로그램", "관리자가 안내문 직접 수정"]}
              - {title: 범위 밖 전환, desc: ["번역 · 작문 등 범용 질의", "공통 AI 바로가기 안내", "판별 결과 기록 · 오분류 점검"]}
              - {title: 운영 협의체, desc: ["AX·정보화혁신본부와", "역할 · 로드맵 정기 점검", "착수 · 검수 시 2회 협의"]}

  - title: 3. 목표와 4대 추진 전략
    headline: "실행기반 · 통제 체계를 **착수 3주 안에 먼저** 세우고, 과제 1~5와 홈페이지를 그 위에 !!3트랙 병행!!으로 구축"
    eval: [추진전략, "적용기술·방법론"]
    columns:
      - w: 1.4
        blocks:
          - type: cards
            cols: 2
            size: 10.5
            items:
              - {title: "① 실행 기반 우선", desc: ["SSO · 권한 · 정책 검사 · 실행 기록 선구축", "과제는 도구(MCP) · 스킬로 추가", "설치요건서 D+7 → 설치 W3"]}
              - {title: "② 종료일 역산 3트랙", desc: ["실행기반 · AI 앱 · 홈페이지 동시 진행", "연결점(SSO · 위젯 · 색인)만 일정 고정", "IA · 시안 확정 선행 (2주)"]}
              - {title: "③ 검수 기준 상시 측정", desc: ["골든셋 160문항 착수 2주 구성", "테스트 에이전트로 매주 자동 측정", "미달 기준은 담당자 지정 보완"]}
              - {title: "④ 확산 가능한 구조", desc: ["MCP · 임베딩 위젯 · 개방 형식", "타 부서 · 타 사이트 추가 개발 없음", "전 구성원 30,000명 확장 설계"]}
      - w: 1
        blocks:
          - type: kpi
            h: 2.4
            items:
              - {value: "5", label: "개 과제 MVP"}
              - {value: "0건", label: "권한 밖 노출"}
          - type: table
            size: 10
            header: [성과지표, 목표]
            widths: [3.6, 2.6]
            rows:
              - [원천값 일치, "100%"]
              - [근거 인용 정확도, "90% 이상"]
              - [도구 호출 성공률, "95% 이상"]
              - [동시 사용자, "100명"]
              - [색인 반영, "1시간 이내"]

  - title: 4. 목표 시스템 — 두 서버, 하나의 통제 지점
    headline: "플랫폼은 발주기관 서버, 홈페이지는 납품 웹 서버 — **모든 학내 시스템 접근은 MCP 도구를 거쳐 서버 검증 · 실행 기록**의 대상"
    eval: [실행기반 아키텍처, "적용기술·방법론"]
    conclusion: "LLM 도입 · 플랫폼 서버는 범위 외 — **설치요건서(D+7)와 모델 게이트웨이**로 연결만 책임짐"
    blocks:
      - type: layers
        side_w: 6
        layers:
          - {name: 이용자, items: ["교원 · 학생 · 상담 담당자 · 평가 담당자", "홈페이지 방문자 (비로그인 포함)"], side: "SSO로 신분 · 소속 식별"}
          - {name: 접점, items: ["플랫폼 웹 (채팅 · 관리자)", "홈페이지 + 사이드 패널 위젯", 테스트 에이전트 CLI], side: "SIR-006 · 007"}
          - {name: AI 서비스, items: ["과제 1 통계", "과제 2 성과 입력", "과제 3 이수 상담", "과제 5 안내 · 신청"], side: "SFR-005~007 · 013"}
          - {name: 실행기반, items: ["실행 엔진 · 도구 · 스킬", "작업공간 · 세션", "정책 검사 · 실행 기록", "다중 모델 · 지식"], side: "발주기관 제공 서버"}
          - {name: 연동, items: ["MCP 조회형", "MCP 변경형 (승인 필수)", "홈페이지 도구"], side: "서버 측 권한 재검증"}
          - {name: 학내 시스템, items: [SSO, 학사정보, 대학성과관리, 교수 성과 입력], side: "규격은 계약 후 제공"}

  - title: 5. 종료일(’27. 2. 19.) 역산 12주 일정
    headline: "검수 · 이관(W11~W12)을 먼저 고정하고 역산 — **설치요건서 D+7 · 수행계획서 D+14 · IA 2주**가 첫 관문, 홈페이지 공개는 검수 후 별도"
    req: PMR-001
    eval: ["관리방법론·일정", 추진전략]
    columns:
      - w: 1.6
        blocks:
          - type: table
            size: 9.5
            header: [구분, "W1~2 착수", "W3~5 설계", "W6~9 구현", "W10~12 시험·검수"]
            widths: [2.8, 2.8, 2.8, 2.8, 2.8]
            rows:
              - ["① 실행기반", "설치요건서", "설치 · SSO · 권한", "정책 · 기록 · 모델", "모델 전환 시연"]
              - ["② AI 앱", "골든셋 90", "연계 설계 · Mock", "과제 1~4", "TER-003 판정"]
              - ["③ 홈페이지", "IA (D+14)", "시안 3종 → 확정", "CMS · 서버 · 패널", "접근성 · 교육"]
              - [연결점, "규격 수령", "SSO 완료", "세션 · 색인", "통합 검수"]
      - w: 1
        blocks:
          - type: cards
            cols: 1
            size: 10
            items:
              - {title: 계약이 늦어지면, desc: ["설계 1주 단축 · 구현 2팀 병행", "시험 · 검수 3주는 유지", "영향 사항은 즉시 서면 보고"]}
