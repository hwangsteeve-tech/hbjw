  - header: 1. 인력 · 서비스수준 · 일정
    h2: 1.2 추진일정
    h3: 1.2.1 12개월 추진일정 · 마일스톤
    summary: "(첫 2개월 인수 · 이후 정례 운영) 1 ~ 2월 인수 · SR 개통을 마치고, **6개 마일스톤**으로 품질 활동과 완료 · 인계까지 관리함 (→ Ⅲ.7)"
    blocks:
    - type: table
      size: 9
      header: [마일스톤, 시점, 완료 기준]
      widths: [3.6, 2.6, 9.8]
      rows:
      - [MS1 착수, "1월 2주", "사업수행계획서 승인 · 보안서약 · 비상연락망"]
      - [MS2 SR 개통, "1월 2주", "SR 도구 개통 · 13개 기관 계정 · 교육"]
      - [MS3 인수 완료, "2월 말", "인수 결과서 3건 · 현황자료 제출"]
      - [MS4 상반기 결산, "6월", "반기 실무자 회의 · 모니터링단 1차 · SLA 반기 검토"]
      - [MS5 품질 활동, "10월", "만족도 조사 · 모니터링단 2차 · 접근성 인증"]
      - [MS6 완료, "12월", "완료보고서 · 인수인계 · SR 이력 이관"]
    - type: kpi
      items:
      - {value: "12", unit: 회, label: "월간 운영보고"}
      - {value: "2", unit: 회, label: "반기 실무자 회의"}
      - {value: "1", unit: 개월, label: "종료 전 인계 착수"}
    - type: point
      color: blue
      title: 일정 확정 원칙
      text: "만족도 조사 · 모니터링단 · 접근성 인증 일정은 착수 시 주관기관 · 13개 기관과 협의해 확정하고, 전시 개막 등 기관 일정과 겹치지 않게 조정합니다."

  - header: 2. 보안 · 비상대책 · 지원
    h2: 2.1 보안 · 비상대책
    h3: 2.1.1 보안 이행 · 비상대책 · 교육 · 기술이전
    summary: "(기밀 보호 + 공백 없는 복구) 대표자 보안서약 · 승인 단말 · 시큐어코딩으로 보안을 지키고, **응용 백업 · 롤백 · 예비 인력**으로 장애와 결원에 대비함 (→ Ⅳ)"
    blocks:
    - type: table
      size: 9.5
      header: [구분, 이행 방안]
      widths: [3.4, 12.6]
      rows:
      - [보안, "보안지침 준수 · 대표자 보안서약 · 비밀유지계약 · 누출금지 정보 대장 · 승인 경로 원격 접속"]
      - [기술 보안, "시큐어코딩 · 보안약점 진단 · 웹쉘 모니터링 · 개인정보 접속기록 · 암호화"]
      - [비상대책, "응용 소스 · 설정 백업 · 롤백, 장애 등급별 대응, 예비 인력 1주 내 투입"]
      - [교육, "13개 기관 SR · 콘텐츠 교육, 주관기관 관리자 교육, 투입인력 서비스 · 보안 교육"]
      - [기술이전, "누리집 구조 · 배포 · 장애 대응 · 품질 관리 노하우 매뉴얼 · 실습"]
      - [하도급, "없음 — 당사 직접 수행"]
    - type: point
      color: navy
      title: 맺음말
      text: "국립중앙박물관 플랫폼을 운영해 본 경험으로, 13개 국립박물관 누리집이 같은 품질로 국민을 맞이하도록 첫 통합 유지관리를 책임지고 정착시키겠습니다."
    - type: kpi
      items:
      - {value: "0", unit: 건, label: "보안 취약점 목표"}
      - {value: "1", unit: 주 내, label: "예비 인력 투입"}
      - {value: "0", unit: "%", label: "하도급"}
