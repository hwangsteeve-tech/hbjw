      - [유지관리, "주간업무보고 / 월간업무보고 · 보안 보고서", "주간 / 월간"]
      - [유지관리, "운영매뉴얼 · 웹접근성 진단 결과 · 보안취약점 진단 결과(대표이사 확약서) · 만족도 · 모니터링 결과", "요청 시"]
      - [완료, "사업완료보고 · 외부인력 보안 관리 확인서 · 업무 인수인계 확인서 · SW사업정보", "검사완료 후 7일 이내"]
    - {type: note, text: "※ 월간 운영보고서 제출 · 확인은 월별 검수 및 기성금 지급 요건 (MAR-007)"}
    - type: point
      color: blue
