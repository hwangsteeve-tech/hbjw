      rows:
      - [사업 총괄 (PM), "【성명】", "【등급 · 자격】", "【 】%", "SPOC, 일정 · 품질 · 보안 관리, 월간보고 · 반기 회의"]
      - [응용SW 유지관리, "【성명】", "【등급 · 자격】", "【 】%", "13개 누리집 오류 수정 · 기능개선 · SR · 장애"]
