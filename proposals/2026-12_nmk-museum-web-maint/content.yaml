    req: MHR-001, PMR-002
    summary: "(PM 단일 창구 + 기관별 담당) PM이 13개 기관의 단일 창구를 맡고, 누리집마다 정/부 담당을 지정해 **응대 시간 · 수단 · 에스컬레이션 경로**를 명확히 함"
    blocks:
    - type: table
      size: 9.5
