      - [계획, "연간 운영계획 · 월간 계획 수립, 정례 품질 활동 일정 고정 (Ⅲ.7)"]
      - [조직, "용역책임자 · PM · 응용SW · 퍼블리싱/디자인 · 지원 조직 (Ⅰ.4)"]
      - [절차, "접수 → 검토 → 처리 → 확인 → 보고 (Ⅱ.3.1), 장애 대응 절차 (Ⅱ.3.3)"]
      - [범위, "13개 누리집 응용시스템 · 부가기능 모니터링 · 연계 조율 (인프라 제외)"]
      - [기간, "2027.1.1 ~ 12.31, 차기 사업자 미선정 시 자동 연장 기간 동일 수준 수행"]
      - [협조 체계, "문화체육관광부 · 주관기관 · 연계기관 역할 정의, 현안 · 법제도 개선 협의 (PSR-003)"]
    - type: layers
      height: 1.1
      layers:
      - {name: 정책 · 총괄, items: ["문화체육관광부", "국립중앙박물관"], side: "협의 · 승인", color: "1F4E9A"}
      - {name: 수행, items: ["당사 (응용 유지관리)", "13개 소속박물관"], side: "요청 · 처리", color: "2E6FC4"}
      - {name: 연계, items: ["인프라 유지관리", "한국문화정보원 · 솔루션 업체"], side: "합동 대응", color: "0E8FD6"}

  - header: 2. 운영지원계획
    h2: 2.2 인수인계 · 기술지원
    h3: 2.2.1 사업 종료 인수인계 · 기술지원
    req: PSR-001, PSR-002, COR-004
    summary: "(차기 사업자도 바로 운영) 종료 2주 전 산출물을 완비하고, **종료 1개월 전부터 인계 · SR 이력 전량 이관**으로 운영 공백 없이 넘김"
    blocks:
    - type: table
      size: 9.5
      header: [시점, 인수인계 활동]
      widths: [3.4, 12.6]
      rows:
      - ["종료 1개월 전", "차기 사업자 인계 착수, 누리집별 인계 일정 · 체크리스트"]
      - ["종료 2주 전", "모든 산출물 · 인수인계 자료 작성 완료"]
      - [종료 시, "SR 이력 전량 이관 (이관 가능 형태), 인수인계확인서 승인"]
      - [미선정 시, "신규 계약 전까지 유지관리 계속 수행 (일할 계산)"]
    - type: table
      size: 9.5
      header: [기술지원, 내용]
      widths: [3.4, 12.6]
      rows:
      - [주기적 모니터링, "업무장애 · 외부시스템 장애 시 긴급복구 기술지원"]
      - [환경 변화, "장비 · OS · DBMS 교체 · 업그레이드 시 시스템 변경 지원"]
      - [이전 · 재구성, "누리집 이전 · 재구성 요청 시 지원방안 제출 · 수행"]
    - type: point
      color: green
      title: 인수와 같은 기준으로 인계
      text: "착수 때 사용한 인수 체크리스트를 그대로 인계에 사용해, 차기 사업자가 같은 기준으로 확인할 수 있게 합니다."

  - header: 3. 기술이전계획
    h2: 3.1 기술이전
    h3: 3.1.1 운영 노하우 기술이전 계획
    req: PSR-004
    summary: "(노하우를 기관 자산으로) 13개 누리집의 **운영 · 장애 대응 · 배포 노하우**를 매뉴얼과 실습으로 주관기관 관리자에게 이전함"
    blocks:
    - type: table
      size: 9.5
      header: [이전 기술, 내용, 방법, 시기]
      widths: [3.2, 6.6, 3, 3.2]
      rows:
      - [누리집 구조, "메뉴 · 기능 · 연계 · 솔루션 현황", "현황자료 · 설명", "3월 · 분기"]
      - [운영 · 배포, "형상관리 · 배포 · 롤백 절차", "매뉴얼 · 실습", "6월"]
      - [장애 대응, "장애 시나리오 · 복구 지침", "모의훈련", "연 1회"]
      - [품질 관리, "접근성 · 성능 · 보안 점검 방법", "매뉴얼 · 설명회", "10월"]
      - [DB 운영, "DB 구조 · 표준화 · 공공문화정보 연계", "문서 · 설명", "협의 시"]
    - type: flow
      steps:
      - {title: 문서화, desc: "매뉴얼 · 현황자료"}
      - {title: 설명회, desc: "주관기관 관리자"}
      - {title: 실습, desc: "배포 · 장애 훈련"}
      - {title: 확인, desc: "이전 결과 보고"}
    - type: point
      color: navy
      title: 지속적 정보 제공
      text: "사업 기간 중 관련 분야 정보기술 동향과 보안 권고를 월간 운영보고서에 함께 제공합니다."

  - header: 4. 보안사항 이행방안
    h2: 4.1 보안 이행
    h3: 4.1.1 보안지침 준수 · 관리적 · 물리적 보안
    req: SER-001, SER-004, MHR-003
    summary: "(사업 전 과정 보안) 국가 사이버보안 기본지침 등 **보안지침을 준수**하고, 대표자 보안서약 · 비밀유지계약 · 누출금지 정보 대장 관리로 기밀을 보호함"
    blocks:
    - type: table
      size: 9
      header: [영역, 이행 방안]
      widths: [3.4, 12.6]
      rows:
      - [지침 준수, "국가 사이버보안 기본지침 · 용역업체 보안관리 가이드라인 · 클라우드 보안 · 개인정보 안전성 확보조치 · SW 개발보안 · 문체부 개인정보 보호지침 등 (공고일 최신)"]
      - [계약 단계, "수행계획서에 자료 · 장비 · 네트워크 보안대책, 대표자 보안서약서, 비밀유지계약"]
      - [인원, "개인 보안서약서 · 개인정보 처리위탁 계약 · 위탁 보안서약서, 착수 전 보안교육"]
      - [자료, "누출금지 정보 11종 자료관리 대장 (인계자 · 인수자 서명), 지정 PC · 파일서버 저장, 종료 시 회수"]
      - [원격 접속, "발주기관 · IDC 승인 경로 · 단말기만 사용, 접속 기록 관리"]
      - [위반 시, "보안 위약금(A ~ D 등급) 수용, 즉시 보고 · 차단 · 재발 방지"]
    - type: boxes
      cols: 4
      size: 9
      items:
      - {title: 보안서약, desc: "대표 · 전 인원"}
      - {title: 보안교육, desc: "착수 전 · 정기"}
      - {title: 승인 단말, desc: "원격 접속 통제"}
      - {title: 점검, desc: "월 1회 보안점검"}

  - header: 4. 보안사항 이행방안
    h2: 4.1 보안 이행
    h3: 4.1.2 기술적 보안 · 데이터 보안 · 취약점 제거
    req: SER-002, SER-003
    summary: "(13개 누리집 취약점 0건 유지) 시큐어코딩 · 보안약점 진단으로 **취약점을 찾아 제거**하고, 개인정보 접속기록 · 암호화 · 웹쉘 모니터링을 적용함"
    blocks:
    - type: table
      size: 9
      header: [영역, 이행 방안]
      widths: [3.4, 12.6]
      rows:
      - [데이터 보안, "인증정보 · 비밀번호 암호화 저장 · 하드코딩 금지, 개인정보 접속기록 (ID · 일시 · IP · 정보주체 · 수행업무) 1년(해당 시 2년) 보관"]
      - [개인정보 처리, "개인정보처리방침에 따른 처리 · 파기, 백업 데이터 생성 금지"]
      - [시큐어코딩, "SW 개발보안 가이드 준용 — 입력값 검증 · 인증 · 접근제어 · 에러 처리 · 캡슐화 · API"]
      - [취약점 점검, "SW 보안약점 진단가이드 기준 분석 · 조치, 문화체육관광 사이버안전센터 권고 준용, 대표이사 명의 확인서"]
      - [웹쉘 대응, "업로드 경로 · 확장자 통제, 웹쉘 주기 모니터링"]
      - [결과 관리, "점검 결과 대외비 관리, 기관 보안담당자 확인"]
    - type: process
      rows:
      - {label: 계획, items: ["취약점 점검 계획", "13개 누리집 일정"], result: "점검 계획서"}
      - {label: 점검, items: ["도구 · 수동 점검", "웹쉘 모니터링"], result: "점검 결과"}
      - {label: 조치, items: ["보안약점 제거", "재점검"], result: "조치 결과서"}
      - {label: 확인, items: ["보안담당자 확인", "대표이사 확인서"], result: "보고"}

  - header: 5. 비상대책계획
    h2: 5.1 백업 · 복구 · 장애대응
    h3: 5.1.1 백업 · 복구 및 장애대응 대책
    req: MAR-006, MAR-003, COR-002
    summary: "(응용 계층 복구 책임) **응용 소스 · 산출물 · 설정을 백업**해 언제든 이전 버전으로 되돌리고, 장애 등급별 대응 목표와 비상연락 체계로 복구함"
    blocks:
    - type: table
      size: 9.5
      header: [대상, 백업 · 복구 방안, 주기]
      widths: [3.4, 9.6, 3]
      rows:
      - [응용 소스 · 설정, "형상 저장소 + 발주기관 지정 장소 백업, 배포 전 백업 · 롤백", "배포 시 · 주 1회"]
      - [산출물, "버전 관리 · 지정 장소 백업", "월 1회"]
      - [서버 · 데이터, "인프라 유지관리 사업 범위 — 복구 시 응용 검증 지원", "-"]
    - type: table
      size: 9.5
      header: [장애 등급, 기준, 대응 목표]
      widths: [2.6, 7.4, 6]
      rows:
      - [긴급, "누리집 서비스 중단 · 보안 사고", "즉시 보고 · 2시간 착수 · 4시간 정상화"]
      - [중요, "주요 기능(예약 · 검색 · 게시판) 장애", "2시간 착수 · 4시간 정상화"]
      - [일반, "일부 화면 · 콘텐츠 오류", "SR 처리 기준 (3일 이내)"]
    - type: flow
      steps:
      - {title: 감지, desc: "모니터링 · 신고"}
      - {title: 보고, desc: "주관기관 · 기관"}
      - {title: 격리 · 우회, desc: "안내 페이지"}
      - {title: 복구, desc: "롤백 · 수정"}
      - {title: 재발 방지, desc: "보고서"}

  - header: 5. 비상대책계획
    h2: 5.2 예비 자원 · 지원 대책
    h3: 5.2.1 예비 인력 · 장비 보유현황 및 지원 대책
    req: COR-004, COR-002
    summary: "(사람이 예비 자원) 응용 유지관리의 예비 자원은 **예비 인력 · 원격 작업 단말 · 테스트 환경**이며, 결원 · 장애 시 즉시 투입해 서비스 공백을 막음"
    blocks:
    - type: table
      size: 9.5
      header: [예비 자원, 보유 · 지원 대책]
      widths: [3.6, 12.4]
      rows:
      - [예비 인력, "응용SW · 퍼블리싱 분야별 예비 인력 지정 【성명】, 결원 시 1주 내 투입"]
      - [원격 작업 단말, "승인 단말 예비 1대 【 】, 보안 프로그램 설치 · 봉인 관리"]
      - [테스트 환경, "개발 · 시험 환경 (유휴 장비 활용, 발주기관 협의)"]
      - [H/W 예비장비, "서버 · 네트워크 H/W는 인프라 유지관리 사업 범위"]
    - type: point
      color: navy
      title: 확인 사항 (서면 질의)
      text: "COR-004의 '예비장비 · 부품 부족 시 해지' 조항은 H/W가 범위에서 제외된 본 사업 특성상 예비 인력 · 작업 단말로 해석했으며, 본공고 전 의견으로 확인합니다."
    - type: kpi
      items:
      - {value: "1", unit: 주 내, label: "예비 인력 투입"}
      - {value: "24", unit: "×365", label: "비상연락 체계"}
    - type: boxes
      cols: 3
      size: 9.5
      items:
      - {title: 예비 인력, desc: "분야별 지정 · 1주 내"}
      - {title: 작업 단말, desc: "승인 단말 예비"}
      - {title: 테스트 환경, desc: "사전 검증 · 복구 시험"}

  - header: 6. 기타 지원사항
    h2: 6.1 추가 제안
    h3: 6.1.1 RFP 외 추가 지원 제안
    summary: "(통합 효과를 키우는 제안) 13개 누리집이 같은 환경임을 활용한 **공통 개선 패키지 · 통합 현황 대시보드 · 차년도 개선 로드맵**을 추가로 제공함"
    blocks:
    - type: themes
      items:
      - title: 공통 개선 패키지
        text: "13개 누리집에 공통으로 필요한 접근성 · 성능 · 보안 개선을 하나의 패키지로 만들어 순차 적용합니다."
        points: ["한 번 개발, 13개 적용", "기관별 일정 조율"]
      - title: 통합 현황 대시보드
        text: "SR · 장애 · 가용성 · 이용통계를 13개 기관 비교 화면으로 제공해 주관기관이 한눈에 관리합니다."
        points: ["기관별 · 전체 비교", "월간보고와 같은 지표"]
      - title: 차년도 개선 로드맵
        text: "1년 운영 데이터를 바탕으로 누리집 공통 템플릿 · 표준화 방향을 완료보고서에 제안합니다."
        points: ["공통 템플릿 검토", "예산 · 일정 제안"]
    - type: kpi
      items:
      - {value: "13", unit: 배, label: "공통 개선 효과"}
      - {value: "1", unit: 화면, label: "통합 현황 조회"}
    - type: point
      color: green
      title: 추가 비용 없음
      text: "추가 제안 항목은 본 사업 범위와 인력 안에서 수행하며, 별도 비용을 요구하지 않습니다."

