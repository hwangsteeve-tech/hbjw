      - [퍼블리싱/디자인, "【성명】", "【등급 · 자격】", "【 】%", "화면 개선 · 웹표준 · 접근성 · 팝업 · 배너"]
      - [지원 (비상주), "【성명】", "【등급 · 자격】", "필요 시", "웹 접근성 진단 · 보안 점검 · 예비 인력"]
    - {type: note, text: "※ 분야별 인원 · 투입률은 사업비 규모를 고려해 확정 / 착수계 제출 시 기술경력증명서 · 졸업증명서 · 4대보험 자료 제출"}
