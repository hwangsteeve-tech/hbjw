      - [DBMS, "Oracle · MariaDB · MySQL, SQL 튜닝"]

  - header: 2. 조직운영 및 인력투입계획
    h2: 2.2 인력 운영 · 관리
    h3: 2.2.1 인력 운영 · 변경 · 근무 관리
    req: MHR-001, MHR-002, MHR-003
    summary: "(원격 원칙 · 현장 대응 확보) 원격 수행을 원칙으로 하되 **필요 시 현장 방문 인력을 확보**하고, PM은 사업 기간 중 교체하지 않으며 변경 시 2주 병행 인수인계함"
    blocks:
    - type: table
      size: 9
      header: [관리 항목, 운영 방안]
      widths: [3.6, 12.4]
      rows:
      - [근무 형태, "원격 수행 원칙, 장애 · 협의 · 회의 시 현장 방문 (서울 본사 → 소속박물관 당일 이동 계획)"]
      - [PM, "월 1회 이상 국립중앙박물관 방문 보고, 반기 1회 실무자 회의 참석, 사업 기간 중 교체 없음"]
      - [인력 변경, "2주 전 사전 협의 · 승인, 동급 이상 교체, 2주 병행 근무 인수인계 (인건비 별도 청구 없음)"]
      - [정/부 관리, "업무별 정/부 담당, 동시 부재 금지, 주말 · 휴일 당번 지정"]
      - [근무 관리, "근무상태 자체 관리 · 발주기관 협의, 야간 · 휴일 근무 수당은 당사 부담"]
      - [역량 교육, "월 1회 자체 서비스 교육, 연 2회 전문 강사 교육, 개인정보 · 보안 교육"]
    - type: kpi
      items:
      - {value: "0", unit: 회, label: "PM 교체 (사업 기간)"}
      - {value: "2", unit: 주, label: "교체 시 병행 근무"}
      - {value: "월 1", unit: 회, label: "PM 방문 보고"}
    - type: point
      color: navy
      title: 확인 사항 (서면 질의)
      text: "RFP의 '비상주(원격) 수행 원칙'(MHR-001)과 '동일 장소 합동 상주'(MHR-003) 문구는 비상주 원칙을 기준으로 이해했으며, 본공고 전 의견으로 확인합니다."

  - header: 3. 정보시스템 유지보수 수행방안
    h2: 3.1 유지보수 수행
    h3: 3.1.1 오류 수정 · 콘텐츠 운영 지원 · 환경 변화 대응
    req: MAR-001, PSR-002
    summary: "(13개 누리집 공통 절차) 오류는 **원인 분석 → 수정 → 재발방지**, 콘텐츠는 게시 지원 · 기술 문의 응대, 조직 · 전시실 개편은 구조 변경으로 지원함"
    blocks:
    - type: table
      size: 9
      header: [업무, 수행 내용]
      widths: [3.6, 12.4]
      rows:
      - [오류 수정, "화면 · 기능 결함 조치, 원인 분석 · 재발방지 대책, 디자인 개선 · 퍼블리싱 · 검색 유지관리"]
      - [부가기능 모니터링, "게시판 · 첨부 · 검색 · 웹에디터 · 문서뷰어 · 문자발송 상시 확인, 이상 시 솔루션 업체 연계 (결함 수정은 제공업체)"]
      - [콘텐츠 운영 지원, "전시 · 교육 · 행사 · 소장품 콘텐츠 게시 오류 조치 · 게시 지원, 담당자 기술 문의 응대"]
      - [환경 변화, "조직 개편 · 전시실 개편 · 관람정책 변경 시 내용 · 구조 변경"]
      - [연계 대응, "국립중앙박물관 대표누리집 · e뮤지엄 연계 변경 협의, 연계 오류 원인 파악 · 즉시 통보"]
      - [기술지원, "환경설정 · 응용SW 설치 · 설정 변경, 장비 · OS · DBMS 교체 · 업그레이드 시 변경 지원"]
    - type: boxes
      cols: 3
      size: 9.5
      items:
      - {title: 원인 분석, desc: "로그 · 재현 · 영향 범위"}
      - {title: 수정 · 검증, desc: "테스트 환경 · 기관 확인"}
      - {title: 재발 방지, desc: "공통 결함은 13개 일괄 점검"}

  - header: 3. 정보시스템 유지보수 수행방안
    h2: 3.1 유지보수 수행
    h3: 3.1.2 소규모 기능개선 절차
    req: MAR-004
    summary: "(사업자가 임의 판단하지 않음) 기능개선은 SR로 접수해 **소요 M/D · 일정을 산정 · 제시**하고, 범위 내 처리 여부를 주관기관 · 해당 기관과 협의해 결정함"
    blocks:
    - type: process
      rows:
      - {label: 요청, items: ["SR 도구 접수", "요구 내용 확인"], result: "기능개선 SR"}
      - {label: 산정, items: ["소요 M/D · 일정", "영향 범위 · 접근성 검토"], result: "산정서"}
      - {label: 협의, items: ["범위 내 처리 여부", "주관기관 · 기관 협의"], result: "처리 결정"}
      - {label: 개발 · 시험, items: ["테스트 환경 사전 검증", "웹 접근성 · 표준 준수"], result: "시험 결과"}
      - {label: 반영 · 안내, items: ["배포 · 롤백 방안", "공지 · 공문 안내 지원"], result: "완료 보고"}
    - type: table
      size: 9.5
      header: [기능개선 유형, 예시]
      widths: [4, 12]
      rows:
      - [편의성 개선, "메뉴 · 검색 · 예약 안내 화면 개선, 모바일 화면 개선"]
      - [보안 · 개인정보, "웹 취약점 · 개인정보 보호 조치, 보안평가 결과 반영"]
      - [법 · 제도 · 환경, "법 · 제도 변경 반영, OS · DBMS 등 환경 변화 대응"]
      - [이벤트 지원, "설문 · 이벤트 페이지 제작, 팝업 · 배너 제작"]

  - header: 3. 정보시스템 유지보수 수행방안
    h2: 3.2 형상 · 산출물 관리
    h3: 3.2.1 소스 · 산출물 형상관리 및 배포
    req: MAR-006, PMR-005, QUR-001
    summary: "(13개 누리집 하나의 형상 저장소) 소스 · 설정 · 산출물을 **누리집별 저장소로 버전 관리**하고, 테스트 환경 검증 · 롤백 방안을 갖춘 배포만 운영에 반영함"
    blocks:
    - type: table
      size: 9
      header: [관리 대상, 방법]
      widths: [3.6, 12.4]
      rows:
      - [소스 · 설정, "누리집별 형상 저장소 (Git 【 】), 변경 사유 · 일시 · 담당 · 내역 기록, 주석에 개선 일시 · 이슈 번호"]
      - [산출물, "운영 매뉴얼 · 현황자료 · 장애보고서 · 표준산출물 버전 관리, EA 시스템 반영"]
      - [백업, "소스 · 산출물 · 응용 설정을 발주기관 지정 장소에 주기 백업 (서버 · 데이터는 인프라 사업)"]
      - [배포, "테스트 환경 검증 → 기관 일정 협의 → 배포 → 롤백 대비, 배포 이력 기록"]
      - [현황자료, "메뉴 구조 · 기능 · 연계 · 솔루션 버전 · 담당자 — 착수 2개월 제출, 분기 현행화"]
    - type: flow
      steps:
      - {title: 변경 요청, desc: "SR 번호"}
      - {title: 개발, desc: "브랜치 · 주석"}
      - {title: 시험, desc: "테스트 DB · 환경"}
      - {title: 승인, desc: "기관 일정 협의"}
      - {title: 배포, desc: "이력 · 롤백"}
    - type: kpi
      items:
