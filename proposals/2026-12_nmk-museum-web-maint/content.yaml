    - type: kpi
      items:
      - {value: "14", unit: 일, label: "수행계획서 제출"}
      - {value: "7", unit: 일, label: "완료 산출물 (검사 후)"}

  - header: 4. 품질보증방안
    h2: 4.1 품질보증 체계
    h3: 4.1.1 품질보증 조직 · 방법 · 절차
    req: QUR-001, PMR-001
    summary: "(수행 담당과 분리된 품질 점검) 품질 담당이 **계획 · 점검 · 시정 · 보고** 순서로 매월 품질을 확인하고, 「정보시스템 구축 · 운영 지침」의 반복 업무를 매뉴얼로 관리함"
    blocks:
    - type: process
      rows:
