    req: MHR-001
    summary: "(3개 분야 · 원격 수행) RFP 분야(사업 총괄 · 응용SW · 퍼블리싱/디자인)별로 인력을 배치하고, 13개 누리집의 **Java/JSP · Windows/Linux · Apache · Tomcat · Oracle · MariaDB · MySQL 환경**을 모두 다루는 인력을 투입함"
    blocks:
    - type: table
      size: 9
      header: [분야, 성명, 등급 · 자격, 투입, 주요 업무]
