              - {title: "② 도구 기반", desc: ["웹 SR 도구 착수 2주 개통", "13개 누리집 5분 모니터링", "기관별 · 전체 통계"]}
              - {title: "③ SLA 기반", desc: ["가용률 · 장애 · SR · 보고 지표", "월간 측정 · 보고", "반기 검토 · 조정"]}
              - {title: "④ 공통 개선", desc: ["접근성 · 성능 · 보안 패키지", "한 번 개발, 13개 적용", "기관별 일정 조율"]}
      - w: 1
        blocks:
          - type: kpi
            h: 2.2
            items:
              - {value: "2시간", label: "장애 착수"}
              - {value: "4시간", label: "정상 가동"}
          - type: kpi
            h: 2.2
            items:
              - {value: "2주", label: "SR 도구 개통"}
              - {value: "2개월", label: "13개 인수"}

  - title: 4. 착수 2개월 통합 인수 · 위험 대응
    headline: "13개 누리집을 **3차수 표준 체크리스트**로 인수하고, 통합 최초 사업의 !!6대 위험!!을 착수 시 등록해 예방 · 대안을 준비"
    eval: [추진전략]
    conclusion: "인수 기간에도 **1월 1일부터 SR 접수 · 장애 대응은 즉시 시작** — 서비스 공백 없음"
    columns:
      - w: 1
