    conclusion: "모든 요청은 SR 도구로, 모든 상태는 모니터링으로, **모든 결과는 월간 운영보고서로** 모임"
    blocks:
      - type: layers
        side_w: 5
        layers:
          - {name: 기관 채널, items: ["국립중앙박물관 총괄", "13개 소속박물관", "이용자 · 모니터링단"], side: "요청 · 확인"}
          - {name: 통합 SR, items: ["웹 SR 도구", "기관별 계정 · 통계", "메일 · 문자 알림"], side: "MAR-002"}
          - {name: 유지관리 수행, items: ["오류 수정 · 기능개선", "콘텐츠 · 화면 개선", "장애 대응"], side: "MAR-001 · 003 · 004"}
          - {name: 품질 활동, items: ["성능 · 검색", "접근성 · 표준", "만족도 · 모니터링단"], side: "MAR-005 · 008~010"}
          - {name: 운영 기반, items: ["형상관리 · 테스트", "통합 모니터링", "인프라 · IDC 합동"], side: "MAR-006 · 007"}

  - title: 3. 4대 추진전략
    headline: "**단일 창구 · 도구 기반 · SLA 기반 · 공통 개선**으로 첫 통합 사업을 !!1년 안에 표준 운영체계로 정착!!"
    eval: [추진전략]
