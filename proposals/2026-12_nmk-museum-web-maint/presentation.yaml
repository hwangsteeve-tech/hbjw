  title: 사업 이해 및 추진 전략
  toc: [사업 이해, 현황과 개선 방향, 목표 운영체계, 추진 전략, 통합 인수 · 위험 대응]
  slides:
  - kind: visual
    title: 13개 국립박물관 누리집, **하나의 품질**로
    subtitle: "개별 계약으로 나뉘어 있던 소속박물관 대표누리집 유지관리를 국립중앙박물관 중심 통합 체계로 — 첫 통합 사업을 안정적으로 정착"
    eval: [사업이해도]
    facts:
      - {label: 발주기관, value: "국립중앙박물관\n디지털박물관과"}
      - {label: 사업기간, value: "2027.1.1 ~ 12.31\n(12개월)"}
      - {label: 사업금액, value: "1억 9,800만 원\n(VAT 포함)"}
      - {label: 대상, value: "소속박물관\n대표누리집 13종"}

  - title: 1. 현황 문제와 통합 유지관리 개선 방향
    headline: "기관마다 업체 · 방식 · 보고가 달라 **서비스 수준이 들쭉날쭉** — !!하나의 SR 도구 · SLA · 보고 체계!!로 13개 누리집을 같은 기준에서 관리"
    eval: [사업이해도]
    conclusion: "13개를 한 업체가 맡는 것만으로는 통합이 아님 — **같은 도구 · 같은 기준 · 같은 보고**로 운영해야 편차가 사라짐"
    columns:
      - w: 1.5
        blocks:
          - type: table
            size: 10
            header: [구분, 현황 (개별 유지관리), 통합 유지관리]
            widths: [2.2, 5, 5.6]
            rows:
              - [창구, "13개 기관별 개별 계약", "PM 단일 창구 (SPOC)"]
              - [요청 처리, "업체 게시판 · 이력 단절", "웹 SR 도구 · 영구 이력"]
              - [보고, "표준 보고 미흡", "월간 8개 항목 · 반기 회의"]
              - [서비스 수준, "기관별 편차 · SLA 부재", "SLA 7개 지표 공통"]
              - [산출물, "보유 수준 상이", "2개월 표준 인수 · 현행화"]
              - [품질 활동, "기관별 편차", "만족도 · 모니터링단 · 인증 공통"]
      - w: 1
        blocks:
          - type: kpi
            h: 2.2
            items:
              - {value: "13종", label: "JSP/Java · IDC 가상화"}
              - {value: "32개", label: "요구사항 전부 수용"}
          - type: cards
            cols: 1
            size: 10.5
            items:
              - {title: 범위 경계, desc: ["본 사업: 13개 누리집 응용시스템", "별도: IDC 서버 · 상용SW · 네트워크 · 보안관제", "부가기능 · 연계는 모니터링 · 조율", "웹접근성 인증 수수료 · 모니터링단 사례비: 주관기관", "범위 밖 요청도 거부 대신 협의 절차로"]}

  - title: 2. 목표 운영체계 — 기관 채널부터 인프라 연계까지
    headline: "**기관 채널 · 통합 SR · 유지관리 수행 · 품질 활동 · 운영 기반** 5계층으로 운영하고, 인프라 사업자 · IDC와 !!합동 대응 체계!!로 연결"
