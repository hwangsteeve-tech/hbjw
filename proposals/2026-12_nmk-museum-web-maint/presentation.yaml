  - title: 2. 통합 모니터링 · 통계 · 정기 보고
    headline: "13개 누리집 **가용성을 5분마다 자동 점검**하고, 이용통계와 !!8개 필수 항목 월간 운영보고서!!로 매월 검수 받음"
