              - [DICOM, "식별 태그 제거·마스킹, burned-in 문자 탐지"]
              - [CT·MR 안면, "3D 안면(스킨) 제거 (Defacing)"]
              - ["텍스트 (EMR·PDF)", "성명·주민번호·연락처 자동 탐지"]
              - [감사, "요청·승인·기법·일시 로깅 (가이드라인 준수)"]

  - title: 6. 수집 관제 · 모니터링
