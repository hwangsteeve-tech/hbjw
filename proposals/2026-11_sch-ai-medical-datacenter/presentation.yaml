              - [Zero-footprint, "메모리 렌더링, 종료 시 흔적 삭제"]
              - [영상 처리, "Layout, Zoom·Rotate·Pan·Fit·WWL"]
              - [통합 브라우저, "다른 검사·문서 동시 비교, 썸네일"]
              - [Open API, "DICOM Q/R·DICOMweb·IHE XDS·FHIR"]
      - w: 1
        blocks:
          - type: flow
            size: 10
            steps:
              - {title: EMR·CDW, desc: "뷰어 호출"}
