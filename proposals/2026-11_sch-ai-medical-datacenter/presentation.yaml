              - [역할 권한, "역할별 CRUD·권한별 화면"]

  - title: 5. 비식별화 처리 시스템
    headline: "원본은 그대로, **반출 승인 데이터만 익스포트 가상화 서버에서 배치 비식별** — 가명처리 · k≥5 익명성 · DICOM 태그 · 안면 재식별 방지"
    req: SR-001
    eval: [기능 구현, 보안 적용]
    conclusion: "비식별 적정성 · 재식별 위험 평가 **내부평가서를 연차 종료 평가서에 첨부**"
