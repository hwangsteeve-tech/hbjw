  - title: 7. 기술적 보안 — 암호화 · 접근통제 · 감사
    headline: "**저장 AES-256 · 전송 TLS 1.3**, 암호키 생명주기, RBAC, 위변조 방지 로그, 원본 · 비식별 분리로 의료정보를 설계 단계부터 보호"
