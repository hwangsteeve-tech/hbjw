                  - {text: "추출 이력 감사 추적"}
                  - {text: "추출 대상 목록 자동 생성"}

  - title: 4. DICOM Web 뷰어 · EMR 연동
    headline: "**HTML5 Zero-footprint 뷰어**로 설치 없이 조회하고, 환자의 다른 검사 · 문서를 함께 비교하며, EMR · CDW에서 **토큰으로 바로 호출**"
    req: SR-002, SR-005, SR-006
    eval: [기능 구현, 사용자 인터페이스]
    columns:
      - w: 1.2
        blocks:
          - type: table
            size: 10
            header: [기능, 구현 방안]
            widths: [3, 7.6]
            rows:
