# =====================================================================
- num: Ⅰ
  title: 사업의 이해
  toc: [배경 및 필요성, 사업 목표, 핵심 이슈와 대응]
  slides:
  - kind: visual
    title: 근거로 증명하는 지역혁신 성과 플랫폼
    subtitle: "지역문제 → 사업운영 → 리빙랩 → 성과·증빙 → 정책환류를 하나의 데이터 체계로"
    eval: [사업이해도]
    facts:
      - {label: 발주기관, value: "부산대학교 앵커사업단\n지역사회혁신본부"}
      - {label: 사업기간, value: "계약일로부터 3개월\n(~2027.02.12)"}
      - {label: 사업금액, value: "3억 원\n(VAT 포함)"}
      - {label: 구축 범위, value: "공개 성과포털 · 내부 업무포털\n관리자 · 데이터 · AI 설계 · 서버"}

  - title: 1. 배경 및 필요성
    num: "01"
    subtitle: 현행 문제와 구조 전환
    headline: "세부과제별로 흩어진 자료를 **하나의 표준과 업무흐름**으로 묶어 !!실적마다 근거가 연결되는!! 성과관리 체계로 전환"
    eval: [사업이해도]
    columns:
      - w: 1
        arrow_after: true
        blocks:
          - type: panel
            title: 현행 업무의 한계
            blocks:
              - type: bullets
                size: 10.5
                items:
                  - {text: "(분산 관리) 운영실적·참여자·만족도·협력기관·증빙이 개별 파일로 흩어짐", sub: ["평가 대응 때마다 반복 취합"]}
                  - {text: "(정량 편중) 건수·인원 중심, 인터뷰·정책제안 등 정성성과 미축적"}
                  - {text: "(근거 단절) 실적 수치와 증빙자료가 연결되지 않음"}
                  - {text: "(연도 변동) 매년 교내 공모로 세부사업·학과·지표가 바뀜"}
      - w: 1.9
        blocks:
          - type: panel
            title: 목표 시스템 정의
            blocks:
              - type: flow
                size: 10
                steps:
                  - {title: ① 표준화, desc: "사업·프로그램·리빙랩·참여자·성과 표준 통합"}
                  - {title: ② 신뢰성, desc: "실적-증빙 연결, 검토·승인"}
                  - {title: ③ 가시화, desc: "대시보드·GIS로 현황 제공"}
                  - {title: ④ 확장성, desc: "AI·연계 고도화 대응 구조"}
              - type: cards
                cols: 3
                size: 10
                items:
                  - {title: 대외 공개 성과포털, desc: ["승인된 성과만 공개", "앵커사업단 홈페이지"]}
                  - {title: 내부 업무포털, desc: ["계획→운영→증빙→승인", "정책환류·변화분석"]}
                  - {title: 관리자 시스템, desc: ["연도별 권한·사업 변동", "코드·지표 사전·로그"]}

  - title: 1. 배경 및 필요성
    num: "02"
    subtitle: 대상 사업 분석
    subtitle_note: 앵커사업 9번 단위과제 9-1~9-6
    headline: "6개 세부과제의 업무·데이터 특성을 분석하여 **공통기능 + 과제별 확장영역**으로 설계"
    eval: [사업이해도]
    conclusion: "부산시 지정지표는 공식 명칭 그대로, 과제별 **내부 관리지표·프로그램 기여지표**는 추가 설정"
    blocks:
      - type: table
        size: 10
        grow: true
        header: [코드, 세부과제, 데이터 특성, 핵심 성과지표, 설계 반영]
        widths: [1.2, 3.6, 6, 6.2, 6]
        rows:
          - ["9-1", 우리동네·우리대학 문화살롱, "유휴공간 거점, 인문학 프로그램, 온라인 강좌", "(시) 운영 건수·만족도 / (대) 온라인 수강자", "공간 위치(GIS), 수강 실적 업로드"]
          - ["9-2", BUSAN CREATIVE, "영상·문화예술 콘텐츠, 상영·전시", "(시) 운영 건수", "대용량 영상 분리 저장, 콘텐츠 메타"]
          - ["9-3", 시민참여 공간 개선 리빙랩, "빅데이터+정성데이터 지역문제 진단", "(시) 만족도·운영 건수 / (대) 분석보고서", "지역문제-리빙랩 단계 연결"]
          - ["9-4", "부산형 AIP 리빙랩", "의료·보건·사회서비스 연계 교육", "(시) 운영 건수 / (대) 분석보고서", "민감정보 최소수집·비식별"]
          - ["9-5", "미래사회 Feed-forward 리빙랩", "미래 예측 기반 문제 예견", "(시) 운영 건수 / (대) 분석보고서", "기준선·종료선 변화분석"]
          - ["9-6", "Human-UP 지역혁신 성장지원", "인문창업·인재양성·지역정주", "(대) 운영 건수·참여자·만족도", "참여형 프로그램(신청·이수증)"]

  - title: 2. 사업 목표
    headline: "기존 '!!파일 중심 실적 취합!!'에서 '**근거로 증명하는 데이터 기반 성과관리**'로 전환"
    eval: [사업이해도, 추진전략]
    conclusion: "단순 홈페이지·파일보관소를 넘어 **지역혁신 성과를 근거로 증명하는 핵심업무 플랫폼** 구축"
    blocks:
      - type: compare
        asis_title: "As-Is (분산·수작업)"
        tobe_title: "To-Be (표준·근거 연결)"
        size: 10.5
        rows:
          - {label: 사업 운영, asis: ["세부과제별 개별 양식·파일 관리", "연도마다 구조를 새로 정리"], tobe: ["사업연도-세부과제-프로그램 표준 구조", "전년도 선택 복사 + 당해연도 재확정"]}
          - {label: 성과관리, asis: ["수치만 집계, 증빙은 별도 보관", "확정 이후 변경 이력 없음"], tobe: ["수치 → 근거목록 → 증빙 원문 2클릭 이동", "제출-검토-승인-확정, 변경은 재승인"]}
          - {label: 정책·공개, asis: ["정책제안 진행 상태 추적 불가", "공개 자료 선별을 수작업으로"], tobe: ["제안-협의-반영-후속조치 타임라인", "공개승인 자료만 포털·검색 노출"]}

  - title: 3. 핵심 이슈와 대응
    num: "01"
    subtitle: 요구사항 간 상충 사항 사전 정합화
    headline: "RFP 안에서 범위 포함·제외가 엇갈리는 **5개 항목**을 식별하고, 기본 구현과 대체방식을 함께 제시"
    eval: [사업이해도, 제약사항]
    conclusion: "제안요청서 질의와 착수 시 요구사항 대비표로 확정 — **어떤 경우에도 핵심 업무는 끊기지 않음**"
    blocks:
      - type: table
        size: 10
        grow: true
        header: [구분, 상충 내용, 제안 방안]
        widths: [3.6, 11, 17]
        rows:
          - ["인증 알림 (FUR-001·006)", "임시비밀번호 카카오·문자 제공 vs 외부 알림 연계 제외", "인증용 발송 모듈만 포함, 발주기관 보유 발송 서비스 활용 (미보유 시 이메일 인증)"]
          - ["학사 연동 (FUR-007·INR-005)", "학년·성적 조회 연동 vs 학사 상세데이터 자동연계 제외", "승인 범위 최소항목만 SSO 속성으로 연계, 추가 항목은 승인 시 조회형 / 미승인 시 파일 반입"]
          - ["외부 연계 (FUR-008)", "고용24 실시간 채용정보·신용평가 연계 vs 실시간 연계 제외", "고용24 공개 OpenAPI 일 단위 수집·링크형, 신용평가 정보는 엑셀 반입 + 연계 인터페이스 설계"]
          - ["설문 (FUR-005·024)", "프로그램 설문 라이브러리 vs 자체 설문엔진 제외", "만족도용 경량 설문(템플릿·문항·통계)만 구현, 기준선·종료선은 외부 결과 업로드"]
          - ["홈페이지 (FUR-002)", "앵커사업단 홈페이지 전체 vs 3억 범위 핵심 화면 우선", "착수 시 메뉴 우선순위 확정, 1차 필수 화면 우선 구축 후 변경관리"]

