      - {title: "④ UX 기반 업무 정착", desc: ["담당자 인터뷰·현장관찰로 화면 설계", "2주 단위 단계 시연·사용성 점검", "반복입력 최소화·엑셀 일괄등록"]}
      - {title: "⑤ Responsible AI 설계", desc: ["권한·공개등급을 검색 단계에 적용", "온프레미스 처리로 외부 전송 차단", "AI 결과는 검토·확정 후 사용"]}
