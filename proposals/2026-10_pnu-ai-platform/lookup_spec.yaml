proposer: 주식회사 에이치나인
title: 제안요청서 대비 제안사항 조견표
requirements:
  ECR-001:
    name: 구축, 운영환경 및 데이터 서버 장비 도입·입주
    summary: 발주기관의 인프라·보안정책과 예상 이용규모를 반영한 데이터 서버 장비 도입
    page: 15
  ECR-002:
    name: 개발·시험·운영환경 분리
    summary: 안정적인 개발과 검수를 위한 환경 분리 및 배포체계 구성
    page: 15
  ECR-003:
    name: 공통 소프트웨어 및 저장체계
    summary: 시스템 운영에 필요한 공통 소프트웨어, 라이선스, 파일저장, 백업 구성
    page: 15
  FUR-001:
    name: 사용자 권한 관리
    summary: 역할 기반 사용자 인증과 접근권한 관리
    page: 16
  FUR-002:
    name: 앵커사업단 홈페이지 개발 및 대외 공개 성과포털
    summary: 앵커사업단 홈페이지 개발 및 시민, 유관기관 대상 핵심 성과정보 제공
    page: 16
  FUR-003:
    name: 내부 업무포털 및 통합 대시보드
    summary: 담당자의 업무현황과 성과를 한 화면에서 제공
    page: 17
  FUR-004:
    name: 사업연도별 사업체계 및 세부과제 관리
    summary: 교내 공모와 사업계획 변경에 따라 매년 달라지는 세부과제·세부사업·참여학과를 유연하게 구성하고 이력을 관리
    page: 17
  FUR-005:
    name: 프로그램 등록 및 운영상태 관리
    summary: 연도별 세부사업에 속하는 프로그램의 계획부터 종료까지 관리
    page: 18
  FUR-006:
    name: 일정, 마감, 알림 관리
    summary: 업무일정과 제출기한 통합관리
    page: 18
  FUR-007:
    name: 참여자 관리
    summary: 프로그램 참여자와 참여이력 관리
    page: 19
  FUR-008:
    name: 협력기관 및 네트워크 관리
    summary: 대학·지자체·공공기관·기업·시민단체 등 협력주체 관리
    page: 19
  FUR-009:
    name: 활동, 회의, 현장기록 관리
    summary: 프로그램 과정에서 발생하는 활동기록 통합관리
    page: 19
  FUR-010:
    name: 지역문제 및 수요관리
    summary: 사업이 해결하려는 지역문제와 현장수요 구조화
    page: 20
  FUR-011:
    name: 리빙랩 단계 및 실증관리
    summary: 문제발굴부터 실증, 환류까지 리빙랩 과정을 관리
    page: 20
  FUR-012:
    name: 성과물 통합등록
    summary: 시업에서 생성되는 문서, 데이터, 미디어 성과물 통합관리
    page: 20
  FUR-013:
    name: 메타데이터, 분류체계 관리
    summary: 성과물의 일관된 검색, 활용을 위한 표준 메타데이터 관리
    page: 20
  FUR-014:
    name: 파일 버전, 공개범위 관리
    summary: 성과물 파일의 버전과 공개, 비공개 상태 관리
    page: 21
  FUR-015:
    name: 자료 관계, 계보 관리
    summary: 데이터와 성과물의 출처 및 파생관계 추적
    page: 21
  FUR-016:
    name: 성과지표 사전 관리
    summary: 공통지표와 연도별, 세부사업별 지표의 정의와 산식 관리
    page: 21
  FUR-017:
    name: 목표, 실적 입력 및 자동집계
    summary: 성과지표 목표와 실적의 입력, 산출, 집계
    page: 22
  FUR-018:
    name: 실적 검증 및 승인
    summary: 성과실적과 증빙의 검증 및 승인관리
    page: 22
  FUR-019:
    name: 정성성과 및 변화사례 관리
    summary: 참여자 변화, 협력 수준, 지역사회 파급 등 정성성과 관리
    page: 22
  FUR-020:
    name: 성과분석, 비교 대시보드
    summary: 사업성과의 다차원 분석과 비교
    page: 22
  FUR-021:
    name: 정책제안 등록, 관리
    summary: 정책제안의 내용과 근거자료 통합관리
    page: 23
  FUR-022:
    name: 정책 검토, 협의 이력 관리
    summary: 정책제안에 대한 관계기관 검토와 협의과정 관리
    page: 23
  FUR-023:
    name: 정책반영, 후속조치 추적
    summary: 정책의 실제 반영과 사업성과 연결
    page: 23
  FUR-024:
    name: 기준선, 종료선 자료 관리
    summary: 사업 개입 전·후 비교를 위한 측정자료 관리
    page: 24
  FUR-025:
    name: 기본 변화분석
    summary: 사업 전·후 및 연도별 변화의 기초 분석
    page: 24
  FUR-026:
    name: 기본 GIS 및 지역문제 지도
    summary: 주소, 행정동 기반 사업ㆍ문제ㆍ성과 위치 시각화
    page: 24
  FUR-027:
    name: 통합검색
    summary: 사업, 사람, 기관, 성과물, 정책제안 통합검색
    page: 24
  FUR-028:
    name: AI 기반 자료검색 적용방안 분석.설계
    summary: 등록, 승인된 사업자료의 의미기반 검색과 근거자료 제시
    page: 25
  FUR-029:
    name: AI 요약·분류·태깅 적용방안 분석·설계
    summary: 반복적인 자료정리 업무를 지원하는 제한적 AI 기능
    page: 25
  FUR-030:
    name: 표준 성과보고서 생성
    summary: 등록된 확정자료를 활용한 표준 보고서 출력
    page: 25
  FUR-031:
    name: 보고서, 자료 내보내기 및 운영관리
    summary: 표준보고서 출력과 시스템 운영기능 제공
    page: 26
  PER-001:
    name: 응답시간 및 처리성능
    summary: 주요 화면, 검색, 파일 처리의 목표 성능 확보
    page: 26
  PER-002:
    name: 동시사용 및 용량 산정
    summary: 예상 이용량에 따른 안정적 처리
    page: 26
  PER-003:
    name: 대용량 파일 및 배치처리
    summary: 파일 업로드, 변환, 집계 작업의 안정성
    page: 26
  PER-004:
    name: 성능 모니터링 및 개선
    summary: 운영 중 성능저하 탐지와 개선
    page: 27
  INR-001:
    name: 사용자 화면 일반
    summary: 일관되고 직관적인 사용자 인터페이스
    page: 27
  INR-002:
    name: 웹 접근성, 호환성
    summary: 다양한 사용자의 접근성과 브라우저 호환성 확보
    page: 27
  INR-003:
    name: 입력, 검증, 오류 안내
    summary: 정확한 데이터 입력을 위한 화면 통제
    page: 27
  INR-004:
    name: 표준양식 파일 반입
    summary: 외부, 교내 자료의 직접입력 및 파일 업로드
    page: 28
  INR-005:
    name: 교내 인증, 최소정보 연계
    summary: AX 정보화혁신본부 협의에 따른 제한적 교내 연계
    page: 28
  INR-006:
    name: 연계·반입 데이터 정합성
    summary: 연계 또는 반입 데이터의 무결성 확보
    page: 28
  DAR-001:
    name: 데이터 모델 및 ERD
    summary: 연도별 공모형 사업구조와 플랫폼 핵심업무를 반영한 논리, 물리 데이터 모델
    page: 28
  DAR-002:
    name: 데이터 표준, 코드, 용어사전
    summary: 일관된 등록과 연도별 사업변경을 위한 표준체계
    page: 29
  DAR-003:
    name: 초기 데이터 구축
    summary: 기존 부산자료의 선별, 정비, 이관
    page: 29
  DAR-004:
    name: 데이터 품질관리
    summary: 정확성, 완전성, 일관성, 적시성 관리
    page: 29
  DAR-005:
    name: 개인정보, 비식별 데이터 관리
    summary: 개인정보 최소수집, 분리, 파기 및 공개 안정성
    page: 30
  DAR-006:
    name: AI 학습, 검색 데이터 관리
    summary: AI 활용자료의 범위, 권리, 품질, 이력 관리
    page: 30
  DAR-007:
    name: 백업, 복구, 보존, 반출
    summary: 데이터의 안전한 보존과 계약 종료 시 이관
    page: 30
  TER-001:
    name: 종합 테스트 계획
    summary: 요구사항 기반의 단계별 시험계획 수립
    page: 30
  TER-002:
    name: 단위, 통합 테스트
    summary: 기능과 연도별 공모형 업무흐름의 정확성 검증
    page: 31
  TER-003:
    name: 데이터, 인터페이스 테스트
    summary: 이관, 업로드, 교내 연계의 정합성 검증
    page: 31
  TER-004:
    name: 보안, 성능, 복구 테스트
    summary: 비기능 요건 검증
    page: 31
  TER-005:
    name: 사용자 인수, 시범운영
    summary: 실사용자 검수와 안정화
    page: 31
  SER-001:
    name: 보안관리 일반
    summary: 사업 전 과정의 보안관리체계 수립
    page: 32
  SER-002:
    name: 참여인력, 자료 보안
    summary: 인력과 사업자료의 유출 방지
    page: 32
  SER-003:
    name: 인증, 권한, 세션 보안
    summary: 계정도용과 무단접근 방지
    page: 32
  SER-004:
    name: 개인정보 보호
    summary: 개인정보 처리의 안정성 확보
    page: 32
  SER-005:
    name: 응용프로그램 개발 보안
    summary: 시큐어코딩과 취약점 예방
    page: 33
  SER-006:
    name: 인프라, 네트워크, 파일 보안
    summary: 운영기반과 업로드 자료 보호
    page: 33
  SER-007:
    name: 로그, 감사, 보안사고 대응
    summary: 보안행위 추적과 사고대응
    page: 33
  SER-008:
    name: 보안점검 및 사업종료 조치
    summary: 취약점 개선과 자료 완전 반납 및 삭제
    page: 33
  QUR-001:
    name: 가용성, 신뢰성
    summary: 업무시간의 안정적 서비스와 오류복구
    page: 34
  QUR-002:
    name: 사용성, 일관성
    summary: 비전문가도 쉽게 사용하는 업무시스템
    page: 34
  QUR-003:
    name: 확장성, 유지보수성
    summary: 매년 달라지는 사업체계와 후속 고도화를 수용하는 구조
    page: 34
  QUR-004:
    name: 품질, 형상, 변경 관리
    summary: 산출물과 소스의 품질 및 변경 통제
    page: 34
  COR-001:
    name: 법령, 표준, 지침 준수
    summary: 정보화사업 관련 현행 기준 준수
    page: 35
  COR-002:
    name: 기술 종속, 라이선스, 데이터 권리
    summary: 발주기관의 지속 운영과 권리 보장
    page: 35
  PMR-001:
    name: 사업수행, 일정, 보고 관리
    summary: 방법론에 따른 일정, 진척, 의사결정 관리
    page: 35
  PMR-002:
    name: 요구사항, 변경, 위험 관리
    summary: 범위, 품질, 일정의 통제
    page: 36
  PMR-003:
    name: 인력, 품질, 협업 관리
    summary: 전문인력 투입과 업무연속성 확보
    page: 36
  PMR-004:
    name: 검수, 산출물, 인수 관리
    summary: 완료기준과 납품결과 관리
    page: 36
  PSR-001:
    name: 교육, 기술이전
    summary: 관리자, 담장자의 자립적 운영 지원
    page: 36
  PSR-002:
    name: 하자보수, 운영지원
    summary: 검사완료 후 안정적 사용 지원
    page: 37
