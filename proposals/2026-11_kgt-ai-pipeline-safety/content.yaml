      size: 9
      header: [항목, 방안]
      widths: [3.4, 12.6]
      rows:
      - [수신 방식, "파일 · API 중 발주기관 · 한국가스공사 협의 방식, 수신 이력 · 실패 재처리"]
      - [매칭 기준, "위치 반경 또는 배관 구간 식별정보 — PoC 기간 중 기준 확정 · 검증"]
      - [알림 내용, "탐지 위치 · 시각 · 마스킹 이미지 · 위험수준 · 관련 분석 결과 · 주의사항 · 출처 · 기준일자"]
      - [알림 채널, "카카오 알림톡 우선, 실패 시 문자 대체 발송 (발송 결과 기록)"]
      - [성능, "최종 이벤트 생성 후 3초 이내 알림 발송 요청 (PER-003)"]
