    - type: process
      rows:
      - {label: 수신, items: ["한국가스공사 분석자료 수신", "출처 · 기준일자 저장"], result: "분석자료 DB"}
      - {label: 매칭, items: ["좌표 또는 배관 구간 ID 기준", "탐지 이벤트와 연결"], result: "매칭 결과"}
      - {label: 알림 구성, items: ["위치 · 시각 · 현장 이미지", "분석 결과 · 주의사항"], result: "알림 메시지"}
      - {label: 발송, items: ["카카오 알림톡 · 문자", "자료 없어도 위험 알림 정상 발송"], result: "발송 이력"}
