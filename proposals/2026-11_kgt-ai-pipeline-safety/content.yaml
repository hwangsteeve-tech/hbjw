      - [노드 · 링크, "도로 구간 분석 시 표준 노드 · 링크 ID와 좌표기준 적용, 차량 · 이벤트 매핑 규칙 정의"]
      - [메타 · 라벨, "탐지 메타데이터 · 라벨 스키마 버전관리 (항목 추가 · 변경 대응)"]
    - type: table
