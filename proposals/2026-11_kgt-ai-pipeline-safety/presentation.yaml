chapters:
# =====================================================================
- num: Ⅰ
  title: 사업 이해 및 추진 전략
  toc: [사업 이해, 목표시스템, 추진전략 · 방법론]
  slides:
  - kind: visual
    title: 달리는 순회차량이 곧 **가스배관 안전 감시망**
    subtitle: "순회점검 차량 7대의 전방영상을 AI가 실시간으로 분석해 굴착 · 중장비 · 지반이상 · 화재 징후를 찾고, 배관 위치와 함께 즉시 전파 — 실증 결과를 숫자로 남겨 전사 확대의 근거로"
    eval: [사업 이해도]
    facts:
      - {label: 발주기관, value: "한국가스기술공사\nAX혁신실"}
      - {label: 사업기간, value: "계약체결일 ~\n2027.8.31"}
      - {label: 사업금액, value: "2억 2,704만 원\n(VAT 포함)"}
      - {label: 실증 규모, value: "차량 7대 ·\n실증구간 7개"}

  - title: 1. 사업 이해 — PoC는 숫자로 검증하는 사업
    headline: "기능을 만드는 데서 끝나지 않고 **'실제 순회 환경에서 AI가 위해요인을 얼마나 정확히, 어디서 찾는가'**를 !!검수기준이 되는 목표값!!으로 검증"
    eval: [사업 이해도]
    conclusion: "착수 첫 달에 **탐지대상 정의 · 평가데이터 · 측정방법**부터 발주기관과 합의 — 확정 목표값 = 검수기준"
    columns:
      - w: 1.5
        blocks:
          - type: table
            size: 10
            header: [사업 특성, 대응 방향]
            widths: [2.8, 7.4]
            rows:
              - [이동체 영상, "WDR · 저조도 카메라, 조건별 평가데이터"]
              - [위치가 핵심, "GNSS PPS 시각동기 · 위치오차 목표 · 현장시험"]
              - [통신 음영, "단말 저장 · 순서 유지 자동 재전송"]
              - [개인정보, "전송 전 마스킹 · 원본 접근 제한"]
              - [내부망 운영, "온프레미스 가상서버 + GPU 워크스테이션"]
              - [하도급 불허, "당사 직접 수행 · 장비 물품 구매 · 기술지원 확약"]
      - w: 1
        blocks:
          - type: kpi
            h: 2.2
            items:
              - {value: "45개", label: "요구사항 전부 수용"}
              - {value: "4대", label: "수집 · 탐지 · 관제 · API"}
          - type: cards
            cols: 1
            size: 10.5
            items:
              - {title: 사업 범위, desc: ["① 차량영상 수집체계 (단말 7세트)", "② AI 위해요인 자동탐지", "③ GIS 통합관제 · 알림 · 연계", "④ 위험정보 외부 제공 API"]}

  - title: 2. 목표시스템 — 현장에서 관제까지 5계층
    headline: "**현장 단말(1차 탐지 · 마스킹) → 암호화 LTE → 내부망 수집 · 2차 분석 → 통합관제 · 알림 → 외부 API**를 !!외부 클라우드 없이 온프레미스!!로"
    eval: [사업 이해도, 적용기술, 기능 요구사항]
    conclusion: "원본 영상은 단말에, **이벤트 · 대표이미지 · 위치만 우선 전송** — 통신비와 지연을 함께 줄임"
    blocks:
      - type: layers
        side_w: 5
        layers:
          - {name: 현장 단말 7세트, items: ["카메라 FHD 30fps", "AI 단말 1차 탐지 · 마스킹", "GNSS · LTE · 저장 · 전원"], side: "ECR-002 · 003"}
          - {name: 전송 구간, items: ["LTE (5G 선택)", "IPSec VPN / TLS · 상호인증", "음영 저장 · 재전송"], side: "SIR-002 · SER-001"}
          - {name: 수집 · 분석, items: ["수집 게이트웨이 MQTT · REST", "GPU 2차 분석 · 위험판정", "데이터 검증 · 저장"], side: "SFR-002 · PER-005"}
          - {name: 통합관제, items: ["대시보드 · 탐지현황", "GIS 공간관제", "처리 · 조치 · 통계"], side: "SFR-003~007"}
          - {name: 알림 · 연계 · 제공, items: ["카카오톡 · 문자 알림", "기상 · 산불 · 재난 · 한국가스공사", "외부 제공 API · 공공데이터"], side: "SFR-005 · 009 · SIR-004"}

  - title: 3. 4대 추진전략
    headline: "**현장 강건성 · 위치 정확성 · 실증 투명성 · 확산 준비** — 겨울에 준비하고 !!우천기(6~7월)에 1 · 2차 실증!!"
    eval: [추진전략]
    columns:
      - w: 1.4
        blocks:
          - type: cards
            cols: 2
            size: 10.5
            items:
              - {title: "① 현장 강건성", desc: ["주 · 야간 · 우천 · 역광 · 가림 데이터", "조건별 임계값", "음영 구간 재전송 누락 0"]}
              - {title: "② 위치 정확성", desc: ["GNSS PPS 시각동기", "카메라 설치정보 기반 대상 위치", "배관망 GIS 인접 판정"]}
              - {title: "③ 실증 투명성", desc: ["목표값 · 평가방법 사전 합의", "정탐/오탐 판정 화면", "평가 스크립트 · 버전 보존"]}
              - {title: "④ 확산 준비", desc: ["표준 API · 데이터 표준", "차량 5~30대 자원 산정", "확산 패키지"]}
      - w: 1
        blocks:
          - type: kpi
            h: 2.2
            items:
              - {value: "1개월", label: "목표값 합의"}
              - {value: "2월", label: "7대 설치 완료"}
          - type: kpi
            h: 2.2
            items:
              - {value: "2회", label: "현장실증"}
              - {value: "8.31", label: "검수 완료"}

  - title: 4. 사업추진 방법론 — 5단계 PoC
    headline: "단계마다 **수행방법 · 검증방법 · 산출물**을 정하고, 목표 미달 유형은 !!재학습 후 같은 기준으로 재시험!!"
    eval: [사업추진 방법론]
    conclusion: "평가데이터는 **학습에 쓰지 않은 별도 주행일**로 구성 — 유사 프레임으로 성능이 부풀려지지 않게"
    blocks:
      - type: flow
        steps:
          - {title: 데이터 확보, items: ["실증구간 주행 영상", "공개 · 발주기관 자료"]}
          - {title: 학습 · 분석, items: ["라벨링 · 교차검수", "1차 · 2차 모델"]}
          - {title: 현장실증, items: ["7대 실제 순회", "단말 · 서버 · 관제"]}
          - {title: 성능검증, items: ["정밀도 · 재현율", "위치오차 · 시간"]}
          - {title: 개선, items: ["오탐 · 미탐 분석", "재학습 · 재시험"]}
      - type: table
        size: 10
        header: [단계, 검증방법, 산출물]
        widths: [2.6, 8.4, 5]
        rows:
          - [데이터 확보, "대상별 수량 · 조건 분포, 라벨 표본 교차검수", "AI 학습 데이터 구축 가이드"]
          - [학습 · 분석, "검증데이터 클래스별 정밀도 · 재현율", "AI 모델 품질 이력 보고서"]
          - [현장실증, "실주행 정탐/오탐 판정 · 통신 · 알림 확인", "현장 실증시험 결과서"]
          - [성능검증 · 개선, "확정 목표값 대비 측정 → 재학습 · 재시험", "모델 정확도 평가결과서"]

# =====================================================================
- num: Ⅱ
  title: 제안시스템
  toc: [적용기술, 장비 · 기능, 성능 · 제약 · 보안]
  slides:
  - title: 1. 적용기술 ① 2단 AI 모델 — 놓치지 않고, 거르고
    headline: "단말은 **재현율 우선 경량 모델**, 서버는 **정밀도 우선 재판정 모델** — 모두 !!Apache-2.0 라이선스!!로 사업 후에도 자유롭게 재학습 · 확대"
    eval: [적용기술]
    columns:
      - w: 1.3
        blocks:
          - type: table
            size: 10
            header: [구분, 1차 (단말), 2차 (서버)]
            widths: [2.4, 4.6, 4.6]
            rows:
              - [모델, "YOLOX 계열 경량", "RT-DETR 계열 정밀"]
              - [추론, "TensorRT FP16/INT8", "GPU TensorRT FP16"]
              - [성능, "유효 20fps (요구 15fps)", "이벤트당 1초 이내"]
              - [임계값, "낮게 — 놓치지 않기", "높게 — 오탐 거르기"]
              - [학습, "사전학습 → 실증 데이터 미세조정", "클래스별 가중 학습"]
      - w: 1
        blocks:
          - type: cards
            cols: 1
            size: 10.5
            items:
              - {title: 탐지대상 4종, desc: ["굴착장비 · 굴착현장", "시설물 훼손 · 전도 · 가림 · 누락 의심", "지반 이상 · 재난 징후", "화재 · 연기"]}
          - type: callout
            text: "모델 구조 · 버전 · 입출력 · 학습방법 · 임계값 · **제한사항까지 모델 명세서로 공개**"

  - title: 2. 적용기술 ② 위치 추정 · ③ 개인영상정보 마스킹
    headline: "차량 위치와 **탐지대상 추정 위치를 구분**해 배관 GIS와 비교하고, 얼굴 · 번호판은 !!전송 전에 블러 + 서버 재검사!!"
    eval: [적용기술, 보안 요구사항]
    columns:
      - w: 1
        arrow_after: true
        blocks:
          - type: panel
            title: 위치 추정
            blocks:
              - type: flow
                steps:
                  - {title: 시각동기, items: ["GNSS PPS"]}
                  - {title: 차량 위치, items: ["10Hz 보간"]}
                  - {title: 대상 위치, items: ["화각 · 높이"]}
                  - {title: 배관 판정, items: ["최단거리"]}
              - type: table
                size: 10
                header: [지표, 제안 목표]
                widths: [5, 5]
                rows:
                  - [차량 위치, "2.5m 이내 (CEP50)"]
                  - [대상 위치오차, "측정건 90% 10m 이내"]
                  - [동기 오차, "【50ms】 이내"]
      - w: 1
        blocks:
          - type: panel
            title: 개인영상정보 마스킹
            blocks:
              - type: flow
                steps:
                  - {title: 탐지, items: ["얼굴 · 번호판"]}
                  - {title: 블러, items: ["단말 전송 전"]}
                  - {title: 재검사, items: ["서버 저장 전"]}
                  - {title: 제공 판정, items: ["의심 → 제외"]}
              - type: kpi
                h: 2
                items:
                  - {value: "95%+", label: "마스킹 재현율 목표"}
                  - {value: "0건", label: "미처리 외부 제공"}

  - title: 3. 현장 단말 7세트 · 중앙 시스템
    headline: "**카메라 · AI 단말 · GNSS · LTE · SSD · 전원 · 거치대 일체형 7세트**와 GPU 워크스테이션을 당사가 제공 — !!상용 SW 라이선스 0종!!"
    eval: [기능 요구사항, 적용기술]
    conclusion: "GPU는 PoC 기간 당사 제공, 검수 후 **이관 또는 회수** — 회수해도 단말 1차 탐지 · 관제 · 알림은 계속 동작"
    columns:
      - w: 1.3
        blocks:
          - type: table
            size: 9.5
            header: [구성품, 제안 사양]
            widths: [2.6, 8]
            rows:
              - [전방카메라, "FHD 30fps · WDR 120dB급 · 저조도 · 방진"]
              - [AI 단말, "임베디드 GPU 【40 TOPS 이상】 · 팬리스"]
              - [GNSS, "다중위성 · 10Hz · PPS"]
              - [통신 · 저장, "LTE Cat.4+ (5G 선택) · SSD 1TB 암호화 (약 500시간)"]
              - [전원 · 거치대, "12/24V · ACC 연동 · 저전압 차단 · 무손상 탈부착"]
      - w: 1
        blocks:
          - type: table
            size: 9.5
            header: [중앙, 사양 · 제공]
            widths: [3, 5]
