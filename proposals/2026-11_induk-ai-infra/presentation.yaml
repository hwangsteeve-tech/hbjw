  - title: "4. [지식DB] RAG 검색 품질 · Knowledge Catalog"
    headline: "**키워드 + 벡터 + Reranking** 검색으로 근거를 찾고, 모든 지식을 **출처·버전·효력일·권한**과 함께 관리해 !!폐기 규정으로 답하지 않음!!"
