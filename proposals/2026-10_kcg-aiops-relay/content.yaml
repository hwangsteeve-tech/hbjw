    req: FUN-005, QUR-001
    summary: "(수동 개입 없는 절체) 2계통 Active-Standby와 가상 IP로 **한 계통 장애 시 10초 이내 자동 절체**하고, 절체 구간 데이터는 재전송·중복 제거로 유실 없이 처리함"
