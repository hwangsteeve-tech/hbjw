      layers:
      - {name: 송신, items: ["타 관제시스템 A", "타 관제시스템 B"], side: "가상 IP로 전송", color: "1C3F7A"}
      - {name: 접속, items: ["가상 IP (VRRP)"], side: "활성 계통으로 자동 연결", color: "1F4E9A"}
      - {name: 중계 계통, items: ["중계 #1 (Active)", "중계 #2 (Standby)"], side: "상태 감시 1초 주기", color: "2E6FC4"}
      - {name: 전달, items: ["AIOps 분석 환경"], side: "멱등 키 중복 제거", color: "0E8FD6"}
    - type: table
      caption: 절체 시나리오와 목표
      header: [구간, 처리 방안, 목표]
      widths: [3.6, 8.4, 4]
      rows:
      - [장애 감지, "헬스체크 1초 주기, 3회 연속 실패 시 장애 판정", "3초 이내"]
