  - header: 1. 사업 이해도
    h2: 1.4 제안의 특징
    h3: 1.4.1 제안의 특징 · 장점 · 전제조건
    summary: "(제품 비특정 · 검증 가능) 솔루션 제품이 정해지지 않은 상황에서도 **표준 인터페이스 기반 연동**과 **검증 가능한 정량 목표**로 일정·품질 위험을 줄임"
    blocks:
    - type: boxes
      cols: 2
      items:
      - {title: "① 제품 비특정 연동 설계", desc: ["REST·메시지·Syslog·SNMP 등 표준 방식 어댑터", "솔루션 확정 후 어댑터만 선택 적용"]}
      - {title: "② 무유실 이중화 중계", desc: ["디스크 영속 버퍼 + 재전송 + 중복 제거", "한 계통 장애 시 자동 절체"]}
      - {title: "③ 무중단 단계적 구축", desc: ["시험 대상 → 일반 → 핵심 시스템 순 적용", "수집 부하 CPU 5% 이내 사전 측정"]}
      - {title: "④ 설치 지연에도 진행", desc: ["설치 전 연동 설계·중계 프로토타입 선행", "통보일 기준 70일 일정 재수립"]}
      - {title: "⑤ 검증 가능한 정량 목표", desc: ["화면 응답·알람 시간·동시 사용자 정량 제시", "72시간 연속 정상 동작 확인"]}
      - {title: "⑥ 자체 운영 이관", desc: ["재학습·임계치·화면 편집 절차 매뉴얼화", "30일 안정화 무상 지원"]}
