      - [절체 구간 데이터, "송신측 재전송 + 계통별 영속 버퍼, 멱등 키로 중복 제거", "유실 0건"]
      - [복구, "장애 계통 복구 후 대기 계통으로 자동 편입, 미전달 버퍼 재처리", "수동 개입 없음"]
