      - [반출 금지, "누출금지 대상 정보·구성도·IP 현황·소스코드는 원격지로 반출하지 않음"]
      - [원격 접속, "원격 유지관리 접속은 승인된 경우에만, 접속 이력 기록"]
    - {type: subtitle, text: 원격개발 위험요인과 대응}
    - type: table
      header: [위험요인, 대응 방안]
      widths: [5, 11]
      rows:
      - [산출물·소스 유출, "원격지에는 비공개 자료 미보관, 개발은 발주기관 개발서버에서 수행"]
      - [비인가 접속, "승인 단말·계정만 사용, 다중 인증, 접속 로그 일일 점검"]
      - [매체 반출입, "USB 포트락, 승인 매체만 관리대장 기록 후 사용"]
    - type: note
      text: "※ RFP 보안위규 처리기준의 '원격작업 사용' 조항과의 관계는 질의를 통해 확인하고, 확인 전까지 현장 작업으로 수행"

