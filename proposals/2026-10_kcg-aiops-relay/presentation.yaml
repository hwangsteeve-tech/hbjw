# =====================================================================
- num: Ⅰ
  title: 사업의 이해
  toc: [사업 배경 및 업무 특성, 사업 범위와 책임 경계, 목표시스템]
  slides:
  - kind: visual
    title: 긴급신고 서비스 무중단을 지키는 예측형 통합관제
    subtitle: "관제 대상 76식 + 타 관제시스템 2종 → 수집·중계 → AI 분석 → 통합 관제·알람"
    eval: [사업이해]
    facts:
      - {label: 발주기관, value: "해양경찰청\n정보통신과"}
      - {label: 사업기간, value: "70일\n(솔루션 설치 완료 통보일 기준)"}
      - {label: 사업금액, value: "2억 원\n(VAT 포함)"}
      - {label: 관제 대상, value: "핵심 정보시스템 5종\n서버 50 · DB 9 · WAS/WEB 17"}

  - title: 1. 사업 배경 및 업무 특성
    headline: "해양 긴급신고·구조 업무는 **시스템 중단이 곧 인명 피해**로 이어짐 — 장애를 !!먼저 알리고 빨리 찾는!! 관제체계가 필요함"
    eval: [사업이해]
    columns:
      - w: 1
        arrow_after: true
        blocks:
          - type: panel
            title: 현행 관제의 한계
            blocks:
              - type: bullets
                size: 10.5
                items:
                  - {text: "(개별 관제) 개별 도구·수동 점검, 통합 관제체계 미보유"}
                  - {text: "(연관 분석 불가) 서버·DB·WAS 데이터가 따로 관리되어 원인 구간 식별 지연"}
                  - {text: "(사후 인지) 민원 발생 후 장애 인지 → 긴급신고 접수 지연 위험"}
                  - {text: "(데이터 단절) 성능 데이터 보관·타 관제시스템 연계 부재"}
      - w: 1.7
        blocks:
          - type: panel
            title: 관제 대상 핵심 정보시스템
            blocks:
              - type: table
                size: 10
                header: [정보시스템, 업무, 서버, DB, "WAS/WEB"]
                widths: [3.6, 3.6, 1.2, 2, 1.6]
                rows:
                  - [통합신고처리, "해양 긴급신고 접수", "24", "2 (Oracle)", "8"]
                  - [통합상황관리, "상황 전파·구조 지휘", "13", "2 (Oracle)", "2"]
                  - [원거리추적감시, "선박 추적 감시", "4", "3 (Oracle)", "3"]
                  - [상황공유, "상황 정보 공유", "6", "1 (PostgreSQL)", "4"]
                  - [항공기위치정보, "항공기 위치 정보", "3", "1 (Oracle)", "0"]
              - type: flow
                size: 10
                steps:
                  - {title: 통합 가시화, desc: "단일 대시보드 (FUN-001)"}
                  - {title: 사전 예방, desc: "AI 이상탐지·예측 (FUN-003)"}
                  - {title: 원인 단축, desc: "RCA·LLM 분석 (FUN-004)"}
                  - {title: 통합 분석, desc: "데이터 중계 (FUN-005)"}

  - title: 2. 사업 범위와 책임 경계
    headline: "솔루션·서버는 분리발주, 본 사업은 **연동·구성·데이터 중계 개발·AI 분석 환경** — 사유별 책임 경계를 착수 시 문서로 확정"
    req: ECR-001, COR-003
    eval: [사업이해, 제약사항]
    conclusion: "별도 개발은 **데이터 중계 기능(FUN-005)**으로 한정, 관제 화면·알람·AI 분석은 솔루션 기능으로 구성"
    columns:
      - w: 1
        blocks:
          - type: cards
            cols: 1
            size: 10.5
            items:
              - {title: "통합구축 (본 사업)", desc: ["AI 분석 엔진 구축", "데이터 중계 기능 개발 (이중화)", "통합 관제 화면·연동 인터페이스"]}
              - {title: "분리발주 (나라장터 구매)", desc: ["통합 모니터링 솔루션 · AIOps 솔루션", "구축용 서버 자원", "설치·라이선스는 공급자 책임"]}
      - w: 1.6
        blocks:
          - type: table
            size: 10
            grow: true
            header: [발생 사유, 본 사업자 대응]
            widths: [1.2, 2.6]
            rows:
              - [솔루션 납품·설치 지연, "설치 전 과업(요구사항 상세화·연동 설계·중계 시험본) 선행, 통보일 기준 기간 연장"]
              - ["규격 변경 (버전·인터페이스)", "영향 범위 보고, 연동 설계 변경, 과업변경 절차"]
              - [솔루션 기능·성능 미충족, "원인 분석 협조, 조건부 적합(보류) 기록 후 재시험"]
              - [본 사업 구축물 결함, "보완 후 재시험, 하자보수 이행"]
              - [검사 합격 후 솔루션 장애, "연동 재개 확인, 본 사업 구축물 영향 점검"]

  - title: 3. 목표시스템
    headline: "관제 대상 성능 데이터와 타 관제시스템 데이터를 **수집·중계 → AI 분석 → 관제·전파** 4계층으로 연결"
    req: ECR-001, ECR-002, ECR-003, FUN-005
    eval: [사업이해, 시스템구성·기능]
    blocks:
      - type: layers
        side_w: 6.5
        layers:
          - {name: 관제 대상, items: ["통합신고처리 34", "통합상황관리 17", "원거리추적감시 10", "상황공유 11", "항공기위치정보 4"], side: "서버 50 · DB 9 · WAS/WEB 17"}
          - {name: "수집·중계", items: ["통합 모니터링 솔루션 수집 (분리발주)", "**데이터 중계 기능** (본 사업 개발 · 이중화)"], side: "타 관제시스템 2종 수신"}
          - {name: "AI 분석", items: ["AIOps 솔루션 (분리발주)", "**AI 분석 엔진** 구성", "내부망 LLM 분석"], side: "이상탐지 · 부하예측 · RCA"}
          - {name: "관제·전파", items: [통합 관제 화면, 이벤트·알람, 성능 리포트], side: "기관 SMS · 메일 인프라 연계"}
          - {name: 공통, items: ["접근통제·감사 로그", "TLS 1.2+ 암호화", "데이터 보관·정합성"], side: "외부 인터넷 연계 없는 내부망"}

