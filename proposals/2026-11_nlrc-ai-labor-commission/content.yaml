    blocks:
    - type: table
      size: 9.5
      header: [기능, 구현 방안]
      widths: [3.6, 12.4]
      rows:
      - [자동 요약, "판정서별 200자 이내 요약 (사건 개요 → 주요 쟁점 → 판정 결과), 담당자 검토 · 수정 · 승인 워크플로"]
      - [쟁점 분류, "노동위원회 분류체계로 쟁점 자동 추출 · 분류, 관리자가 분류체계 추가 · 수정"]
      - [법령 연동, "인용 법령명 · 조항 자동 인식, 법령 원문 · 링크 제공"]
      - [유사 추천, "유사도 기반 관련 판정서 최대 5건, 유사도 점수 · 핵심 공통 쟁점 표시"]
      - [검색 · 조회, "자연어 질의 검색, 법령 조항 · 쟁점 선택 시 인용 판정서 목록"]
      - [자동 갱신, "신규 판정서 등록 → 비식별화 → 요약 · 분류 → 위키 반영 파이프라인"]
