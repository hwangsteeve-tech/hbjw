      - [노동조합 정보, "노동조합 정보 조회", "사건 신청 · 접수 · 처리 단계 활용"]
    - type: boxes
      cols: 3
      items:
      - {title: 연계 현황 관리, desc: "성공 · 실패, 송수신 건수, 처리결과, 오류사유, 처리일시 조회와 실패 건 재발송"}
      - {title: 보유 솔루션 활용, desc: "발주기관 연계 솔루션을 최대한 활용, 규격 협의 · 데이터 검증 · 기술지원 수행 (비용은 계약금액 포함)"}
      - {title: 지연 시 즉시 보고, desc: "인터페이스 변경 · 기술지원 지연 시 즉시 보고하고 연계 범위 · 방식을 협의 조정"}

  - header: 2. 기능 요구사항
