    summary: "(두 트랙을 한 일정에) AI 트랙과 업무시스템 트랙을 병행하되, **연계 지점(AI 호출 API · 사건정보 · 인증)은 설계 단계에서 먼저 고정**해 후반 통합 위험을 줄임"
    blocks:
    - type: process
      cols: 3
      rows:
      - {label: "분석 (M1~M2)", items: ["1차 결과 · 헬프데스크 · 의견 분석", "응답시간 · 품질 기준선 측정", "통계 150종 전수 진단"], result: "요구사항 상세화 · 기준선 보고"}
      - {label: "설계 (M2~M3)", items: ["지식그래프 모델 · 데이터 구조", "AI 호출 API · 연계 규격 확정", "화면 · 템플릿 설계"], result: "설계서 · 연계 규격서 (설계감리)"}
      - {label: "구현 (M3~M7)", items: ["전처리 · LLM 고도화 · 초안 확대", "노사마루 기능 · 통계 · 연계", "보안 · 인증 기능"], result: "단계별 기능 시연 · 단위테스트"}
      - {label: "검증 (M7~M9)", items: ["생성형 AI 통합테스트 10회 이상", "업무시스템 통합테스트 3회 이상", "성능 · 취약점 진단"], result: "통합 · 성능 · 보안 결과보고"}
      - {label: "오픈 · 안정화 (M9~M10)", items: ["시범운영 · 사용자 교육", "인수테스트 · 안정화", "완료보고 · 종료감리"], result: "완료보고서 · 산출물"}
    - type: point
      color: blue
      title: 외부 상용 AI 병행 활용 방안 (CSR-001)
      text: "업무망 AI 노동위원회를 계속 쓰면서, 보안 등급 O(공개) 자료에 한해 외부 상용 AI를 쓸 수 있도록 요청 단계에서 등급을 판별하고 C·S 등급 자료는 외부 전송을 차단하는 운영방안을 설계 단계에서 제시합니다."
    - type: kpi
      items:
      - {value: "M1", label: "응답시간 · 품질\n기준선 확정"}
      - {value: "M3", label: "AI 호출 API ·\n연계 규격 고정"}
      - {value: "M9", label: "시범운영 ·\n개통"}

  - header: 2. 추진전략
    h2: 2.3 위험요소와 대응 방안
    h3: 2.3.1 사업 위험요소별 대응 방안
    summary: "(예상 위험을 착수 전에 정의) **H/W 증설 없는 성능 개선, 외부 기관 연계 지연, 생성 품질 기준 합의**를 3대 위험으로 보고 착수 단계부터 대응함"
    blocks:
    - type: table
      size: 9.5
      header: [위험요소, 영향, 대응 방안, 시점]
      widths: [3.6, 2.6, 7.6, 2.2]
      rows:
      - ["H/W 증설 없이 30% 단축", 높음, "서빙 최적화 · 캐싱 · 비동기 전처리 · VLM 배치 분리로 GPU 경합 제거, 월 단위 기준선 대비 측정", "M1 ~ M8"]
      - ["노사누리 · 온라인사건신청 연계 지연", 높음, "규격 협의 M2 착수, 모의 연계(Mock)로 선개발, 지연 시 즉시 보고 후 범위·방식 조정 (SFR-007)", "M2 ~ M7"]
      - ["생성 품질 목표 미합의", 중간, "SFR별 평가항목 · 방법 · 목표를 설계 단계에서 발주기관과 확정, 평가셋 사전 구성", "M2 ~ M3"]
      - ["통계 범위 확대", 중간, "150종 이내 전수 진단 후 「통계 구축 대상 목록」 승인으로 범위 고정", "M1 ~ M2"]
      - ["개인정보 · 사건자료 유출", 높음, "비식별화 데이터만 학습·색인, 외부 반출 금지, 작업장 보안 점검", "전 기간"]
      - ["법령 · 행정사항 변경", 낮음, "변경 시 최소 기능 반영 (SFR-001), 과업심의위원회 절차로 범위 협의", "전 기간"]
    - {type: subtitle, text: 위험 관리 절차}
    - type: flow
      steps:
      - {title: 식별, desc: "주간회의 · 이슈대장"}
      - {title: 평가, desc: "영향 · 발생가능성"}
      - {title: 대응, desc: "담당 · 기한 지정"}
      - {title: 보고, desc: "발견 즉시 구축전담반"}
      - {title: 재발 방지, desc: "조치 이력 관리"}

  - header: 3. 적용기술
    h2: 3.1 AI 적용기술
    h3: 3.1.1 문서 전처리 개선 · Graph DB · 문서초안 고도화 기술
    req: SFR-017, SFR-020, SFR-021
    summary: "(정확도는 입력과 지식에서 결정) **VLM 구조 분석으로 입력 품질을, 지식그래프로 쟁점 근거를, 분할 생성으로 대용량 처리**를 보장하는 3단 구조로 초안 품질을 높임"
    blocks:
    - type: table
      size: 9.5
      header: [기술 영역, 적용 기술, 해결하는 문제, 요구사항]
      widths: [3, 5.6, 5, 2.4]
      rows:
      - [문서 전처리, "OCR · 파서 결과와 VLM 구조 분석 결과 비교 · 통합, 표 셀 병합 · 페이지 번호 보존", "사진 · 표 · 스캔본 인식 오류", SFR-020]
      - [지식그래프, "사건유형 · 쟁점 · 사실관계 · 판단기준 · 법령 · 판례 개체와 관계를 Graph DB로 구성", "무관 쟁점 · 쟁점 누락", SFR-017]
      - [검색 증강(RAG), "키워드 + 벡터 하이브리드 검색, 재순위화, 그래프 탐색 결과 결합", "관련성 낮은 참조문서", SFR-021]
      - [분할 생성, "문서를 구간 단위로 나눠 사실관계 추출 후 통합, 구간별 처리 이력 검증", "토큰 한계로 인한 구간 누락", PER-003]
      - [서빙 최적화, "연속 배치 · 접두 캐시 · 스트리밍 응답, 전처리 결과 캐시", "응답 지연", PER-002]
      - [화자분리, "STT 화자분리 고도화, 불명확 구간 표시, 타임스탬프 재생", "심문 진술 당사자 구분", SFR-027]
    - type: flow
      steps:
      - {title: "① 전처리", desc: "OCR + VLM 통합 · 비식별화"}
      - {title: "② 쟁점 분석", desc: "사건유형별 핵심 쟁점"}
      - {title: "③ 지식 탐색", desc: "그래프 · 위키 · 판례"}
      - {title: "④ 분할 생성", desc: "구간 추출 → 통합"}
      - {title: "⑤ 검증", desc: "필수항목 · 근거 대조"}
    - type: point
      color: green
      title: 실현 가능성
      text: "모든 구성요소는 1차 사업의 GPU·서버 위에서 동작하도록 설계하고, VLM처럼 연산이 큰 처리는 문서 업로드 시점의 배치 작업으로 분리해 실시간 질의 응답과 GPU를 나눠 쓰지 않게 합니다."

  - header: 3. 적용기술
    h2: 3.2 업무시스템 · 연계 적용기술
    h3: 3.2.1 노사마루 통계 · 기능 개선 · 시스템 연계 기술
    req: SFR-007, SFR-009, SFR-010, SIR-003
    summary: "(현행 기술 위에서 확장) 노사마루의 **넥사크로 · Java · 전자정부프레임워크 · 보유 연계 솔루션**을 그대로 활용해 유지관리 부담 없이 기능을 확장함"
    blocks:
    - type: table
      size: 9.5
      header: [대상, 적용 기술, 기대 효과]
      widths: [3.4, 7.4, 5.2]
      rows:
      - [통계, "통계 DB 표준화(표준단어 · 용어 · 도메인 · 코드), 리포팅 툴 · 시각화 솔루션 활용, 로데이터 조회 화면", "수치 불일치 해소, 기관평가 통계 자동 집계"]
      - [전자결재, "온-나라 공통 서식(템플릿) + 누름틀 데이터 바인딩, Java 하드코딩 제거", "서식 변경 시 소스 수정 불필요"]
      - [유관기관 연계, "노사누리 EAI 연계(자격 · 사건 · 노동조합 정보), 연계 이력 · 재발송 관리 화면", "조사관 수작업 · 확인 누락 해소"]
      - [화면 공통, "넥사크로 공통 알림 컴포넌트, 미입력 항목 하이라이트 · 사이드 패널", "입력 누락 감소, 화면 일관성"]
      - [AI 호출, "노사마루 → AI 서비스 REST API (사건번호 · 기록목록 전달, 결과 수신)", "이행강제금 계산 · 교정 등 AI 결과를 업무 화면에 반영"]
      - [인증 · 보안, "모바일공무원증 연동, 장기 미접속 잠금 · 동시접속 제한, 출력물 워터마크", "인증 강화, 비정상접근 차단"]
    - {type: subtitle, text: 대상 업무별 개발 방안}
    - type: boxes
      cols: 3
      size: 9.5
      items:
      - {title: 통합 · 연계 범위, desc: "내부 4개 시스템은 기 구축 DB 복제를 활용하고, 외부는 기관별 기존 방식(ESB · EAI) 유지"}
      - {title: 프로토타입, desc: "설계 단계에서 AI 초안 · 대시보드 · 통계 화면 시제품을 만들어 구축지원반 검토 후 확정"}
      - {title: 단계별 오픈, desc: "기능 묶음별로 검증 · 승인 후 운영 반영, 운영 중 시스템 중단 없이 배포"}

  - header: 4. 프레임워크
    h2: 4.1 표준 프레임워크 적용
    h3: 4.1.1 전자정부 표준프레임워크 적용 계획과 예상 문제점 대응
