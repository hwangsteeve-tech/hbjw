      - [계정정보 관리, "계정명 옆 설정 버튼 → LDAP 기본정보 · 권한 확인 · 사인 이미지 관리, 사인은 리포팅 서식 사인 영역에 활용"]
      - [미입력 알림, "업무 단계별 필수 항목 미입력 시 알림 → 사건부로 바로 이동, 하이라이트 · 사이드 패널 · 툴팁 표시"]
