      rows:
      - [공인노무사 자격정보, "자격정보 변경 시 최신 정보 조회", "대리인 신청 · 확인 단계 자격 확인"]
      - [처리결과 통보 사건, "노동위원회규칙 제192조 대상 사건 (해고금지기간 해고, 노동조합 관련, 차별시정, 조정 · 중재) — 통보 결재완료 시", "후속 관리 프로세스 연결"]
