      - text: "(수신처 자동 지정) 사업장 · 노동조합 소재지로 소속기관 · 부서 자동 지정 (일반 → 노사관계지원과, 교원 → 공공노사관계과), 조정사건부에 표시"
      - text: "(기안문 자동 입력 · 이력 표시) 행정관청 통보 기안문에 사건번호 · 당사자 · 신청사항 자동 입력, 대표사업체의 최근 1년 조정 신청 건수와 세부현황 표시"
    - {type: subtitle, text: "노사누리 EAI 정보연계 (SFR-007)"}
    - type: table
      size: 9.5
