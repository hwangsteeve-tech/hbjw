      - {value: "5", unit: 단계, label: "업종 선택 구조\n(대 ~ 세세분류)"}
      - {value: "전수", label: "브라우저 알림 →\n넥사크로 공통 컴포넌트"}

  - header: 2. 기능 요구사항
    h2: 2.3 업무시스템 고도화
    h3: 2.3.5 통계 기능 강화
    req: SFR-009
    summary: "(믿을 수 있는 통계) 현행 약 150종을 전수 진단해 **150종 이내로 재구축**하고, 통계 DB를 표준화해 수치 불일치를 없애며 기관평가 지표 · 로데이터 조회를 자동화함"
    blocks:
    - type: process
      cols: 3
      rows:
      - {label: 수요 조사, items: ["조사관 · 심판담당 · 통계부서 인터뷰", "헬프데스크 · 설문 · 워크숍", "신규 통계 · 산출기준 · 우선순위"], result: "발주기관 승인"}
      - {label: 전수 진단, items: ["현행 약 150종 진단", "유지 · 재구축 / 통폐합 / 폐기 분류", "구축 대상 선정 (150종 이내)"], result: "「통계 구축 대상 목록」"}
      - {label: DB 표준화, items: ["테이블 · 컬럼 · 코드 전수 조사", "명명규칙 · 중복 · 코드 불일치 도출", "표준단어 · 용어 · 도메인 · 코드 적용"], result: "표준 통계 DB (DAR-004)"}
      - {label: 기관평가 통계, items: ["화해 성립률 · 초심 유지률", "조정 성립률 · 직권조사 실적", "평가기간 설정 · 자동 필터링"], result: "자동 산출"}
      - {label: 로데이터 조회, items: ["통계 수치 클릭 → 원본 데이터", "적용 장표 50종 이내 협의 선정", "조회 시점 기준 결과 표시"], result: "검증 가능한 통계"}
    - type: kpi
      items:
      - {value: "150", unit: 종 이내, label: "통계 장표 재구축\n(현행 약 150종 전수 진단)"}
      - {value: "50", unit: 종 이내, label: "로데이터 조회\n적용 장표"}
      - {value: "4", unit: 개 지표 이상, label: "기관평가 통계\n자동 산출"}
    - {type: note, text: "※ 시험운영 · 안정화 기간에 사용자 만족도 · 활용도를 분석해 개선사항을 제안"}
    - type: point
      color: green
      title: 통계 수치 불일치 해소
      text: "같은 지표를 장표마다 다르게 계산하던 산출식을 「통계산출기준」 하나로 정리하고, 표준화된 통계 DB에서만 집계해 어느 장표에서 보아도 같은 수치가 나오게 합니다."

