    req: SFR-017
    summary: "(쟁점 정확도의 기반) 조사보고서·판정서에서 **사건유형 → 쟁점 → 판단기준 → 법령·판례** 관계를 추출해 지식그래프로 만들고, 초안 생성 시 사건별 필수 쟁점을 공급함"
    blocks:
    - type: layers
      height: 1.1
      layers:
      - {name: 사건, items: [사건유형, 신청취지, 당사자, 판정결과], side: "노사마루 사건정보", color: "1C3F7A"}
      - {name: 쟁점, items: [주요쟁점, 당사자 주장, 사실관계], side: "조사보고서 추출", color: "1F4E9A"}
      - {name: 판단, items: [판단기준, 판정 이유, 유사 사건], side: "판정서 추출", color: "2E6FC4"}
      - {name: 근거, items: [법령 · 조문, 대법원 판례, 노동위원회 판정례], side: "법령 · 판례 연계", color: "0E8FD6"}
    - type: table
      size: 9.5
      header: [기능, 구현 방안]
      widths: [3.6, 12.4]
      rows:
      - [모델 설계, "사건유형 · 신청취지 · 당사자 주장 · 주요쟁점 · 사실관계 · 판단기준 · 판정결과 · 법령 · 판례를 개체로 정의, 서식 확대에 대비한 확장 구조"]
      - [자동 생성 · 검증, "비식별화된 문서에서 개체 · 관계 자동 추출, 누락 · 중복 · 잘못된 연결 검증, 관리자 재처리"]
      - [정의 · 관리 화면, "조사관이 사건유형 → 쟁점 → 법령 · 판례 관계를 직접 정의, 노드 · 연결선으로 시각화"]
      - [초안 연계, "이유서 · 답변서 등록 시 핵심 쟁점 분석 → 유사 사건 · 판단기준 · 법령 · 판례 탐색 → 초안 모델에 제공"]
      - [비식별화, "개선된 비식별화 기능을 적용한 문서만 사용, 기존 비식별 문서 재처리"]
