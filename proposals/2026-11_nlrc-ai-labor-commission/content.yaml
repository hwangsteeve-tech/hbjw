      text: "징계해고 사건이면 '해고 존부'가 아닌 '징계 사유 · 양정 · 절차'를 필수 쟁점으로 먼저 제시하는 것처럼, 사건유형별 필수 쟁점을 그래프에서 가져와 무관한 쟁점 생성을 줄입니다."

