    blocks:
    - type: table
      size: 9.5
      header: [기능, 구현 방안]
      widths: [3.8, 12.2]
      rows:
      - [업종코드 현행화, "구 업종코드 적재 현황 분석 → 11차 표준산업분류 매핑 기준 마련 · 변경, 선택 화면 전수조사, 5단계 구조 선택 + 코드 · 업종명 텍스트 검색"]
      - [대리인 선임 횟수, "권리구제대리인 결과회신 시 신청인의 1년간 선임 횟수를 연계기안문에 연동"]
