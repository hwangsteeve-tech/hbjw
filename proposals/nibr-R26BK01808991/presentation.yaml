chapters:
# =====================================================================
- num: Ⅰ
  title: 사업 이해 및 추진 전략
  toc: [사업 이해, 목표시스템, 추진전략 · 방법론]
  slides:
  - kind: visual
    title: 말하면 기록되고, **기록하면 분석되는** 조류 조사
    subtitle: "조사원이 현장에서 손으로 적던 관찰 기록을 음성으로 받아 AI가 바로 표준 레코드로 만들고, 격자 통계 · 보고서 · 철새정보시스템까지 한 흐름으로 — 조사 데이터는 외부로 나가지 않게"
    eval: [사업이해도]
    facts:
      - {label: 발주기관, value: "국립생물자원관\n국가조류연구팀"}
      - {label: 사업기간, value: "계약 후\n180일"}
      - {label: 사업금액, value: "1억 9,900만 원\n(VAT 포함)"}
      - {label: 요구사항, value: "69개\n전부 수용"}

  - title: 1. 사업 이해 — 현장 기록부터 국가 정보 연계까지
    headline: "수기 기록 · 수작업 입력 · 수작업 통계를 **음성 STT · AI 구조화 · 시공간 자동 분석**으로 바꾸고, 결과를 !!철새정보시스템에 바로 이관!!"
    eval: [사업이해도]
    conclusion: "완전 구현 과업과 **실증 프로토타입 · 설계 산출물 과업**을 제안요청서 문구대로 나눠 180일 안에 현장 실증까지"
    columns:
      - w: 1.5
        blocks:
          - type: table
            size: 10
            header: [현장 과제, 대응 방향]
            widths: [3, 7.4]
            rows:
              - [관찰 중 수기 기록, "음성으로 기록 — 관찰을 멈추지 않음"]
              - [바람 · 파도 · 차량 소음, "소음 유형별 전처리 · 도메인 STT"]
              - ["복합 발화 (여러 종 한 번에)", "종 단위 분리 · 개체수 · 행동 · 거리 추출"]
              - [종명 표기 제각각, "국가생물종목록 표준 종명 · 코드"]
              - [통신 음영 지역, "단말 임시 저장 · 무결성 동기화"]
              - [과거 보고서 (HWP · PDF), "문서 구조화 파이프라인 · 표준 스키마"]
      - w: 1
        blocks:
          - type: kpi
            h: 2.2
            items:
              - {value: "69개", label: "요구사항 전부 수용"}
              - {value: "0건", label: "조사 데이터 외부 전송"}
          - type: cards
            cols: 1
            size: 10.5
            items:
              - {title: "① 현장 기록 자동화", desc: ["음성 기록 → 표준 레코드 즉시 생성", "수기 전사 · 재입력 작업 제거"]}
              - {title: "② 시공간 분석 자동화", desc: ["격자 · 거리 구간 · 시계열 통계", "기존 양식 보고서 자동 작성"]}
              - {title: "③ 국가 정보 연계", desc: ["철새정보시스템 연계 API 이관", "표준 종명 · 코드로 재매핑 없음"]}

  - title: 2. 목표시스템 — 6개 영역 구성
    headline: "**현장 입력 → AI 처리 → 문서 구조화 → 데이터 → 분석 · 표출 → 연계**, AI 모델은 !!외부 전송 없이 내부 환경에서만 구동!!"
    eval: [사업이해도, 적용기술]
    conclusion: "발화 1건이 **음성 → 텍스트 → 표준 레코드 → 격자 통계 → 보고서 · 연계**로 이어지고, 단계마다 원본과 결과를 같이 남겨 추적"
    blocks:
      - type: layers
        side_w: 5
        layers:
          - {name: 현장 입력, items: ["모바일 음성 기록 (PWA)", "단말 임시 저장", "재연결 자동 동기화"], side: "기능-009 · 010"}
          - {name: AI 처리, items: ["고소음 STT", "복합 발화 분리 · 구조화", "표준 종명 보정"], side: "기능-009"}
          - {name: 문서 구조화, items: ["HWP · PDF · 이미지 추출", "메타데이터 태깅", "시맨틱 검색"], side: "기능-001 · 002"}
          - {name: 데이터, items: ["표준 스키마 · 데이터 사전", "DQC · 계보 관리", "학습 데이터셋 버전"], side: "데이터-001~009"}
          - {name: 분석 · 표출, items: ["격자 · 시계열 · 교차분석", "보고서 자동 생성 · GIS", "LLM 탐색 · MLOps"], side: "기능-003~008 · 011"}
          - {name: 연계, items: ["철새정보시스템 연계 API", "표준 입출력 포맷"], side: "인터페이스"}

  - title: 3. 4대 추진전략 — 위험을 먼저 시험
    headline: "**소음 · 복합 발화 · 통신 단절 · 데이터 부족** 같은 현장 위험을 !!첫 달에 시험!!하고, 결과에 따라 모델과 화면을 고치는 순서로"
    eval: [추진전략]
    columns:
      - w: 1.4
        blocks:
          - type: cards
            cols: 2
            size: 10.5
            items:
              - {title: "① 현장 우선", desc: ["현장 표본 녹음 · STT 기준 성능 첫 달 측정", "소음 유형별 평가 세트", "결과에 따라 전처리 · 모델 조정"]}
              - {title: "② 표준 우선", desc: ["표준 종명 · 데이터 사전 먼저 확정", "이관 시 재매핑 0건", "데이터 사전 기반 DB 설계"]}
              - {title: "③ 사람 확인 단계", desc: ["신뢰도 낮은 레코드는 '확인 필요'", "AI 결과를 그대로 확정하지 않음", "수정 내역은 재학습 데이터로"]}
              - {title: "④ 내부 AI", desc: ["오픈소스 모델 · 자체 GPU", "외부 상용 AI API 0건", "사업 후에도 자유로운 재학습"]}
      - w: 1
        blocks:
          - type: kpi
            h: 2.2
            items:
              - {value: "1개월", label: "STT 기준 성능 측정"}
              - {value: "3개", label: "마일스톤"}
          - type: kpi
            h: 2.2
            items:
              - {value: "2개월", label: "통합 시험 · 시범운영"}
              - {value: "180일", label: "결과보고"}

  - title: 4. 개발방법론 · 표준프레임워크
    headline: "웹 서비스는 **단계형**, AI 모델은 **반복 실험형** — 같은 산출물 체계로 묶고, 웹은 !!전자정부 표준프레임워크 4.3!! 위에 개발"
    eval: [개발방법론, 표준 프레임워크 적용]
    conclusion: "AI 추론은 **별도 내부 서비스로 분리**해 프레임워크 표준을 지키고, 웹 호환성 · 기술표준은 설계 · 구현 2회 자체 점검"
    blocks:
      - type: flow
        steps:
          - {title: 분석, items: ["요구사항 정의", "현장 표본 수집"]}
          - {title: 설계, items: ["화면 · DB · 보고서", "데이터 표준"]}
          - {title: 개발 · 실험, items: ["웹 단계 개발", "모델 반복 학습"]}
          - {title: 시험, items: ["통합 · 성능 · 보안", "AI 정확도"]}
          - {title: 시범운영, items: ["수기 대비 비교", "개선 반영"]}
      - type: table
        size: 10
        header: [구분, 적용 방안, 주요 산출물]
        widths: [3, 8.6, 4.4]
        rows:
          - [표준프레임워크, "4.3 · 공통컴포넌트 (로그인 · 권한 · 게시)", "표준프레임워크 적용 결과"]
          - [AI 서비스, "내부 추론 서버 분리 · REST 연계", "모델 명세서"]
          - [기술 표준, "웹 호환성 · 모바일 웹 · 정보보호제품 점검표", "기술적용계획표 · 결과표"]
          - [예상 문제, "AI 라이브러리 충돌 → 서비스 분리 · 컨테이너", "문제 대응 기록"]

# =====================================================================
- num: Ⅱ
  title: 제안시스템
  toc: [STT · 구조화, 문서 · 분석, 연계 · 데이터]
  slides:
  - title: 1. 고소음 STT · 복합 발화 구조화
    headline: "소음 유형별 **전처리 · 학습 데이터**로 인식률을 높이고, \"청둥오리 스무 마리 남쪽 이동 / 왜가리 두 마리 채식\"을 !!종 단위 레코드로 분리!!"
    eval: [기능요구사항, 적용기술]
    columns:
      - w: 1
        arrow_after: true
        blocks:
          - type: panel
            title: 고소음 STT
            blocks:
              - type: flow
                steps:
                  - {title: 소음 분석, items: ["유형 · SNR"]}
                  - {title: 전처리, items: ["VAD · 잡음 억제"]}
                  - {title: 도메인 STT, items: ["종명 · 행동 사전"]}
                  - {title: 재학습, items: ["소음 합성 증강"]}
              - type: table
                size: 10
                header: [지표, 목표 (안)]
                widths: [5, 5]
                rows:
                  - [문자 오류율 CER, "【 】% 이하"]
                  - [종명 · 행동명 인식률, "【 】% 이상"]
                  - [소음 구간별 CER, "착수 시 확정"]
      - w: 1
        blocks:
          - type: panel
            title: 발화 구조화 · 종명 보정
            blocks:
              - type: flow
                steps:
                  - {title: 분리, items: ["1 발화 → n 레코드"]}
                  - {title: 추출, items: ["종 · 수 · 행동 · 거리"]}
                  - {title: 표준화, items: ["국가생물종목록"]}
                  - {title: 확인, items: ["낮은 신뢰도 표시"]}
              - type: kpi
                h: 1.9
                items:
                  - {value: "100%", label: "표준 종명 · 코드 적용"}
                  - {value: "0건", label: "이관 시 재매핑"}
              - type: table
                size: 9.5
                header: [종, 개체수, 행동, 거리]
                widths: [2.8, 2.2, 2.8, 2.2]
                rows:
                  - [청둥오리, "20", "이동 (남)", "100m"]
                  - [왜가리, "2", 채식, "—"]
                  - ["(확인 필요)", "후보 n개", "사람 확인", "—"]

  - title: 2. 오프라인 동기화 · 현장 화면
    headline: "통신 음영 지역에서도 **단말에 먼저 저장**하고, 재연결 시 !!자동 전송 · 중복 제거 · 무결성 검증!! 후 저장 완료 표시"
    eval: [기능요구사항, 인터페이스요구사항, 제약사항]
    columns:
      - w: 1.3
        blocks:
          - type: flow
            steps:
              - {title: 기록, items: ["음성 · 좌표 · 시각"]}
              - {title: 임시 저장, items: ["단말 암호화 저장"]}
