  toc: [시스템 구성도, 시스템 구축방안, 소프트웨어 개발방안, 표준화 방안, 시스템 시험 및 운영 방안, 향후 시스템 발전방안]
  slides:
  - header: 1. 시스템 구성도
    h2: 1.1 목표시스템
    h3: 1.1.1 목표시스템 전체 구성도
    req: 표준요구사항-001, 품질요구사항-003
    summary: "(6개 영역 구성) **현장 입력 · AI 처리 · 문서 구조화 · 데이터 · 분석/표출 · 연계** 영역으로 나누고, AI 모델은 외부 전송 없이 내부 환경에서만 구동함"
    blocks:
    - type: layers
      height: 1.45
      layers:
      - {name: 현장 입력, items: ["모바일 웹 음성 입력 (반응형 · PWA)", "오프라인 임시 저장 · 동기화", "GPS 좌표 · 시각"], side: "기능-009 · 010", color: "1C3F7A"}
      - {name: AI 처리, items: ["소음 제거 · 전처리", "도메인 STT", "발화 분리 · 정보 추출", "종명 보정"], side: 기능-009, color: "1F4E9A"}
      - {name: 문서 구조화, items: ["OCR · 표 추출 (PDF · HWP · 이미지)", "정제 · 표준 스키마 적재", "메타데이터 태깅"], side: "기능-001 · 002", color: "2E6FC4"}
      - {name: 데이터, items: ["RDBMS · 공간 DB", "문서 · 검색 색인", "학습 데이터셋 · 모델 저장소"], side: 데이터 요구, color: "0E8FD6"}
      - {name: 분석 · 표출, items: ["격자 · 거리 · 시계열 분석", "보고서 자동 생성", "GIS 대시보드 · LLM 탐색"], side: "기능-003~006 · 011", color: "2BA0C8"}
      - {name: 연계, items: ["철새정보시스템 연계 API", "공공데이터 · 공간정보 연계"], side: "기능-008 · 인터페이스-002", color: "5BAED6"}
    - type: table
      size: 9
      header: [구분, 적용 기술 (안), 비고]
      widths: [3.2, 8.4, 4.4]
      rows:
      - [웹 · 서비스, "전자정부 표준프레임워크 4.3 (Java · Spring), Vue.js 반응형 웹", 표준요구사항-001]
      - [AI 서비스, "Python 기반 내부 추론 서비스, 오픈소스 STT · LLM (상업 이용 허용 라이선스)", 기능요구사항-006]
      - [데이터, "RDBMS + 공간 확장, 문서 · 검색 색인, 캐시", 데이터요구사항-003]
      - [배포, "컨테이너 기반 (발주기관 운영 인프라 범위 내)", 성능요구사항-004]

  - header: 1. 시스템 구성도
    h2: 1.2 데이터 흐름
    h3: 1.2.1 현장 발화에서 보고서까지 데이터 흐름
    req: 기능요구사항-009, 기능요구사항-011
    summary: "(한 번 말하면 끝) 조사원의 발화 1건이 **음성 → 텍스트 → 표준 레코드 → 격자 통계 → 보고서 · 연계**로 이어지며, 단계마다 원본과 결과를 같이 남겨 추적함"
    blocks:
    - type: flow
      steps:
      - {title: 발화 · 녹음, desc: "현장 단말 · 좌표 · 시각"}
      - {title: 전처리, desc: "소음 제거 · 구간 분리"}
      - {title: STT, desc: "도메인 특화 인식"}
      - {title: 구조화, desc: "종 · 개체수 · 행동 · 거리"}
      - {title: 검증 · 보정, desc: "종명 표준 · 신뢰도"}
      - {title: 분석 · 연계, desc: "격자 통계 · 보고서 · API"}
    - type: table
      size: 9
      header: [단계, 입력, 출력, 저장 · 추적]
      widths: [2.6, 4.2, 4.8, 4.4]
      rows:
      - [발화 · 녹음, "음성 · GPS 좌표 · 시각 · 조사자", "음성 파일 + 메타정보", "단말 임시 저장 → 동기화"]
      - [전처리 · STT, 음성 파일, "인식 텍스트 + 단어별 신뢰도", "원본 음성과 연결 보관"]
      - [구조화, 인식 텍스트, "레코드 (종 · 개체수 · 행동 · 거리 · 좌표)", "1 발화 → n 레코드"]
      - [검증 · 보정, 레코드, "표준 종명 · 코드, 확인 필요 표시", "보정 이력 · 사용자 수정 로그"]
      - [분석 · 연계, 확정 레코드, "격자 통계 · 보고서 · 연계 데이터", "데이터 계보 (원본 ↔ 결과)"]
    - type: point
      color: green
      title: 사람 확인 단계
      text: "신뢰도가 낮은 인식 결과는 자동 확정하지 않고 조사원 확인 화면에 표시해, 잘못된 레코드가 통계에 들어가지 않게 함"

  - header: 2. 시스템 구축방안
    h2: 2.1 고소음 STT 및 발화 구조화
    h3: 2.1.1 고소음 환경 대응 음성 인식 (STT)
    req: 기능요구사항-009
    summary: "(소음 → 단계별 대응) 바람 · 파도 · 차량 · 새 울음 등 **소음 유형별로 전처리와 학습 데이터를 나눠** 인식 성능을 끌어올리고, 조류명 · 행동명 사전으로 도메인 오인식을 줄임"
    blocks:
    - type: process
      rows:
      - {label: 소음 분석, items: ["현장 표본 녹음의 소음 유형 · 신호대잡음비 측정", "소음 유형 분류 (바람 · 파도 · 차량 · 생물음)"], result: "소음 프로파일"}
      - {label: 전처리, items: ["음성 구간 검출 (VAD)", "잡음 억제 · 음량 정규화"], result: "정제 음성"}
      - {label: 도메인 STT, items: ["오픈소스 STT 모델 미세조정", "조류명 · 행동명 · 숫자 · 거리 표현 사전 반영"], result: "도메인 STT 모델"}
      - {label: 증강 · 재학습, items: ["깨끗한 발화 + 소음 합성 증강", "오인식 사례 재학습"], result: "모델 버전 이력"}
    - type: table
      size: 9
      header: [평가 항목, 지표, 목표 (안)]
      widths: [4, 6, 6]
      rows:
      - [전체 인식, "문자 오류율 (CER)", "【 】% 이하 — 착수 시 확정"]
      - [도메인 단어, "조류명 · 행동명 인식률", "【 】% 이상 — 착수 시 확정"]
      - [소음 조건별, "소음 수준 구간별 CER", "구간별 목표 협의 확정"]
    - {type: note, text: "※ 목표 수치 · 평가 데이터 규모 · 소음 조건은 테스트요구사항-002에 따라 「시험 및 검수계획서」에서 확정 / 기존 음성 데이터 보유 규모 [회신대기]"}

  - header: 2. 시스템 구축방안
    h2: 2.1 고소음 STT 및 발화 구조화
    h3: 2.1.2 복합 발화 분리 및 정보 구조화
    req: 기능요구사항-009
    summary: "(1 발화 → n 레코드) \"청둥오리 스무 마리 남쪽으로 이동, 백 미터 / 왜가리 두 마리 채식\" 같은 복합 발화를 **종 단위로 나누고 개체수 · 행동 · 거리를 뽑아** 표준 레코드로 만듦"
    blocks:
    - type: flow
      steps:
      - {title: 발화 분리, desc: "종 · 문장 경계 인식"}
      - {title: 개체명 인식, desc: "종 · 수 · 행동 · 거리"}
      - {title: 정규화, desc: "숫자 · 단위 · 방위"}
      - {title: 종명 보정, desc: "국가생물종목록 매칭"}
      - {title: 레코드 생성, desc: "신뢰도 · 확인 표시"}
    - type: table
      size: 9
      header: [추출 항목, 처리 방법, 예시]
      widths: [2.8, 7.6, 5.6]
      rows:
      - [종, "조류명 사전 + 유사 발음 · 약칭 · 지역명 동의어 매칭", "청둥 → 청둥오리"]
      - [개체수, "한글 · 아라비아 숫자 · 어림수(약, 여 마리) 정규화", "스무 마리 → 20"]
      - [행동, "행동 코드 사전 (비행 · 채식 · 휴식 · 이동 등) 분류", "채식 → 행동코드"]
      - [거리 · 방향, "단위 변환 · 거리 구간 분류, 방위 표현 정규화", "백 미터 남쪽 → 100 m · S"]
      - [다중 종, "접속 표현 · 휴지 · 반복 패턴으로 발화 분리", "1 발화 → 2 레코드"]
    - type: point
      color: green
      title: 오인식 방지
      text: "규칙 기반 추출과 내부 LLM 추출을 함께 돌려 결과가 다르거나 신뢰도가 낮으면 '확인 필요'로 표시하고, 조사원이 수정한 내용은 학습 데이터로 다시 씀 (데이터요구사항-004)"

  - header: 2. 시스템 구축방안
    h2: 2.1 고소음 STT 및 발화 구조화
    h3: 2.1.3 국가생물종목록 종명 적용 · 오인식 보정
    req: 기능요구사항-009, 데이터요구사항-001
    summary: "(표준 종명) 인식된 종명을 **국가생물종목록 표준 종명 · 코드로 바꿔 저장**해, 철새정보시스템으로 이관할 때 종명을 다시 맞추는 작업을 없앰"
    blocks:
    - type: table
      size: 9
      header: [보정 단계, 방법, 결과]
      widths: [3, 8.5, 4.5]
      rows:
      - [사전 구축, "국가생물종목록 조류 국명 · 학명 · 코드 + 현장 약칭 · 이명 사전", "종명 사전 (버전 관리)"]
      - [유사도 매칭, "발음 유사도 · 편집 거리로 후보 종명 상위 n개 산출", "후보 + 점수"]
      - [문맥 보정, "서식지 · 계절 · 같이 관찰된 종 정보로 후보 순위 조정", "최종 종명 + 신뢰도"]
      - [사람 확인, "신뢰도 기준 미만은 확인 필요 표시, 조사원 선택", "확정 종명 · 수정 이력"]
      - [사전 갱신, "새 약칭 · 오인식 사례를 사전 · 학습 데이터에 반영", "다음 버전 사전 · 모델"]
    - type: kpi
      items:
      - {value: "100", unit: "%", label: "저장 레코드 표준 종명 · 코드 적용"}
      - {value: "0", unit: 건, label: "이관 시 종명 재매핑 작업"}
      - {value: "n", unit: "개 후보", label: "확인 필요 시 후보 종명 제시"}
    - type: point
      color: navy
      title: 종명 사전 관리
      text: "종명 사전은 국가생물종목록 갱신에 맞춰 버전을 올리고, 이전 레코드의 종 코드는 변경 이력으로 추적해 과거 통계와 일관되게 유지함"

  - header: 2. 시스템 구축방안
    h2: 2.2 오프라인 저장 · 동기화
    h3: 2.2.1 네트워크 단절 대비 임시 저장 및 무결성 동기화
    req: 기능요구사항-010
    summary: "(끊겨도 잃지 않음) 통신 음영 지역에서도 **단말에 먼저 저장**하고, 연결이 돌아오면 자동 전송 · 중복 제거 · 무결성 검증까지 마친 뒤 저장 완료로 표시함"
    blocks:
    - type: process
      rows:
      - {label: 임시 저장, items: ["단말 로컬 저장소에 음성 · 레코드 · 좌표 암호화 저장", "레코드별 고유 ID · 생성 시각 · 해시값 부여"], result: "대기 목록"}
      - {label: 상태 감시, items: ["네트워크 상태 감지, 동기화 대기 건수 표시", "배터리 · 저장공간 경고"], result: "동기화 상태 화면"}
      - {label: 자동 동기화, items: ["연결 재개 시 순서대로 재전송, 실패 시 간격을 늘려 재시도", "대용량 음성은 분할 전송 · 이어받기"], result: "전송 결과"}
      - {label: 무결성 검증, items: ["서버에서 해시 비교 · 고유 ID 중복 제거", "검증 완료 후에만 단말 데이터 정리"], result: "동기화 이력"}
    - type: table
      size: 9
      header: [위험, 대응]
      widths: [5, 11]
      rows:
      - [전송 중 끊김, "분할 전송 · 이어받기, 서버 확인 전까지 단말 원본 유지"]
      - [중복 전송, "레코드 고유 ID 기준 멱등 처리 (같은 건 두 번 저장 안 함)"]
      - [단말 분실, "로컬 저장 데이터 암호화, 원격 잠금 · 앱 재로그인 요구"]

  - header: 2. 시스템 구축방안
    h2: 2.3 과거 조사 데이터 구조화
    h3: 2.3.1 과거 조사 데이터 전처리 · 구조화 자동화 파이프라인
    req: 기능요구사항-001
    summary: "(문서 → 표준 데이터) PDF · HWP · 이미지로 쌓인 과거 조사 보고서에서 **본문 · 표를 뽑아 정제하고 표준 스키마로 적재**하는 파이프라인을 만듦"
    blocks:
    - type: flow
      steps:
      - {title: 수집, desc: "PDF · HWP · 이미지"}
      - {title: 추출, desc: "OCR · 표 구조 인식"}
      - {title: 정제, desc: "오류 보정 · 결측 처리"}
      - {title: 변환, desc: "표준 스키마 매핑"}
      - {title: 적재 · 검증, desc: "정합성 규칙 점검"}
    - type: table
      size: 9
      header: [문서 유형, 추출 방법, 정제 · 변환]
      widths: [3, 6.5, 6.5]
      rows:
      - [HWP · HWPX, "본문 · 표 구조를 직접 파싱 (텍스트 계층 보존)", "표 머리행 → 표준 항목 매핑"]
      - [텍스트 PDF, "텍스트 · 좌표 추출, 표 영역 검출", "줄바꿈 · 병합 셀 복원"]
      - [스캔 PDF · 이미지, "OCR (한글 · 숫자) + 표 구조 인식", "신뢰도 낮은 셀 검토 목록"]
      - [엑셀 · CSV, "시트 · 열 이름 매핑", "단위 · 코드 정규화"]
    - type: point
      color: navy
      title: 범용 전처리 모델
      text: "보고서 양식이 바뀌어도 매핑 설정만 추가하면 되도록 '추출 → 매핑 → 검증'을 분리하고, 매핑 규칙은 관리 화면에서 등록 · 수정함"
    - type: kpi
      items:
      - {value: "3~5", unit: 초 / 건, label: "배치 전처리 · 구조화 처리 (성능요구사항-001)"}
      - {value: "4", unit: 종 형식, label: "HWP · PDF · 이미지 · 엑셀 입력"}

  - header: 2. 시스템 구축방안
    h2: 2.3 과거 조사 데이터 구조화
    h3: 2.3.2 메타데이터 추출 · 태깅 및 시맨틱 검색
    req: 기능요구사항-002
    summary: "(찾기 쉬운 데이터) 조사 **지역 · 기간 · 대상 · 방법 · 주요 결과**를 자동으로 뽑아 태깅하고, 도메인 사전 · 온톨로지로 같은 뜻의 검색어도 찾게 함"
    blocks:
    - type: table
      size: 9
      header: [메타데이터, 추출 방법, 활용]
      widths: [3, 7, 6]
      rows:
      - [조사 지역, "지명 사전 · 행정구역 코드 매칭, 좌표 · 격자 연결", "지도 검색 · 지역별 통계"]
      - [조사 기간, "날짜 표현 정규화 (계절 · 회차 포함)", "시계열 분석 · 기간 필터"]
      - [조사 대상, "종명 사전 · 분류군 계층", "종 · 분류군별 검색"]
      - [조사 방법, "방법 용어 사전 (정점 · 선조사 등)", "방법별 비교 분석"]
      - [주요 결과, "요약 문장 · 핵심 수치 추출", "검색 결과 미리보기"]
    - type: themes
      items:
      - title: 도메인 사전 · 온톨로지
        text: "종 · 지역 · 방법 · 행동 용어를 상하위 · 동의어 관계로 묶어, '오리류'로 찾으면 하위 종까지 나오게 합니다."
        points: ["동의어 · 상하위어", "버전 관리"]
      - title: 품질 검증 · 재학습
        text: "태깅 결과를 사용자가 고치면 그 내용을 모아 태깅 모델을 다시 학습시킵니다."
        points: ["피드백 수집", "재학습 이력"]

  - header: 2. 시스템 구축방안
    h2: 2.4 시공간 분석
    h3: 2.4.1 관찰 좌표 격자화 및 시공간 단위 통계
    req: 기능요구사항-011
    summary: "(좌표 → 격자 → 통계) 관찰 위치를 **표준 격자에 넣고 조사 지점과의 거리 구간을 나눠** 종 · 행동 · 거리별 공간 통계를 자동으로 냄"
    blocks:
    - type: process
      rows:
      - {label: 좌표 정리, items: ["관찰자 위치 + 거리 · 방위 → 대상 추정 좌표", "좌표계 통일 (EPSG 코드 관리)"], result: "관찰 좌표"}
      - {label: 격자화, items: ["발주기관 기준 격자 크기 적용 (복수 크기 지원)", "격자 ID 부여 · 경계 처리"], result: "격자별 레코드"}
      - {label: 거리 구간, items: ["조사 지점 · 경로와의 거리 계산", "거리 구간 분류 (구간 기준 협의)"], result: "거리 구간 코드"}
      - {label: 교차 통계, items: ["격자 × 종 × 행동 × 거리 구간 집계", "시기 · 회차별 비교"], result: "공간 통계 테이블"}
    - type: table
      size: 9
      header: [통계 산출물, 내용, 연계 화면]
      widths: [4, 7.5, 4.5]
      rows:
      - [격자별 종 · 개체수, "격자 단위 출현 종수 · 총 개체수 · 우점종", "분포도 · 밀집도"]
      - [거리 구간 분포, "거리 구간별 관찰 비율 (탐지 거리 분석)", "거리 그래프"]
      - [행동 분포, "격자 · 종별 행동 비율 (채식 · 휴식 · 비행 등)", "행동 지도"]
      - [위험도 기초 자료, "밀집 격자 · 반복 출현 구역 (위험도 산정 입력)", "위험도 지도"]

  - header: 2. 시스템 구축방안
    h2: 2.4 시공간 분석
    h3: 2.4.2 시계열 트렌드 분석 및 예측
    req: 기능요구사항-003
    summary: "(다년 추세) 다년간 조사 데이터로 **종 · 지역별 개체수 추세를 분석하고 예측 구간까지 함께 보여 줌**, 기상 등 외부 변수를 넣은 다변량 분석도 지원함"
    blocks:
    - type: table
      size: 9
      header: [분석, 방법 (안), 결과 표시]
      widths: [3.2, 7.4, 5.4]
      rows:
      - [추세 · 계절성, "시계열 분해 (추세 · 계절 · 잔차)", "추세선 · 계절 패턴 그래프"]
      - [변화점 탐지, "급증 · 급감 시점 탐지", "이상 변화 알림"]
      - [예측, "통계 모델과 딥러닝(LSTM 등) 비교 후 성능이 좋은 모델 선택", "예측값 + 신뢰구간"]
      - [다변량, "기상 등 외부 변수 결합 (연계 가능 범위)", "변수 영향도"]
    - type: callout
      text: "예측 모델은 데이터 기간 · 결측 상황에 따라 성능 차이가 크므로, 기본 통계 모델을 기준선으로 두고 딥러닝 모델이 기준선보다 좋을 때만 채택함 (테스트요구사항-002 기준선 비교)"
    - type: kpi
      items:
      - {value: "2", unit: 종 이상 모델, label: "기준선 대비 성능 비교 후 채택"}
      - {value: "95", unit: "% 구간", label: "예측 신뢰구간 표시 (안)"}
    - type: table
      size: 9
      header: [화면 표시, 내용]
      widths: [4, 12]
      rows:
      - [추세 그래프, "종 · 지역 선택 → 연도별 개체수 · 추세선 · 예측 구간"]
      - [비교, "지역 · 종 간 추세 비교, 계절 패턴 겹쳐 보기"]
      - [비동기 처리, "예측 모델 호출은 비동기로 실행해 대기 없이 결과 알림 (성능요구사항-002)"]

  - header: 2. 시스템 구축방안
    h2: 2.4 시공간 분석
    h3: 2.4.3 다차원 교차 분석 및 상관관계 도출
    req: 기능요구사항-004
    summary: "(공간 × 속성) 공간 데이터와 종 · 행동 · 시기 속성을 **다차원 큐브로 묶어 원하는 축으로 잘라 보고**, 연관 규칙으로 함께 나타나는 패턴을 찾음"
    blocks:
    - type: table
      size: 9
      header: [기능, 내용, 예시]
      widths: [3.2, 7.4, 5.4]
      rows:
      - [GIS 융합 분석, "격자 · 행정구역 · 서식지 공간 데이터와 관찰 속성 결합", "습지 유형별 출현 종"]
      - [다차원 큐브, "종 × 지역 × 시기 × 행동 × 거리 집계, 드릴다운 · 슬라이스", "월별 · 격자별 개체수"]
      - [연관 규칙, "함께 관찰되는 종 · 행동 조합 탐색", "동시 출현 종 쌍"]
      - [차트 생성, "막대 · 선 · 히트맵 · 지도 등 결과 유형별 자동 추천", "분석 결과 차트"]
    - type: themes
      items:
      - title: 미리 계산해 빠르게
        text: "자주 쓰는 집계는 미리 계산해 두어 다차원 교차 분석 1차 결과를 10초 안에 보여 줍니다."
        points: ["사전 집계", "성능요구사항-002"]
      - title: 결과는 차트로 바로
        text: "분석 결과 형태에 맞는 차트를 추천하고 보고서 · 대시보드에 바로 붙입니다."
        points: ["차트 추천", "보고서 연계"]

  - header: 2. 시스템 구축방안
    h2: 2.5 보고서 · 대시보드
    h3: 2.5.1 템플릿 기반 보고서 자동 생성
    req: 기능요구사항-005
    summary: "(기존 양식 그대로) 연구팀이 쓰는 **기존 보고서 템플릿의 표 · 그래프 자리에 분석 결과를 자동으로 채워** 보고서 작성 시간을 줄임"
    blocks:
    - type: flow
      steps:
      - {title: 템플릿 등록, desc: "기존 HWP · DOCX 양식"}
      - {title: 변수 지정, desc: "표 · 그래프 · 수치 자리"}
      - {title: 조건 선택, desc: "기간 · 지역 · 종"}
      - {title: 자동 생성, desc: "표 · 그래프 채움"}
      - {title: 검토 · 출력, desc: "PDF · 원본 형식"}
    - type: table
      size: 9
      header: [항목, 내용]
      widths: [4, 12]
      rows:
      - [템플릿 변수, "표 · 그래프 · 문장 속 수치 자리를 변수로 지정, 변수마다 분석 결과 연결"]
      - [표 · 그래프 생성, "격자 통계 · 종별 개체수 · 추세 그래프를 템플릿 서식에 맞춰 생성"]
      - [시각화 연계, "대시보드 화면을 그대로 보고서 그림으로 내보내기 (프로토타입)"]
      - [확장, "새 보고서 양식은 템플릿 등록 · 변수 연결만으로 추가"]
    - type: point
      color: green
      title: 수작업 비교
      text: "시범운영 때 같은 조사 회차의 보고서를 수작업과 자동 생성으로 각각 만들어 소요시간과 수치 일치 여부를 비교함 (테스트요구사항-002)"
    - type: kpi
      items:
      - {value: "1", unit: 회 클릭, label: "조건 선택 후 보고서 생성"}
      - {value: "2", unit: 종 형식, label: "PDF · 원본 문서 형식 출력"}

  - header: 2. 시스템 구축방안
    h2: 2.5 보고서 · 대시보드
    h3: 2.5.2 GIS 기반 통합 관리자 대시보드
    req: 기능요구사항-005, 인터페이스요구사항-001
    summary: "(지도 + 통계 한 화면) 공간 분포 · 밀집도 · 위험도를 지도에 겹쳐 보고, **지도에서 영역을 고르면 통계가, 통계에서 항목을 고르면 지도가** 함께 바뀌게 함"
    blocks:
    - type: table
      size: 9
      header: [화면 구성, 기능, 사용자]
      widths: [3.4, 8.6, 4]
      rows:
      - [분포 · 밀집도 지도, "격자 단위 개체수 · 종수 히트맵, 시기 슬라이더", "연구자 · 관리자"]
      - [위험도 지도, "밀집 · 반복 출현 구역 등급 표시", "관리자 · 정책 담당"]
      - [조건 검색, "종 · 기간 · 지역 · 행동 · 거리 조건 조합 검색 (프로토타입)", 연구자]
      - [지도-통계 연계, "지도 선택 영역 ↔ 통계 차트 연동 (프로토타입)", 연구자]
      - [맞춤 대시보드, "역할별 기본 화면, 위젯 끌어놓기 편집, PDF · 이미지 출력", 전체]
    - type: themes
      items:
      - title: 역할별 첫 화면
        text: "연구자 · 관리자 · 정책 담당자가 자주 보는 지표가 첫 화면에 오도록 기본 구성을 나눕니다."
        points: ["권한별 위젯", "저장 · 공유"]
      - title: 반응형 · 접근성
        text: "PC · 태블릿에 맞춰 화면이 바뀌고, 웹 접근성 지침을 지켜 누구나 쓸 수 있게 만듭니다."
        points: ["반응형 웹", "KWCAG 준수"]

  - header: 2. 시스템 구축방안
    h2: 2.6 LLM · MLOps
    h3: 2.6.1 LLM 기반 대화형 데이터 탐색 (실증 프로토타입)
    req: 기능요구사항-006, 성능요구사항-003
    summary: "(내부 LLM · 핵심 시나리오) 외부 API 없이 **내부에서 구동하는 오픈소스 LLM**으로 RAG · Text-to-SQL 핵심 시나리오를 실증하고, 전면 서비스용 확장 아키텍처는 설계 산출물로 제출함"
    blocks:
    - type: table
      size: 9
      header: [구성, 내용, 범위]
      widths: [3.2, 8.6, 4.2]
      rows:
      - [LLM, "상업 · 공공 이용 제약 없는 한국어 오픈소스 LLM, 양자화로 내부 GPU 구동", "착수 시 모델 확정"]
      - [RAG, "구조화 데이터 · 분석 결과 · 보고서를 색인해 근거와 함께 답변", "핵심 시나리오"]
      - [Text-to-SQL/API, "자연어 질문 → 조회 SQL · 분석 API 호출로 변환 (허용 테이블 · 함수만)", "핵심 시나리오"]
      - [요약 리포트, "분석 결과 해석 · 요약 문장 자동 생성", "프로토타입"]
      - [확장 설계, "전면 서비스용 아키텍처 · 질의 로그 학습 체계", "설계 산출물"]
    - type: table
      size: 9
      header: [성능 요구 (성능요구사항-003), 대응]
      widths: [6, 10]
      rows:
      - ["최초 응답 2초 이내", "스트리밍 출력, 모델 양자화 · 프롬프트 캐시"]
      - ["답변 · 시각화 10초 이내", "조회 결과 크기 제한 · 사전 집계 활용"]
    - type: point
      color: navy
      title: 환각 방지
      text: "답변에는 근거 레코드 · 문서를 함께 보이고, 근거가 없으면 '확인할 수 없음'으로 답하며, 생성한 SQL은 읽기 전용 계정으로만 실행함"

  - header: 2. 시스템 구축방안
    h2: 2.6 LLM · MLOps
    h3: 2.6.2 분석 모델 관리 및 MLOps (프로토타입)
    req: 기능요구사항-007
    summary: "(모델 생애주기) STT · 구조화 · 예측 모델의 **버전 · 배포 이력 · 성능 저하를 한곳에서 관리**하는 프로토타입을 만들고, 자동 재학습 파이프라인은 설계 산출물로 제출함"
    blocks:
    - type: flow
      steps:
      - {title: 데이터, desc: "학습 · 검증 · 시험 분리"}
      - {title: 학습, desc: "실험 기록"}
      - {title: 평가, desc: "기준선 비교"}
      - {title: 등록 · 배포, desc: "버전 · 승인"}
      - {title: 감시, desc: "드리프트 알림"}
    - type: table
      size: 9
      header: [기능, 프로토타입 구현, 설계 산출물]
      widths: [3.4, 6.6, 6]
      rows:
      - [버전 관리, "모델 · 데이터셋 · 설정 버전 등록, 배포 이력 조회", "-"]
      - [성능 감시, "주요 지표 추이, 기준 이하 하락 시 알림", "드리프트 지표 정의"]
      - [재학습, "수동 재학습 실행 · 결과 비교", "신규 데이터 자동 재학습 파이프라인"]
      - [배포, "승인 후 교체 · 이전 버전 되돌리기", "운영 인프라 연동 설계"]
