name: 크제비 추천 공고 리포트

on:
  schedule:
    # 매일 09:30 KST (크제비 알림메일은 09:00 KST 전후 도착)
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "최근 며칠치 메일을 분석할지"
        default: "1"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 리포트 생성 및 발송
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          TZ: Asia/Seoul
        run: python -m kjebi_recommender --days "${{ github.event.inputs.days || '1' }}" --out reports --send
      - uses: actions/upload-artifact@v4
        with:
          name: kjebi-report
          path: reports/
